<script type="text/babel" data-type="module">
const{useState,useEffect,useCallback}=React;
const gid=()=>Math.random().toString(36).slice(2,10);
const td=()=>new Date().toISOString().split("T")[0];
const DN=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
const SD=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
const MT=["Colazione","Spuntino Mattina","Pranzo","Spuntino Pomeriggio","Cena"];
const ME=["🌅","🍎","🍝","🍊","🌙"];
const BP=["Vita","Fianchi","Petto","Braccia","Cosce","Polpacci"];
const AL=[{id:"sedentary",l:"Sedentario",d:"Poco/nessun esercizio",f:1.2,e:"🪑"},{id:"light",l:"Leggero",d:"1-3 giorni/sett",f:1.375,e:"🚶"},{id:"moderate",l:"Moderato",d:"3-5 giorni/sett",f:1.55,e:"🏃"},{id:"active",l:"Attivo",d:"6-7 giorni/sett",f:1.725,e:"💪"},{id:"veryActive",l:"Molto Attivo",d:"Intenso quotidiano",f:1.9,e:"🔥"}];
const GOL=[{id:"lose",l:"Perdere peso",e:"🍃"},{id:"maintain",l:"Mantenere",e:"⚖️"},{id:"gain",l:"Aumentare massa",e:"💪"}];

const SK="nt6";
const defP=()=>({name:"",sex:"",birthDate:"",height:null,weight:null,goal:"",activityLevel:"",targetWeight:null,allergies:"",waterGoal:8,onboarded:false,nutri:{name:"",phone:"",email:"",address:"",nextAppt:"",notes:""}});
const defD=()=>({profile:defP(),dietType:null,dietSchema:null,weeklyPlan:{},mealPlans:{},weightLog:[],measurements:[],water:{},mealChecks:{},activities:[],diary:{},shoppingChecks:{}});
const lo=()=>{try{const r=localStorage.getItem(SK);return r?{...defD(),...JSON.parse(r)}:defD();}catch(e){return defD();}};
const sv=d=>localStorage.setItem(SK,JSON.stringify(d));
const bmi=(w,h)=>{if(!w||!h)return null;return(w/((h/100)**2)).toFixed(1);};
const bmiC=b=>{const v=parseFloat(b);if(v<18.5)return{l:"Sottopeso",c:"var(--water)"};if(v<25)return{l:"Normopeso",c:"var(--ok)"};if(v<30)return{l:"Sovrappeso",c:"var(--wa)"};return{l:"Obesità",c:"var(--er)"};};
const bmr=(w,h,a,s)=>{if(!w||!h||!a)return 0;return s==="F"?447.593+9.247*w+3.098*h-4.330*a:88.362+13.397*w+4.799*h-5.677*a;};
const age=bd=>{if(!bd)return 0;const b=new Date(bd),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return a;};

/* ── PDF text extraction ── */
async function pdfText(file){const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let t="";for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();let lastY=null;c.items.forEach(it=>{if(lastY!==null&&Math.abs(it.transform[5]-lastY)>5)t+="\n";t+=it.str;lastY=it.transform[5];});t+="\n\n";}return t;}
const readTxt=f=>new Promise((r,j)=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.onerror=j;fr.readAsText(f);});

/* ── Smart diet parser for free-form schemas ── */
function parseSchema(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(l=>l.length>1);
  const mealR=[{r:/prima\s*colazione|^colazione/i,t:"Colazione"},{r:/spuntino\s*(di\s+)?(meta|metà)?\s*mattin/i,t:"Spuntino Mattina"},{r:/meta['']?\s*mattin/i,t:"Spuntino Mattina"},{r:/^pranzo/i,t:"Pranzo"},{r:/spuntino\s*(di\s+)?(meta|metà)?\s*pomerig/i,t:"Spuntino Pomeriggio"},{r:/meta['']?\s*pomerig/i,t:"Spuntino Pomeriggio"},{r:/^cena/i,t:"Cena"}];
  const noteR=[/^condimento/i,/^avvertenz/i,/^raccomandazion/i];
  const subR=[/^primo\b/i,/^secondo\b/i,/^contorno/i,/^frutta/i];
  const sections=[];let cur=null;let curSub=null;let items=[];let notes=[];let nutri={};
  const flush=()=>{if(cur&&items.length){sections.push({meal:cur,sub:curSub,items:[...items]});}items=[];};
  let inNotes=false;
  lines.forEach(l=>{
    // Extract contact info
    const phoneM=l.match(/(?:cell|tel)[:\s]*([+\d\s]{8,})/i);if(phoneM)nutri.phone=phoneM[1].trim();
    const emailM=l.match(/(?:email|mail)[:\s]*([^\s,]+@[^\s,]+)/i);if(emailM)nutri.email=emailM[1].trim();
    // Check if note section
    if(noteR.some(r=>r.test(l))){flush();cur=null;inNotes=true;notes.push("**"+l+"**");return;}
    if(inNotes){notes.push(l);return;}
    // Check if meal header
    const mm=mealR.find(p=>p.r.test(l));
    if(mm){flush();cur=mm.t;curSub=null;inNotes=false;return;}
    // Check sub-category
    const sm=subR.find(r=>r.test(l));
    if(sm&&cur){flush();curSub=l.replace(/^(primo|secondo|contorno|frutta)\s*/i,"").replace(/^[:\s]+/,"").trim();curSub=l.match(/^(primo|secondo|contorno|frutta)/i)?.[0]||null;return;}
    // Food item
    if(cur){
      let clean=l.replace(/^[-–•*·▪►■]\s*/,"").replace(/^\d+[.)]\s*/,"").trim();
      if(clean.length>2)items.push({text:clean,sub:curSub,isAlt:/^oppure\b/i.test(clean)});
    }
  });
  flush();
  // Group by meal
  const meals={};
  sections.forEach(s=>{if(!meals[s.meal])meals[s.meal]={items:[],subs:{}};
    s.items.forEach(it=>{if(it.sub){if(!meals[s.meal].subs[it.sub])meals[s.meal].subs[it.sub]=[];meals[s.meal].subs[it.sub].push(it);}else{meals[s.meal].items.push(it);}});
  });
  return{meals,notes,nutri};
}

/* ── Weekly plan parser ── */
function parseWeekly(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  const dayP=[/^(luned[iì]|marted[iì]|mercoled[iì]|gioved[iì]|venerd[iì]|sabato|domenica)\b/i,/^giorno\s*(\d+)/i];
  const mealP=[{r:/^colazione/i,t:"Colazione"},{r:/^spuntino\s*(matt|di\s*matt)/i,t:"Spuntino Mattina"},{r:/^pranzo/i,t:"Pranzo"},{r:/^spuntino\s*(pom|di\s*pom)/i,t:"Spuntino Pomeriggio"},{r:/^spuntino/i,t:"Spuntino Mattina"},{r:/^merenda/i,t:"Spuntino Pomeriggio"},{r:/^cena/i,t:"Cena"}];
  let cur=null;const days=[];let tmp=[];
  const flush=()=>{if(tmp.length){days.push([...tmp]);tmp=[];}};
  lines.forEach(l=>{if(dayP.some(p=>p.test(l))){flush();cur=null;return;}const mm=mealP.find(p=>p.r.test(l));if(mm){cur=mm.t;const af=l.replace(mm.r,"").replace(/^[\s:;–\-→]+/,"").trim();if(af.length>2)tmp.push({mealType:cur,food:af});return;}if(cur){const c=l.replace(/^[-–•*·]\s*/,"").replace(/^\d+[.)]\s*/,"").trim();if(c.length>2)tmp.push({mealType:cur,food:c});}});
  flush();if(!days.length&&tmp.length)days.push(tmp);return days;
}

/* ── Excel export ── */
function exportXls(data){
  const wb=XLSX.utils.book_new();const p=data.profile;
  if(data.weightLog.length){XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.weightLog.map(w=>({Data:w.date,"Peso (kg)":w.value,BMI:p.height?bmi(w.value,p.height):""}))),"Peso");}
  if(data.measurements.length){XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.measurements.map(m=>{const r={Data:m.date};BP.forEach(b=>{if(m[b])r[b+" (cm)"]=parseFloat(m[b]);});return r;})),"Misurazioni");}
  const allM=[];Object.entries(data.mealPlans).forEach(([d,ms])=>ms.forEach(m=>allM.push({Data:d,Pasto:m.mealType,Alimenti:m.food})));if(allM.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(allM),"Pasti");
  const wE=Object.entries(data.water).map(([d,v])=>({Data:d,Bicchieri:v}));if(wE.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(wE),"Acqua");
  if(data.activities.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.activities.map(a=>({Data:a.date,Attività:a.activity,"Durata (min)":parseInt(a.duration)||0}))),"Attività");
  if(data.dietSchema){const rows=[];Object.entries(data.dietSchema.meals).forEach(([meal,d])=>{rows.push({Pasto:meal,Categoria:"",Alimento:""});d.items.forEach(it=>rows.push({Pasto:"",Categoria:"",Alimento:it.text}));Object.entries(d.subs).forEach(([sub,its])=>{rows.push({Pasto:"",Categoria:sub,Alimento:""});its.forEach(it=>rows.push({Pasto:"",Categoria:"",Alimento:it.text}));});});if(rows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Schema Dieta");}
  const prof=[{C:"Nome",V:p.name},{C:"Sesso",V:p.sex==="M"?"Maschio":"Femmina"},{C:"Nascita",V:p.birthDate},{C:"Altezza",V:p.height+" cm"},{C:"Peso iniziale",V:p.weight+" kg"},{C:"Obiettivo",V:p.goal},{C:"Allergie",V:p.allergies||""},{C:"Nutrizionista",V:p.nutri?.name||""},{C:"Tel",V:p.nutri?.phone||""},{C:"Email",V:p.nutri?.email||""}];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(prof),"Profilo");
  XLSX.writeFile(wb,"NutriTrack_Export.xlsx");
}

/* ── UI components ── */
const Ic=({d,s=22,c="currentColor"})=>(<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>);
const ic={home:"M3 12l9-9 9 9M5 10v10a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V10",cal:"M3 4h18v18H3zM16 2v4M8 2v4M3 10h18",water:"M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z",cart:"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6M9 22a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM20 22a1 1 0 1 0 0-2 1 1 0 0 0 0 2z",chart:"M18 20V10M12 20V4M6 20v-6",plus:"M12 5v14M5 12h14",chk:"M20 6L9 17l-5-5",del:"M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2",cL:"M15 18l-6-6 6-6",cR:"M9 18l6-6-6-6",swap:"M7 16V4M7 4l-4 4M7 4l4 4M17 8v12M17 20l-4-4M17 20l4-4",up:"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12",edit:"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z",run:"M13 4a1 1 0 1 0 2 0 1 1 0 0 0-2 0zM7 21l3-4 2 2 4-5 4 3",user:"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",list:"M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"};
function Inp({label,...p}){return(<label className="block mb-4">{label&&<span className="text-sm font-bold mb-1 block" style={{color:"var(--tx2)"}}>{label}</span>}<input className="w-full rounded-2xl px-4 py-3 outline-none" style={{background:"var(--m)",color:"var(--tx)",border:"2px solid var(--bd)",fontSize:"16px"}} {...p}/></label>);}
function Btn({children,v="primary",cls="",...p}){const s={primary:{background:"var(--ac)",color:"#fff"},secondary:{background:"var(--m)",color:"var(--tx)"},danger:{background:"var(--er)",color:"#fff"},success:{background:"var(--sage)",color:"#fff"}};return<button className={`px-5 py-3 rounded-2xl font-extrabold transition-all active:scale-95 ${cls}`} style={{...s[v],fontSize:"15px"}} {...p}>{children}</button>;}
function Mdl({open,onClose,title,children}){if(!open)return null;return(<div className="fixed inset-0 z-50 flex items-end justify-center" style={{background:"rgba(0,0,0,.35)",backdropFilter:"blur(6px)"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}><div className="rounded-t-3xl w-full max-h-[85vh] overflow-y-auto shadow-xl" style={{background:"var(--cd)",color:"var(--tx)",animation:"fadeUp .3s ease"}}><div className="flex items-center justify-between p-5 border-b sticky top-0 z-10" style={{borderColor:"var(--bd)",background:"var(--cd)"}}><h3 className="font-extrabold text-lg">{title}</h3><button onClick={onClose} className="w-9 h-9 rounded-full flex items-center justify-center" style={{background:"var(--m)"}}>✕</button></div><div className="p-5">{children}</div></div></div>);}
function Chrt({data,w=300,h=130,color="var(--ac)",label,unit=""}){if(!data.length)return<div className="text-center opacity-40 py-6 font-semibold">Nessun dato</div>;const vals=data.map(d=>d.value),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1,pd=28;const pts=data.map((d,i)=>({x:pd+(i/Math.max(data.length-1,1))*(w-2*pd),y:h-pd-((d.value-mn)/rng)*(h-2*pd-10),...d}));const line=pts.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ");const area=line+` L${pts[pts.length-1].x},${h-pd} L${pts[0].x},${h-pd} Z`;const gx="g"+(label||"x").replace(/\s/g,"");return(<div className="flex flex-col items-center">{label&&<div className="text-sm font-bold mb-1" style={{color:"var(--tx2)"}}>{label}</div>}<svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}><defs><linearGradient id={gx} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity=".2"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs><path d={area} fill={`url(#${gx})`}/><path d={line} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>{pts.map((p,i)=>(<g key={i}><circle cx={p.x} cy={p.y} r="5" fill={color} stroke="var(--cd)" strokeWidth="2"/><text x={p.x} y={p.y-14} textAnchor="middle" fontSize="11" fill={color} fontWeight="800">{p.value}{unit}</text><text x={p.x} y={h-6} textAnchor="middle" fontSize="9" fill="var(--tx2)" fontWeight="600">{p.date?p.date.slice(5):""}</text></g>))}</svg></div>);}
function BMIGauge({val}){if(!val)return null;const v=parseFloat(val),cat=bmiC(val),pct=Math.min(100,Math.max(0,((v-15)/25)*100));return(<div className="flex flex-col items-center gap-2"><div className="text-3xl font-black" style={{color:cat.c}}>{val}</div><div className="text-sm font-extrabold" style={{color:cat.c}}>{cat.l}</div><div className="w-full h-3 rounded-full overflow-hidden flex" style={{background:"var(--m)"}}><div style={{width:"18.5%",background:"var(--water)"}} className="h-full"/><div style={{width:"26%",background:"var(--ok)"}} className="h-full"/><div style={{width:"20%",background:"var(--wa)"}} className="h-full"/><div style={{flex:1,background:"var(--er)"}} className="h-full"/></div><div className="w-full relative h-4"><div className="absolute w-4 h-4 rounded-full border-2 shadow" style={{left:`${pct}%`,top:"-10px",transform:"translateX(-50%)",background:cat.c,borderColor:"#fff"}}/></div><div className="flex justify-between w-full text-[10px] font-bold" style={{color:"var(--tx2)"}}><span>Sotto</span><span>Normo</span><span>Sovra</span><span>Obesità</span></div></div>);}

/* ════════════ ONBOARDING ════════════ */
function Onboarding({onComplete}){
  const[step,setStep]=useState(0);const[p,setP]=useState(defP());const[dir,setDir]=useState(1);const T=8;
  const next=()=>{setDir(1);setStep(s=>Math.min(s+1,T-1));};const prev=()=>{setDir(-1);setStep(s=>Math.max(s-1,0));};
  const canN=()=>{if(step===0)return p.name.trim().length>0;if(step===1)return!!p.sex;if(step===2)return!!p.birthDate;if(step===3)return p.height>0;if(step===4)return p.weight>0;if(step===5)return!!p.goal;if(step===6)return!!p.activityLevel;return true;};
  const a=age(p.birthDate),b=bmr(p.weight,p.height,a,p.sex),af=AL.find(x=>x.id===p.activityLevel),tdee=Math.round(b*(af?af.f:1.2)),myBmi=bmi(p.weight,p.height);
  const renderStep=()=>{switch(step){
    case 0:return(<div className="space-y-5" style={{animation:"fadeUp .4s ease"}}><div className="text-6xl text-center" style={{animation:"pulse 2s infinite"}}>🌿</div><h2 className="text-2xl font-black text-center">Come ti chiami?</h2><p className="text-center font-semibold" style={{color:"var(--tx2)"}}>Iniziamo il tuo percorso benessere</p><Inp placeholder="Il tuo nome" value={p.name} onChange={e=>setP({...p,name:e.target.value})}/></div>);
    case 1:return(<div className="space-y-5" style={{animation:"fadeUp .4s ease"}}><h2 className="text-2xl font-black text-center">Sesso biologico</h2><div className="grid grid-cols-2 gap-4">{[{id:"M",l:"Maschio",e:"🙋‍♂️"},{id:"F",l:"Femmina",e:"🙋‍♀️"}].map(s=>(<button key={s.id} onClick={()=>setP({...p,sex:s.id})} className="rounded-2xl p-5 text-center shadow-sm transition-all" style={{background:p.sex===s.id?"var(--ac)":"var(--cd)",color:p.sex===s.id?"#fff":"var(--tx)",border:`2px solid ${p.sex===s.id?"var(--ac)":"var(--bd)"}`}}><div className="text-4xl mb-2">{s.e}</div><div className="font-extrabold">{s.l}</div></button>))}</div></div>);
    case 2:return(<div className="space-y-5" style={{animation:"fadeUp .4s ease"}}><div className="text-5xl text-center">🎂</div><h2 className="text-2xl font-black text-center">Data di nascita</h2><Inp type="date" value={p.birthDate} onChange={e=>setP({...p,birthDate:e.target.value})}/>{p.birthDate&&<div className="text-center text-xl font-black" style={{color:"var(--ac)"}}>{a} anni</div>}</div>);

    case 7:return(<div className="space-y-4" style={{animation:"fadeUp .4s ease"}}><div className="text-4xl text-center">🎉</div><h2 className="text-xl font-black text-center">Pronto, {p.name}!</h2><Inp label="Allergie (opzionale)" placeholder="Es: lattosio, glutine" value={p.allergies} onChange={e=>setP({...p,allergies:e.target.value})}/><div className="card space-y-2">{[["Sesso",p.sex==="M"?"Maschio":"Femmina"],["Età",a+" anni"],["Altezza",p.height+" cm"],["Peso",p.weight+" kg"]].map(([k,v])=>(<div key={k} className="flex justify-between text-sm"><span style={{color:"var(--tx2)"}}>{k}</span><span className="font-extrabold">{v}</span></div>))}<div className="flex justify-between text-sm"><span style={{color:"var(--tx2)"}}>BMI</span><span className="font-extrabold" style={{color:bmiC(myBmi).c}}>{myBmi} · {bmiC(myBmi).l}</span></div><div className="border-t pt-2 mt-1" style={{borderColor:"var(--bd)"}}><div className="flex justify-between text-sm"><span style={{color:"var(--tx2)"}}>BMR</span><span className="font-extrabold">{Math.round(b)} kcal</span></div><div className="flex justify-between text-sm"><span style={{color:"var(--tx2)"}}>TDEE</span><span className="font-extrabold" style={{color:"var(--ac)"}}>{tdee} kcal</span></div></div></div></div>);
    default:return null;}};
  return(<div className="flex flex-col h-full" style={{background:"var(--bg)"}}>
    <div className="flex-shrink-0 px-5 pt-4 pb-2"><div className="flex items-center gap-2">{step>0&&<button onClick={prev} className="p-1 opacity-40"><Ic d={ic.cL} s={22}/></button>}<div className="flex-1 flex gap-1.5">{Array.from({length:T}).map((_,i)=>(<div key={i} className="flex-1 h-2 rounded-full" style={{background:i<=step?"var(--ac)":"var(--bd)"}}/>))}</div><span className="text-xs font-bold ml-2" style={{color:"var(--tx2)"}}>{step+1}/{T}</span></div></div>
    <div className="flex-1 overflow-y-auto px-5 py-3"><div key={step} style={{animation:dir>0?"siR .3s":"siL .3s"}}>{renderStep()}</div></div>
    <div className="flex-shrink-0 px-5 pb-5 pt-2" style={{background:"linear-gradient(transparent,var(--bg) 40%)"}}>{step<T-1?<Btn cls="w-full" onClick={next} disabled={!canN()} style={{opacity:canN()?1:.35}}>Continua →</Btn>:<Btn cls="w-full" v="success" onClick={()=>onComplete({...p,onboarded:true})}>Iniziamo! 🌿</Btn>}</div>
  </div>);}

/* ════════════ MAIN APP ════════════ */
function App(){
  const[data,setData]=useState(lo);const[tab,setTab]=useState("today");const[sel,setSel]=useState(td());const[modal,setModal]=useState(null);const[fs,setFs]=useState({});const[impRes,setImpRes]=useState(null);const[loading,setLoading]=useState(false);
  useEffect(()=>{sv(data);},[data]);const up=useCallback(fn=>setData(prev=>{const n={...prev};fn(n);return n;}),[]);
  const pr=data.profile,myAge=age(pr.birthDate),myBmr=bmr(pr.weight,pr.height,myAge,pr.sex),myAf=AL.find(x=>x.id===pr.activityLevel),myTdee=Math.round(myBmr*(myAf?myAf.f:1.2));
  const latW=data.weightLog.length?data.weightLog[data.weightLog.length-1].value:pr.weight,curBmi=bmi(latW,pr.height);
  const tM=data.mealPlans[sel]||[],tW=data.water[sel]||0,tC=data.mealChecks[sel]||{},dow=DN[new Date(sel+"T12:00:00").getDay()];
  if(!pr.onboarded)return<Onboarding onComplete={profile=>up(d=>{d.profile=profile;d.weightLog.push({date:td(),value:profile.weight});})}/>;

  /* file handler */
  const handleFile=async e=>{const f=e.target.files?.[0];if(!f)return;setLoading(true);setImpRes(null);try{let t="";if(f.type==="application/pdf"||f.name.endsWith(".pdf"))t=await pdfText(f);else t=await readTxt(f);if(!t.trim()){setImpRes({ok:false,msg:"Nessun testo trovato"});setLoading(false);return;}setImpRes({ok:true,msg:"Testo estratto!",raw:t});}catch(err){setImpRes({ok:false,msg:"Errore: "+err.message});}setLoading(false);};

  /* ── TODAY ── */
  const renderToday=()=>(<div className="space-y-4">
    <div className="flex items-center justify-between"><button onClick={()=>{const d=new Date(sel+"T12:00:00");d.setDate(d.getDate()-1);setSel(d.toISOString().split("T")[0]);}} className="p-2.5 rounded-2xl shadow-sm" style={{background:"var(--cd)"}}><Ic d={ic.cL} s={18}/></button><div className="text-center"><div className="text-lg font-extrabold">{dow}</div><div className="text-xs font-semibold" style={{color:"var(--tx2)"}}>{sel}</div></div><button onClick={()=>{const d=new Date(sel+"T12:00:00");d.setDate(d.getDate()+1);setSel(d.toISOString().split("T")[0]);}} className="p-2.5 rounded-2xl shadow-sm" style={{background:"var(--cd)"}}><Ic d={ic.cR} s={18}/></button></div>
    <div className="grid grid-cols-4 gap-2">{[{v:latW||"—",l:"Peso",c:"var(--terra)"},{v:curBmi||"—",l:"BMI",c:curBmi?bmiC(curBmi).c:"var(--ac)"},{v:myTdee,l:"kcal",c:"var(--wa)"},{v:`${tW}/${pr.waterGoal||8}`,l:"Acqua",c:"var(--water)"}].map((s,i)=>(<div key={i} className="card text-center p-2.5"><div className="text-lg font-black" style={{color:s.c}}>{s.v}</div><div className="text-[10px] font-bold" style={{color:"var(--tx2)"}}>{s.l}</div></div>))}</div>
    <div className="card"><div className="flex items-center justify-between mb-3"><div className="flex items-center gap-2"><span>💧</span><span className="font-extrabold">Acqua</span></div><span className="font-black" style={{color:"var(--water)"}}>{tW}/{pr.waterGoal||8}</span></div><div className="flex gap-2">{Array.from({length:pr.waterGoal||8}).map((_,i)=>(<button key={i} onClick={()=>up(d=>{d.water[sel]=i<tW?i:i+1;})} className="flex-1 h-8 rounded-xl" style={{background:i<tW?"var(--water)":"var(--m)",opacity:i<tW?1:.3}}/>))}</div></div>
    <div className="card"><div className="flex items-center justify-between mb-3"><span className="font-extrabold">🍽️ Pasti di oggi</span><div className="flex gap-2"><button onClick={()=>setModal("import")} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:"var(--m)"}}><Ic d={ic.up} s={16}/></button><button onClick={()=>{setFs({date:sel,mealType:"Colazione",food:"",alt:""});setModal("addMeal");}} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.plus} s={16} c="#fff"/></button></div></div>
    {tM.length===0?(<div className="text-center py-4 opacity-40"><p className="font-semibold mb-3">{data.dietSchema?"Consulta lo Schema e aggiungi i pasti scelti":"Nessun pasto pianificato"}</p><div className="flex gap-2 justify-center">{data.dietSchema&&<Btn v="secondary" onClick={()=>setTab("schema")}>📋 Schema</Btn>}<Btn v="secondary" onClick={()=>setModal("import")}>📄 Carica</Btn></div></div>):(<div className="space-y-2">{MT.map((type,ti)=>{const ml=tM.filter(m=>m.mealType===type);if(!ml.length)return null;return(<div key={type} className="rounded-xl p-3" style={{background:"var(--m)"}}><div className="text-[10px] font-black tracking-wider mb-2 flex items-center gap-1.5" style={{color:"var(--tx2)"}}><span>{ME[ti]}</span>{type.toUpperCase()}</div>{ml.map(meal=>(<div key={meal.id} className="flex items-start gap-2.5 mb-1.5"><button onClick={()=>up(d=>{if(!d.mealChecks[sel])d.mealChecks[sel]={};d.mealChecks[sel][meal.id]=!d.mealChecks[sel]?.[meal.id];})} className="mt-0.5 w-6 h-6 rounded-lg flex items-center justify-center flex-shrink-0" style={{background:tC[meal.id]?"var(--ac)":"transparent",border:`2px solid ${tC[meal.id]?"var(--ac)":"var(--bd)"}`}}>{tC[meal.id]&&<Ic d={ic.chk} s={12} c="#fff"/>}</button><div className="flex-1 min-w-0"><div className={`font-semibold ${tC[meal.id]?"line-through opacity-35":""}`}>{meal.food}</div></div><button onClick={()=>up(d=>{d.mealPlans[sel]=d.mealPlans[sel].filter(m=>m.id!==meal.id);})} className="opacity-20 hover:opacity-70"><Ic d={ic.del} s={14}/></button></div>))}</div>);})}</div>)}</div>
  </div>);

  /* ── SCHEMA ── */
  const renderSchema=()=>(<div className="space-y-4">
    <div className="flex items-center justify-between"><h2 className="font-extrabold text-lg">📋 {data.dietType==="weekly"?"Piano Settimanale":"Schema Dieta"}</h2><div className="flex gap-2"><button onClick={()=>setModal("import")} className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:"var(--m)"}}><Ic d={ic.up} s={14}/></button></div></div>
    {!data.dietSchema&&!Object.keys(data.weeklyPlan).length?(<div className="text-center py-10"><p className="font-semibold opacity-40 mb-3">Nessuna dieta caricata</p><Btn v="secondary" onClick={()=>setModal("import")}>📄 Carica dieta</Btn></div>
    ):data.dietType==="free"&&data.dietSchema?(<div className="space-y-3">
      <p className="text-sm font-semibold" style={{color:"var(--tx2)"}}>Opzioni per ogni pasto — tocca un alimento per aggiungerlo a oggi</p>
      {Object.entries(data.dietSchema.meals).map(([meal,d],mi)=>(<div key={meal} className="card">
        <div className="font-extrabold mb-2 flex items-center gap-2"><span>{ME[MT.indexOf(meal)]||"📌"}</span>{meal}</div>
        {d.items.map((it,ii)=>(<button key={ii} onClick={()=>{up(dd=>{if(!dd.mealPlans[sel])dd.mealPlans[sel]=[];dd.mealPlans[sel].push({id:gid(),mealType:meal,food:it.text});});}} className="w-full text-left text-sm font-semibold py-1.5 pl-3 mb-1 rounded-lg hover:opacity-70 transition-all" style={{borderLeft:it.isAlt?"3px solid var(--wa)":"3px solid var(--ac)"}}>{it.text}</button>))}
        {Object.entries(d.subs).map(([sub,its])=>(<div key={sub} className="mt-2"><div className="text-xs font-black tracking-wider mb-1" style={{color:"var(--tx2)"}}>{sub.toUpperCase()}</div>{its.map((it,ii)=>(<button key={ii} onClick={()=>{up(dd=>{if(!dd.mealPlans[sel])dd.mealPlans[sel]=[];dd.mealPlans[sel].push({id:gid(),mealType:meal,food:it.text});});}} className="w-full text-left text-sm font-semibold py-1.5 pl-3 mb-1 rounded-lg hover:opacity-70" style={{borderLeft:it.isAlt?"3px solid var(--wa)":"3px solid var(--ac)"}}>{it.text}</button>))}</div>))}
      </div>))}
      {data.dietSchema.notes.length>0&&<div className="card"><div className="font-extrabold mb-2">📌 Note del nutrizionista</div>{data.dietSchema.notes.map((n,i)=>(<p key={i} className="text-sm mb-1" style={{color:n.startsWith("**")?"var(--tx)":"var(--tx2)",fontWeight:n.startsWith("**")?800:600}}>{n.replace(/\*\*/g,"")}</p>))}</div>}
    </div>
    ):data.dietType==="weekly"?(<div className="space-y-3">
      <div className="flex gap-1.5 overflow-x-auto pb-1">{["Lun","Mar","Mer","Gio","Ven","Sab","Dom"].map((d,i)=>{const dayK=String(i);const has=(data.weeklyPlan[dayK]||[]).length>0;return(<button key={d} onClick={()=>setFs({...fs,wpDay:dayK})} className="flex-1 min-w-[42px] rounded-xl py-2 text-center shadow-sm" style={{background:fs.wpDay===dayK?"var(--ac)":"var(--cd)",color:fs.wpDay===dayK?"#fff":"var(--tx)"}}><div className="text-[10px] font-bold">{d}</div>{has&&<div className="w-1.5 h-1.5 rounded-full mx-auto mt-0.5" style={{background:fs.wpDay===dayK?"#fff":"var(--ac)"}}/>}</button>);})}</div>
      {(data.weeklyPlan[fs.wpDay||"0"]||[]).map((m,i)=>(<div key={i} className="card p-3"><div className="text-[10px] font-black tracking-wider" style={{color:"var(--tx2)"}}>{m.mealType.toUpperCase()}</div><div className="font-semibold">{m.food}</div></div>))}
    </div>):null}
  </div>);

  /* ── SHOP ── */
  const renderShop=()=>{
    const ws=new Date(sel+"T12:00:00");ws.setDate(ws.getDate()-ws.getDay()+1);
    const wk=Array.from({length:7}).map((_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d.toISOString().split("T")[0];});
    const skipWords=["evitando","tollerata","limitando","almeno","volte a settimana","volta a settimana","dall'elenco","seguente elenco","dal seguente","piatto dall","tra quella","oppure con","senza semi","fatto raffreddare","ingredienti","combinabili","possibile invertire","si intendono","si consiglia","eliminare il grasso","pietanze vanno","rendere le pietanze","moderazione","categoricamente","interpretare","considerare"];
    const items=[];
    wk.forEach(d=>(data.mealPlans[d]||[]).forEach(m=>{
      let food=m.food.replace(/\([^)]*\)/g,"").replace(/\d+\s*(g|ml|kg|l)\b/gi,"").replace(/max\s*\d+[-–]\d+/gi,"").replace(/n\.\s*\d+/gi,"").trim();
      food.split(/[,+]/).forEach(it=>{
        let t=it.replace(/^[-–•*·]\s*/,"").trim().toLowerCase();
        if(t.length<3)return;
        if(skipWords.some(sw=>t.includes(sw)))return;
        if(t.startsWith("oppure")||t.startsWith("o ")||t.startsWith("con "))return;
        t=t.replace(/\d+\s*(g|ml|cucchia[io]|fett[ae]|vasett[io]|pacchett[io])\b/gi,"").trim();
        if(t.length<3)return;
        if(!items.find(a=>a.n===t))items.push({n:t,id:t});
      });
    }));
    const ch=data.shoppingChecks||{};const done=items.filter(i=>ch[i.id]).length;
    return(<div className="space-y-4">
      <h2 className="font-extrabold text-lg">🛒 Spesa</h2>
      <div className="text-sm font-semibold" style={{color:"var(--tx2)"}}>{done}/{items.length} acquistati</div>
      {items.length>0&&<div className="h-2.5 rounded-full overflow-hidden" style={{background:"var(--m)"}}><div className="h-full rounded-full" style={{width:`${(done/items.length)*100}%`,background:"var(--ac)"}}/></div>}
      {items.length===0?<div className="text-center py-10 opacity-30 font-semibold">Aggiungi pasti per generare la lista</div>:(
        <div className="card p-0 overflow-hidden">{items.map((it,i)=>(<div key={it.id} className="flex items-center gap-3 px-4 py-3" style={{borderBottom:i<items.length-1?"1px solid var(--bd)":"none"}}><button onClick={()=>up(d=>{if(!d.shoppingChecks)d.shoppingChecks={};d.shoppingChecks[it.id]=!d.shoppingChecks[it.id];})} className="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0" style={{background:ch[it.id]?"var(--ac)":"transparent",border:`2px solid ${ch[it.id]?"var(--ac)":"var(--bd)"}`}}>{ch[it.id]&&<Ic d={ic.chk} s={14} c="#fff"/>}</button><span className={`font-semibold capitalize ${ch[it.id]?"line-through opacity-25":""}`}>{it.n}</span></div>))}</div>

        {data.weightLog.length>0&&<div className="mt-3 space-y-1">{data.weightLog.slice().reverse().slice(0,8).map((w,i)=>(<div key={w.date+w.value} className="flex items-center justify-between py-1.5 px-2 rounded-lg text-sm" style={{background:i%2===0?"var(--m)":"transparent"}}><span style={{color:"var(--tx2)"}}>{w.date}</span><span className="font-black">{w.value}kg</span><div className="flex gap-1"><button onClick={()=>{setFs({eidx:data.weightLog.length-1-i,date:w.date,value:String(w.value)});setModal("editW");}} className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:"var(--bd)"}}><Ic d={ic.edit} s={11}/></button><button onClick={()=>{if(confirm("Eliminare?"))up(d=>{d.weightLog.splice(d.weightLog.length-1-i,1);});}} className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:"var(--bd)"}}><Ic d={ic.del} s={11}/></button></div></div>))}</div>}
      </div>

      <div className="card"><div className="flex items-center justify-between mb-2"><span className="font-extrabold">📏 Misurazioni</span><button onClick={()=>{setFs({date:td(),...Object.fromEntries(BP.map(p=>[p,""]))});setModal("addM");}} className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.plus} s={14} c="#fff"/></button></div>
        {data.measurements.length===0?<div className="text-center py-4 opacity-30 font-semibold">Nessuna</div>:<><div className="grid grid-cols-2 gap-2">{BP.map(part=>{const vs=data.measurements.filter(m=>m[part]).map(m=>({date:m.date,value:parseFloat(m[part])}));if(!vs.length)return null;return<div key={part} className="rounded-xl p-2" style={{background:"var(--m)"}}><Chrt data={vs.slice(-5)} w={140} h={80} color="var(--sage)" label={part} unit="cm"/></div>;})}</div>
          <div className="mt-3 space-y-1">{data.measurements.slice().reverse().slice(0,5).map((m,i)=>(<div key={m.id} className="flex items-center justify-between py-1.5 px-2 rounded-lg text-sm" style={{background:i%2===0?"var(--m)":"transparent"}}><span style={{color:"var(--tx2)"}}>{m.date}</span><span className="text-xs font-bold truncate flex-1 mx-2" style={{color:"var(--tx2)"}}>{BP.filter(p=>m[p]).map(p=>p[0]+":"+m[p]).join(" ")}</span><div className="flex gap-1 flex-shrink-0"><button onClick={()=>{const idx=data.measurements.length-1-i;const o=data.measurements[idx];setFs({midx:idx,date:o.date,...Object.fromEntries(BP.map(p=>[p,o[p]||""]))});setModal("editM");}} className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:"var(--bd)"}}><Ic d={ic.edit} s={11}/></button><button onClick={()=>{if(confirm("Eliminare?"))up(d=>{d.measurements.splice(d.measurements.length-1-i,1);});}} className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:"var(--bd)"}}><Ic d={ic.del} s={11}/></button></div></div>))}</div></>}
      </div>
    </div>);
  };

  /* ── MORE ── */
  const renderMore=()=>(<div className="space-y-4">
    <div className="card"><div className="flex items-center gap-3 mb-3"><div className="w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-black shadow" style={{background:"linear-gradient(135deg,var(--ac),var(--a2))",color:"#fff"}}>{pr.name?.[0]?.toUpperCase()}</div><div><div className="font-extrabold text-lg">{pr.name}</div><div className="text-sm font-semibold" style={{color:"var(--tx2)"}}>{pr.sex==="M"?"M":"F"} · {myAge}a · {pr.height}cm</div></div></div><div className="grid grid-cols-3 gap-2 text-center">{[{v:myTdee,l:"TDEE",c:"var(--ac)"},{v:Math.round(myBmr),l:"BMR",c:"var(--wa)"},{v:curBmi||"—",l:"BMI",c:curBmi?bmiC(curBmi).c:"var(--ac)"}].map((s,i)=>(<div key={i} className="rounded-xl p-2" style={{background:"var(--m)"}}><div className="font-black" style={{color:s.c}}>{s.v}</div><div className="text-[10px] font-bold" style={{color:"var(--tx2)"}}>{s.l}</div></div>))}</div><button onClick={()=>up(d=>{d.profile.onboarded=false;})} className="mt-2 text-xs font-bold opacity-30 underline w-full text-center">Modifica profilo</button></div>
    {/* Nutrizionista */}
    <div className="card"><div className="flex items-center justify-between mb-3"><span className="font-extrabold">🩺 Nutrizionista</span><button onClick={()=>{const n=pr.nutri||{};setFs({nN:n.name||"",nP:n.phone||"",nE:n.email||"",nA:n.address||"",nD:n.nextAppt||"",nO:n.notes||""});setModal("editNutri");}} className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.edit} s={14} c="#fff"/></button></div>
      {pr.nutri?.name?(<div className="space-y-2"><div className="font-extrabold">{pr.nutri.name}</div>{pr.nutri.phone&&<div className="flex gap-2"><a href={"https://wa.me/"+pr.nutri.phone.replace(/\D/g,"")} target="_blank" className="flex-1 py-2.5 rounded-xl font-bold text-center text-sm" style={{background:"#25D366",color:"#fff"}}>💬 WhatsApp</a><a href={"tel:"+pr.nutri.phone} className="flex-1 py-2.5 rounded-xl font-bold text-center text-sm" style={{background:"var(--ac)",color:"#fff"}}>📞 Chiama</a></div>}{pr.nutri.email&&<a href={"mailto:"+pr.nutri.email} className="block text-sm font-semibold" style={{color:"var(--ac)"}}>✉️ {pr.nutri.email}</a>}{pr.nutri.nextAppt&&<div className="rounded-xl p-3 flex items-center gap-2" style={{background:"var(--m)"}}><span>📅</span><div><div className="text-[10px] font-bold" style={{color:"var(--tx2)"}}>PROSSIMO APPUNTAMENTO</div><div className="font-extrabold">{new Date(pr.nutri.nextAppt+"T12:00:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})}</div></div></div>}{pr.nutri.address&&<a href={"https://maps.google.com/?q="+encodeURIComponent(pr.nutri.address)} target="_blank" className="rounded-xl p-3 flex items-center gap-2 block" style={{background:"var(--m)"}}><span>📍</span><div className="text-sm font-semibold">{pr.nutri.address}</div></a>}
      </div>):(<div className="text-center py-3 opacity-40 font-semibold">Aggiungi i dati del nutrizionista</div>)}
    </div>
    {/* Activity */}
    <div className="card"><div className="flex items-center justify-between mb-2"><span className="font-extrabold">🏃 Attività</span><button onClick={()=>{setFs({date:td(),activity:"",duration:""});setModal("addA");}} className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.plus} s={14} c="#fff"/></button></div>{data.activities.slice(-5).reverse().map(a=>(<div key={a.id} className="flex justify-between py-1.5 text-sm" style={{borderBottom:"1px solid var(--bd)"}}><div><b>{a.activity}</b> <span style={{color:"var(--tx2)"}}>· {a.duration}m</span></div><span style={{color:"var(--tx2)"}}>{a.date.slice(5)}</span></div>))}{!data.activities.length&&<div className="text-center py-3 opacity-30 font-semibold">—</div>}</div>
    {/* Diary */}
    <div className="card"><div className="flex items-center justify-between mb-2"><span className="font-extrabold">📝 Diario</span><button onClick={()=>{setFs({date:sel,note:data.diary[sel]||""});setModal("diary");}} className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.edit} s={14} c="#fff"/></button></div>{data.diary[sel]?<p className="font-semibold text-sm">{data.diary[sel]}</p>:<div className="text-center py-3 opacity-30 font-semibold">—</div>}</div>
    {/* Data */}
    <div className="card"><div className="text-xs font-black tracking-wider mb-3" style={{color:"var(--tx2)"}}>⚙️ DATI</div><div className="flex gap-2 flex-wrap"><Btn onClick={()=>exportXls(data)}>📊 Excel</Btn><Btn v="secondary" onClick={()=>{const bl=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="nutritrack.json";a.click();}}>JSON</Btn><Btn v="danger" onClick={()=>{if(confirm("Eliminare TUTTI i dati?"))setData(defD());}}>Reset tutto</Btn></div></div>
  </div>);

  /* ── MODALS ── */
  const renderModals=()=>(<>
    {/* IMPORT - smart diet loader */}
    <Mdl open={modal==="import"} onClose={()=>{setModal(null);setImpRes(null);setFs(f=>({...f,impMode:null}));}} title="📄 Carica Dieta">
      <div className="space-y-4">
        {/* Current diet info */}
        {data.dietType&&<div className="rounded-xl p-3 flex items-center justify-between" style={{background:"var(--m)"}}><div><div className="text-xs font-bold" style={{color:"var(--tx2)"}}>DIETA ATTUALE</div><div className="font-extrabold">{data.dietType==="free"?"Schema libero":"Piano settimanale"}</div></div><Btn v="danger" cls="text-sm px-3 py-2" onClick={()=>{if(confirm("Eliminare solo la dieta? I progressi (peso, misurazioni) restano."))up(d=>{d.dietType=null;d.dietSchema=null;d.weeklyPlan={};d.mealPlans={};d.mealChecks={};d.shoppingChecks={};});setModal(null);}}>Sostituisci</Btn></div>}
        {/* Upload */}
        <div className="rounded-2xl p-5 text-center border-2 border-dashed" style={{borderColor:"var(--bd)"}}><div className="text-3xl mb-2">📄</div><p className="font-semibold mb-1" style={{color:"var(--tx2)"}}>PDF, TXT o CSV</p><input type="file" accept=".pdf,.txt,.csv" onChange={handleFile} className="w-full text-sm"/>{loading&&<div className="mt-2 font-bold animate-pulse" style={{color:"var(--ac)"}}>Lettura PDF...</div>}</div>
        {/* Choose type */}
        {impRes&&impRes.ok&&!fs.impMode&&<div className="space-y-2"><p className="font-extrabold">Che tipo di dieta è?</p>
          <button onClick={()=>setFs({...fs,impMode:"free"})} className="w-full rounded-xl p-3 text-left flex items-center gap-3 shadow-sm" style={{background:"var(--cd)",border:"2px solid var(--bd)"}}><span className="text-2xl">📋</span><div><div className="font-extrabold">Schema libero</div><div className="text-xs" style={{color:"var(--tx2)"}}>Opzioni per pasto, scegli tu ogni giorno</div></div></button>
          <button onClick={()=>setFs({...fs,impMode:"weekly"})} className="w-full rounded-xl p-3 text-left flex items-center gap-3 shadow-sm" style={{background:"var(--cd)",border:"2px solid var(--bd)"}}><span className="text-2xl">📅</span><div><div className="font-extrabold">Piano settimanale</div><div className="text-xs" style={{color:"var(--tx2)"}}>Pasti diversi per ogni giorno</div></div></button>
        </div>}
        {/* Free schema mode */}
        {impRes&&impRes.ok&&fs.impMode==="free"&&<div className="space-y-3">
          <p className="text-sm font-semibold" style={{color:"var(--tx2)"}}>Puoi modificare il testo prima di salvare:</p>
          <textarea className="w-full rounded-xl px-3 py-3 h-40 resize-none outline-none text-sm" style={{background:"var(--m)",color:"var(--tx)",border:"1px solid var(--bd)"}} value={impRes.raw} onChange={e=>setImpRes({...impRes,raw:e.target.value})}/>
          <Btn cls="w-full" v="success" onClick={()=>{const result=parseSchema(impRes.raw);up(d=>{d.dietType="free";d.dietSchema=result;if(result.nutri.phone&&!d.profile.nutri?.phone)d.profile.nutri={...d.profile.nutri,...result.nutri};if(result.nutri.email&&!d.profile.nutri?.email)d.profile.nutri={...d.profile.nutri,email:result.nutri.email};});setImpRes(null);setModal(null);setFs(f=>({...f,impMode:null}));}}>💾 Salva schema</Btn>
        </div>}
        {/* Weekly mode */}
        {impRes&&impRes.ok&&fs.impMode==="weekly"&&<div className="space-y-3">
          <textarea className="w-full rounded-xl px-3 py-3 h-40 resize-none outline-none text-sm" style={{background:"var(--m)",color:"var(--tx)",border:"1px solid var(--bd)"}} value={impRes.raw} onChange={e=>setImpRes({...impRes,raw:e.target.value})}/>
          <Btn cls="w-full" onClick={()=>{const dm=parseWeekly(impRes.raw);if(dm.length){setImpRes({...impRes,dm});}else setImpRes({...impRes,ok:false,msg:"Nessun pasto trovato"});}}>🔍 Analizza</Btn>
          {impRes.dm&&<div><div className="rounded-xl p-3 mb-3 max-h-32 overflow-y-auto text-sm" style={{background:"var(--m)"}}>{impRes.dm.map((day,di)=>(<div key={di} className="mb-1"><b style={{color:"var(--ac)"}}>G{di+1}</b>: {day.map(m=>m.food).join(", ").slice(0,80)}</div>))}</div><Inp label="Data inizio" type="date" value={fs.impDate||td()} onChange={e=>setFs({...fs,impDate:e.target.value})}/><Btn v="success" cls="w-full" onClick={()=>{const start=new Date((fs.impDate||td())+"T12:00:00");up(d=>{d.dietType="weekly";impRes.dm.forEach((meals,i)=>{const dt=new Date(start);dt.setDate(dt.getDate()+i);const ds=dt.toISOString().split("T")[0];if(!d.mealPlans[ds])d.mealPlans[ds]=[];meals.forEach(m=>d.mealPlans[ds].push({id:gid(),mealType:m.mealType,food:m.food}));});});setImpRes(null);setModal(null);setFs(f=>({...f,impMode:null}));}}>✓ Importa</Btn></div>}
        </div>}
        {impRes&&!impRes.ok&&<div className="rounded-xl p-3" style={{background:"rgba(196,90,90,.1)",border:"1px solid var(--er)"}}><div className="font-extrabold" style={{color:"var(--er)"}}>✗ {impRes.msg}</div></div>}
        <div className="text-xs font-black tracking-wider mt-2" style={{color:"var(--tx2)"}}>OPPURE INCOLLA</div>
        <textarea className="w-full rounded-xl px-3 py-3 h-20 resize-none outline-none" style={{background:"var(--m)",color:"var(--tx)",border:"1px solid var(--bd)",fontSize:"15px"}} placeholder="Incolla il piano..." value={fs.mt||""} onChange={e=>setFs({...fs,mt:e.target.value})}/>
        <Btn v="secondary" cls="w-full" onClick={()=>{if(!fs.mt?.trim())return;setImpRes({ok:true,raw:fs.mt,msg:"Pronto"});}}>Carica testo</Btn>
      </div>
    </Mdl>
    <Mdl open={modal==="addMeal"} onClose={()=>setModal(null)} title="🍽️ Pasto"><select className="w-full rounded-xl px-4 py-3 outline-none mb-4" style={{background:"var(--m)",color:"var(--tx)",border:"2px solid var(--bd)",fontSize:"16px"}} value={fs.mealType||""} onChange={e=>setFs({...fs,mealType:e.target.value})}>{MT.map(t=><option key={t}>{t}</option>)}</select><Inp label="Alimenti" value={fs.food||""} onChange={e=>setFs({...fs,food:e.target.value})} placeholder="Yogurt greco, frutta"/><Btn cls="w-full" onClick={()=>{if(!fs.food?.trim())return;up(d=>{if(!d.mealPlans[fs.date])d.mealPlans[fs.date]=[];d.mealPlans[fs.date].push({id:gid(),mealType:fs.mealType,food:fs.food.trim()});});setModal(null);}}>Aggiungi</Btn></Mdl>
    <Mdl open={modal==="addW"} onClose={()=>setModal(null)} title="⚖️ Peso"><Inp label="Data" type="date" value={fs.date||""} onChange={e=>setFs({...fs,date:e.target.value})}/><Inp label="Peso (kg)" type="number" step="0.1" value={fs.value||""} onChange={e=>setFs({...fs,value:e.target.value})}/>{fs.value&&pr.height&&(()=>{const p=bmi(parseFloat(fs.value),pr.height);return p?<div className="rounded-xl p-3 mb-3 flex items-center gap-3" style={{background:"var(--m)"}}><span className="text-xl font-black" style={{color:bmiC(p).c}}>{p}</span><span className="font-bold" style={{color:bmiC(p).c}}>{bmiC(p).l}</span></div>:null;})()}<Btn cls="w-full" onClick={()=>{if(!fs.value)return;up(d=>{d.weightLog.push({date:fs.date,value:parseFloat(fs.value)});d.weightLog.sort((a,b)=>a.date.localeCompare(b.date));});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="editW"} onClose={()=>setModal(null)} title="✏️ Modifica Peso"><Inp label="Data" type="date" value={fs.date||""} onChange={e=>setFs({...fs,date:e.target.value})}/><Inp label="Peso (kg)" type="number" step="0.1" value={fs.value||""} onChange={e=>setFs({...fs,value:e.target.value})}/><Btn cls="w-full" onClick={()=>{if(!fs.value)return;up(d=>{d.weightLog[fs.eidx]={date:fs.date,value:parseFloat(fs.value)};d.weightLog.sort((a,b)=>a.date.localeCompare(b.date));});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="addM"} onClose={()=>setModal(null)} title="📏 Misurazioni"><Inp label="Data" type="date" value={fs.date||""} onChange={e=>setFs({...fs,date:e.target.value})}/>{BP.map(p=><Inp key={p} label={p+" (cm)"} type="number" step="0.1" value={fs[p]||""} onChange={e=>setFs({...fs,[p]:e.target.value})}/>)}<Btn cls="w-full" onClick={()=>{const en={id:gid(),date:fs.date};BP.forEach(p=>{if(fs[p])en[p]=fs[p];});up(d=>{d.measurements.push(en);d.measurements.sort((a,b)=>a.date.localeCompare(b.date));});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="editM"} onClose={()=>setModal(null)} title="✏️ Modifica Misurazioni"><Inp label="Data" type="date" value={fs.date||""} onChange={e=>setFs({...fs,date:e.target.value})}/>{BP.map(p=><Inp key={p} label={p+" (cm)"} type="number" step="0.1" value={fs[p]||""} onChange={e=>setFs({...fs,[p]:e.target.value})}/>)}<Btn cls="w-full" onClick={()=>{const en={id:data.measurements[fs.midx].id,date:fs.date};BP.forEach(p=>{if(fs[p])en[p]=fs[p];});up(d=>{d.measurements[fs.midx]=en;d.measurements.sort((a,b)=>a.date.localeCompare(b.date));});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="addA"} onClose={()=>setModal(null)} title="🏃 Attività"><Inp label="Data" type="date" value={fs.date||""} onChange={e=>setFs({...fs,date:e.target.value})}/><Inp label="Attività" value={fs.activity||""} onChange={e=>setFs({...fs,activity:e.target.value})} placeholder="Camminata"/><Inp label="Durata (min)" type="number" value={fs.duration||""} onChange={e=>setFs({...fs,duration:e.target.value})}/><Btn cls="w-full" onClick={()=>{if(!fs.activity)return;up(d=>{d.activities.push({id:gid(),date:fs.date,activity:fs.activity,duration:fs.duration||"0"});});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="editNutri"} onClose={()=>setModal(null)} title="🩺 Nutrizionista"><Inp label="Nome" value={fs.nN||""} onChange={e=>setFs({...fs,nN:e.target.value})} placeholder="Dott. Mario Rossi"/><Inp label="Telefono" value={fs.nP||""} onChange={e=>setFs({...fs,nP:e.target.value})} placeholder="+39 333 1234567" type="tel"/><Inp label="Email" value={fs.nE||""} onChange={e=>setFs({...fs,nE:e.target.value})} placeholder="email@esempio.it"/><Inp label="Indirizzo" value={fs.nA||""} onChange={e=>setFs({...fs,nA:e.target.value})} placeholder="Via Roma 10, Milano"/><Inp label="Prossimo appuntamento" type="date" value={fs.nD||""} onChange={e=>setFs({...fs,nD:e.target.value})}/><label className="block mb-4"><span className="text-sm font-bold mb-1 block" style={{color:"var(--tx2)"}}>Note</span><textarea className="w-full rounded-xl px-4 py-3 h-16 resize-none outline-none" style={{background:"var(--m)",color:"var(--tx)",border:"2px solid var(--bd)",fontSize:"16px"}} value={fs.nO||""} onChange={e=>setFs({...fs,nO:e.target.value})}/></label><Btn cls="w-full" onClick={()=>{up(d=>{d.profile.nutri={name:fs.nN||"",phone:fs.nP||"",email:fs.nE||"",address:fs.nA||"",nextAppt:fs.nD||"",notes:fs.nO||""};});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="diary"} onClose={()=>setModal(null)} title={"📝 "+(fs.date||"")}><textarea className="w-full rounded-xl px-4 py-3 h-28 resize-none outline-none" style={{background:"var(--m)",color:"var(--tx)",border:"1px solid var(--bd)",fontSize:"16px"}} value={fs.note||""} onChange={e=>setFs({...fs,note:e.target.value})} placeholder="Come ti senti?"/><Btn cls="w-full mt-3" onClick={()=>{up(d=>{d.diary[fs.date]=fs.note;});setModal(null);}}>Salva</Btn></Mdl>
  </>);

  const tabs=[{id:"today",l:"Oggi",i:ic.home},{id:"schema",l:"Dieta",i:ic.list},{id:"shop",l:"Spesa",i:ic.cart},{id:"progress",l:"Progressi",i:ic.chart},{id:"more",l:"Altro",i:ic.user}];
  return(<div className="flex flex-col h-full" style={{background:"var(--bg)"}}>
    <header className="flex-shrink-0 px-5 pt-4 pb-2"><div className="flex items-center justify-between"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-2xl flex items-center justify-center text-base font-black shadow" style={{background:"linear-gradient(135deg,var(--ac),var(--a2))",color:"#fff"}}>{pr.name?.[0]?.toUpperCase()}</div><div><h1 className="text-base font-black">Ciao, {pr.name}</h1><p className="text-xs font-semibold -mt-0.5" style={{color:"var(--tx2)"}}>{GOL.find(g=>g.id===pr.goal)?.l} · {myTdee} kcal</p></div></div>{curBmi&&<div className="text-right"><div className="text-xl font-black" style={{color:bmiC(curBmi).c}}>{curBmi}</div><div className="text-[10px] font-bold" style={{color:"var(--tx2)"}}>BMI</div></div>}</div></header>
    <main className="flex-1 overflow-y-auto px-4 pb-24">{tab==="today"&&renderToday()}{tab==="schema"&&renderSchema()}{tab==="shop"&&renderShop()}{tab==="progress"&&renderProgress()}{tab==="more"&&renderMore()}</main>
    <nav className="flex-shrink-0 fixed bottom-0 left-0 right-0 flex justify-around py-2 pb-3 z-40 shadow-lg" style={{background:"var(--cd)",borderTop:"1px solid var(--bd)"}}>{tabs.map(t=>(<button key={t.id} onClick={()=>setTab(t.id)} className="flex flex-col items-center gap-0.5 py-1 px-2" style={{color:tab===t.id?"var(--ac)":"var(--tx2)",opacity:tab===t.id?1:.5}}><Ic d={t.i} s={20} c={tab===t.id?"var(--ac)":"var(--tx2)"}/><span className="text-[10px] font-bold">{t.l}</span>{tab===t.id&&<div className="w-1.5 h-1.5 rounded-full" style={{background:"var(--ac)"}}/>}</button>))}</nav>
    {renderModals()}
  </div>);}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}</script>
</body>
</html>
