function loadData(){
  try{
    /* Try current key first */
    let raw=localStorage.getItem(SK);
    if(raw){return{...defD(),...JSON.parse(raw)};}
    /* Migrate from older keys */
    for(const k of["nt5","nt4","nt3","nt2","nt"]){
      raw=localStorage.getItem(k);
      if(raw){const old={...defD(),...JSON.parse(raw)};localStorage.setItem(SK,JSON.stringify(old));return old;}
    }
    return defD();
  }catch(e){return defD();}
}
const sv=d=>localStorage.setItem(SK,JSON.stringify(d));
const calcBmi=(w,h)=>{if(!w||!h)return null;return(w/((h/100)**2)).toFixed(1);};
const bmiC=b=>{const v=parseFloat(b);if(v<18.5)return{l:"Sottopeso",c:"var(--water)"};if(v<25)return{l:"Normopeso",c:"var(--ok)"};if(v<30)return{l:"Sovrappeso",c:"var(--wa)"};return{l:"Obesità",c:"var(--er)"};};
const calcBmr=(w,h,a,s)=>{if(!w||!h||!a)return 0;return s==="F"?447.593+9.247*w+3.098*h-4.330*a:88.362+13.397*w+4.799*h-5.677*a;};
const calcAge=bd=>{if(!bd)return 0;const b=new Date(bd),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return a;};

/* ── PDF ── */
async function pdfText(file){const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let t="";for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();let lastY=null;c.items.forEach(it=>{if(lastY!==null&&Math.abs(it.transform[5]-lastY)>5)t+="\n";t+=it.str;lastY=it.transform[5];});t+="\n\n";}return t;}
const readTxt=f=>new Promise((r,j)=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.onerror=j;fr.readAsText(f);});

/* ── Schema parser (free-form diet) ── */
function parseSchema(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(l=>l.length>1);
  const mealR=[{r:/prima\s*colazione|^colazione\b/i,t:"Colazione"},{r:/spuntino\s*(di\s+)?(meta|metà)?\s*mattin/i,t:"Spuntino Mattina"},{r:/meta['']?\s*mattin/i,t:"Spuntino Mattina"},{r:/^pranzo\b/i,t:"Pranzo"},{r:/spuntino\s*(di\s+)?(meta|metà)?\s*pomerig/i,t:"Spuntino Pomeriggio"},{r:/meta['']?\s*pomerig/i,t:"Spuntino Pomeriggio"},{r:/^cena\b/i,t:"Cena"}];
  const noteR=[/^condimento/i,/^avvertenz/i,/^raccomandazion/i];
  const subR=[{r:/^primo\b/i,n:"Primo"},{r:/^secondo\b/i,n:"Secondo"},{r:/^contorno\b/i,n:"Contorno"},{r:/^frutta\b/i,n:"Frutta"}];
  const sections=[];let cur=null;let curSub=null;let items=[];let notes=[];let nutri={};let noteSec=null;
  const flush=()=>{if(cur&&items.length){sections.push({meal:cur,sub:curSub,items:[...items]});}items=[];};
  let inNotes=false;
  lines.forEach(l=>{
    const phoneM=l.match(/(?:cell|tel)[.:\s]*([+\d\s]{8,})/i);if(phoneM)nutri.phone=phoneM[1].replace(/\s+/g,"").trim();
    const emailM=l.match(/(?:email|e-mail|mail)[.:\s]*([^\s,]+@[^\s,]+)/i);if(emailM)nutri.email=emailM[1].trim();
    /* Detect doctor name: "Dott./Dott.ssa Name" */
    const docM=l.match(/^(Dott\.?\s*(?:ssa)?)\s+(.{3,})/i);if(docM&&!nutri.name)nutri.name=docM[0].trim();
    if(noteR.some(r=>r.test(l))){flush();cur=null;inNotes=true;noteSec=l.replace(/^(condimento|avvertenz\w*|raccomandazion\w*)\s*/i,"").trim();notes.push({title:l.split(/\s/)[0],text:noteSec||""});return;}
    if(inNotes){
      /* Clean the "■" artifacts: remove leading single letter + space, or ■ */
      let clean=l.replace(/^[■▪●•n]\s+/,"").replace(/^[-–]\s*/,"").trim();
      if(clean.length>2)notes.push({title:"",text:clean});
      return;
    }
    const mm=mealR.find(p=>p.r.test(l));
    if(mm){flush();cur=mm.t;curSub=null;inNotes=false;return;}
    const sm=subR.find(x=>x.r.test(l));
    if(sm&&cur){flush();curSub=sm.n;
      const rest=l.replace(sm.r,"").replace(/^[:\s]+/,"").trim();
      if(rest.length>3)items.push({text:rest,sub:curSub,isAlt:false});
      return;
    }
    if(cur){
      let clean=l.replace(/^[-–•*·▪►■]\s*/,"").replace(/^\d+[.)]\s*/,"").trim();
      if(clean.length>2){
        const isAlt=/^oppure\b/i.test(clean);
        items.push({text:clean,sub:curSub,isAlt});
      }
    }
  });
  flush();
  const meals={};
  sections.forEach(s=>{
    if(!meals[s.meal])meals[s.meal]={items:[],subs:{}};
    s.items.forEach(it=>{
      if(it.sub){if(!meals[s.meal].subs[it.sub])meals[s.meal].subs[it.sub]=[];meals[s.meal].subs[it.sub].push(it);}
      else{meals[s.meal].items.push(it);}
    });
  });
  return{meals,notes,nutri};
}

/* ── Weekly parser ── */
function parseWeekly(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  const dayP=[/^(luned[iì]|marted[iì]|mercoled[iì]|gioved[iì]|venerd[iì]|sabato|domenica)\b/i,/^giorno\s*(\d+)/i];
  const mealP=[{r:/^colazione/i,t:"Colazione"},{r:/^spuntino\s*(matt|di\s*matt)/i,t:"Spuntino Mattina"},{r:/^pranzo/i,t:"Pranzo"},{r:/^spuntino\s*(pom|di\s*pom)/i,t:"Spuntino Pomeriggio"},{r:/^spuntino/i,t:"Spuntino Mattina"},{r:/^merenda/i,t:"Spuntino Pomeriggio"},{r:/^cena/i,t:"Cena"}];
  let cur=null;const days=[];let tmp=[];
  const flush=()=>{if(tmp.length){days.push([...tmp]);tmp=[];}};
  lines.forEach(l=>{if(dayP.some(p=>p.test(l))){flush();cur=null;return;}const mm=mealP.find(p=>p.r.test(l));if(mm){cur=mm.t;const af=l.replace(mm.r,"").replace(/^[\s:;–\-→]+/,"").trim();if(af.length>2)tmp.push({mealType:cur,food:af});return;}if(cur){const c=l.replace(/^[-–•*·]\s*/,"").replace(/^\d+[.)]\s*/,"").trim();if(c.length>2)tmp.push({mealType:cur,food:c});}});
  flush();if(!days.length&&tmp.length)days.push(tmp);return days;
}

const SKIP_WORDS=["evitando","tollerata","tollerato","limitando","limitare","almeno","massimo","dall'elenco","seguente elenco","piatto dall","tra quella","tra quell","oppure con","senza semi","fatto raffreddare","ingredienti","combinabili","possibile invertire","si intendono","si intende","si consiglia","eliminare il grasso","pietanze vanno","rendere le pietanze","moderazione","categoricamente","interpretare","considerare","volte a settimana","volta a settimana","volte alla settimana","volta alla settimana","preparate al forno","bollite","al vapore","grigliate","crudi e al netto","netto degli scarti","grasso visibile","succo di limone","uso di","far uso","parsimonia","pizzichi","acqua da bere","evitare alcolici","evitare categoricamente","corso della giornata","secondo piatto","puntini come somma","trattini come alternativa","piatti unici","alimenti come","pesi si intendono","verdura si intende","frutta limitare","aggiungere sale","non più di","dolcificante","caffè o thè","caffè o the","con moderazione","insaccati","alimenti sospettabili","mal conservati","artificiali contenuti","troppo matura","fusto duro","foglie larghe","spezie irritanti","base di cola","contenenti caffeina","troppo ghiacciate","non esitare","chiedere chiarimenti","cell:","email:","dott","medico","specialista","ricerca"];
const FOOD_ITEMS=["yogurt","fette biscottate","cracker","riso","pane","pasta","carne","vitello","manzo","agnello","pollo","tacchino","coniglio","uova","pesce","alici","sarde","dentice","rombo","sogliole","orata","spigola","merluzzo","halibut","triglie","cefalo","palombo","cernia","salmone","pesce spada","tonno","sgombro","calamari","polpo","gamberi","seppie","verdura","frutta","mela","parmigiano","olio","patate","latte","ricotta","prosciutto"];

function extractShopItems(data){
  const items=new Map();
  const addItem=(text)=>{
    let t=text.toLowerCase()
      .replace(/\([^)]*\)/g,"")
      .replace(/\d+\s*(g|ml|kg|l|cm)\b/gi,"")
      .replace(/n[.°]?\s*\d+/gi,"")
      .replace(/max\s*\d+[-–]?\d*/gi,"")
      .replace(/\d+[-–]\d+/g,"")
      .trim();
    t.split(/[+]/).forEach(part=>{
      let p=part.replace(/^[-–•*·]\s*/,"").trim();
      if(p.length<3)return;
      if(SKIP_WORDS.some(sw=>p.includes(sw)))return;
      if(p.startsWith("oppure")||p.startsWith("o "))return;
      /* Extract meaningful food name */
      p=p.replace(/\d+\s*(cucchiai?n?[io]?|fett[ae]|vasett[io]|pacchett[io]|porzion[ei])\s*(di\s+)?/gi,"").trim();
      p=p.replace(/^\s*(di|del|della|dello|dei|degli|delle)\s+/i,"").trim();
      if(p.length<3)return;
      if(!items.has(p))items.set(p,true);
    });
  };
  /* From schema (free-form diet) */
  if(data.dietSchema&&data.dietSchema.meals){
    Object.values(data.dietSchema.meals).forEach(meal=>{
      meal.items.forEach(it=>addItem(it.text));
      Object.values(meal.subs).forEach(sub=>sub.forEach(it=>addItem(it.text)));
    });
  }
  /* From daily meal plans */
  Object.values(data.mealPlans).forEach(meals=>{
    meals.forEach(m=>addItem(m.food));
  });
  return[...items.keys()].map(n=>({n,id:n}));
}

/* ── Excel export ── */
function exportXls(data){
  const wb=XLSX.utils.book_new();const p=data.profile;
  if(data.weightLog.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.weightLog.map(w=>({Data:w.date,"Peso (kg)":w.value,BMI:p.height?calcBmi(w.value,p.height):""}))),"Peso");
  if(data.measurements.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.measurements.map(m=>{const r={Data:m.date};BP.forEach(b=>{if(m[b])r[b+" (cm)"]=parseFloat(m[b]);});return r;})),"Misurazioni");
  const allM=[];Object.entries(data.mealPlans).forEach(([d,ms])=>ms.forEach(m=>allM.push({Data:d,Pasto:m.mealType,Alimenti:m.food})));if(allM.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(allM),"Pasti");
  const wE=Object.entries(data.water).map(([d,v])=>({Data:d,Bicchieri:v}));if(wE.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(wE),"Acqua");
  if(data.activities.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.activities.map(a=>({Data:a.date,"Attività":a.activity,"Durata (min)":parseInt(a.duration)||0}))),"Attività");
  if((data.biaLog||[]).length){XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet((data.biaLog||[]).map(b=>{const r={Data:b.date};BIA_F.forEach(f=>{if(b[f.k])r[f.l+(f.u?" ("+f.u+")":"")]=parseFloat(b[f.k]);});return r;})),"BIA");}
  if(data.dietSchema){const rows=[];Object.entries(data.dietSchema.meals).forEach(([meal,d])=>{rows.push({Pasto:meal,Categoria:"",Alimento:""});d.items.forEach(it=>rows.push({Pasto:"",Categoria:"",Alimento:it.text}));Object.entries(d.subs).forEach(([sub,its])=>{rows.push({Pasto:"",Categoria:sub,Alimento:""});its.forEach(it=>rows.push({Pasto:"",Categoria:"",Alimento:it.text}));});});if(rows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Schema Dieta");}
  const prof=[{Campo:"Nome",Valore:p.name},{Campo:"Sesso",Valore:p.sex==="M"?"Maschio":"Femmina"},{Campo:"Nascita",Valore:p.birthDate},{Campo:"Altezza",Valore:p.height+" cm"},{Campo:"Peso iniziale",Valore:p.weight+" kg"},{Campo:"Obiettivo",Valore:p.goal},{Campo:"Allergie",Valore:p.allergies||""},{Campo:"Nutrizionista",Valore:p.nutri?.name||""},{Campo:"Tel",Valore:p.nutri?.phone||""},{Campo:"Email",Valore:p.nutri?.email||""}];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(prof),"Profilo");
  XLSX.writeFile(wb,"NutriTrack_Export.xlsx");
}

function Chrt({data,w=300,h=130,color="var(--ac)",label,unit=""}){if(!data.length)return<div className="text-center opacity-40 py-6 font-semibold">Nessun dato</div>;const vals=data.map(d=>d.value),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1,pd=28;const pts=data.map((d,i)=>({x:pd+(i/Math.max(data.length-1,1))*(w-2*pd),y:h-pd-((d.value-mn)/rng)*(h-2*pd-10),...d}));const line=pts.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ");const area=line+` L${pts[pts.length-1].x},${h-pd} L${pts[0].x},${h-pd} Z`;const gid2="g"+(label||"x").replace(/\W/g,"");return(<div className="flex flex-col items-center">{label&&<div className="text-sm font-bold mb-1" style={{color:"var(--tx2)"}}>{label}</div>}<svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}><defs><linearGradient id={gid2} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity=".2"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs><path d={area} fill={`url(#${gid2})`}/><path d={line} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>{pts.map((p,i)=>(<g key={i}><circle cx={p.x} cy={p.y} r="5" fill={color} stroke="var(--cd)" strokeWidth="2"/><text x={p.x} y={p.y-14} textAnchor="middle" fontSize="11" fill={color} fontWeight="800">{p.value}{unit}</text><text x={p.x} y={h-6} textAnchor="middle" fontSize="9" fill="var(--tx2)" fontWeight="600">{p.date?p.date.slice(5):""}</text></g>))}</svg></div>);}
function BMIGauge({val}){if(!val)return null;const v=parseFloat(val),cat=bmiC(val),pct=Math.min(100,Math.max(0,((v-15)/25)*100));return(<div className="flex flex-col items-center gap-2"><div className="text-3xl font-black" style={{color:cat.c}}>{val}</div><div className="text-sm font-extrabold" style={{color:cat.c}}>{cat.l}</div><div className="w-full h-3 rounded-full overflow-hidden flex" style={{background:"var(--m)"}}><div style={{width:"18.5%",background:"var(--water)"}} className="h-full"/><div style={{width:"26%",background:"var(--ok)"}} className="h-full"/><div style={{width:"20%",background:"var(--wa)"}} className="h-full"/><div style={{flex:1,background:"var(--er)"}} className="h-full"/></div><div className="w-full relative h-4"><div className="absolute w-4 h-4 rounded-full border-2 shadow" style={{left:`${pct}%`,top:"-10px",transform:"translateX(-50%)",background:cat.c,borderColor:"#fff"}}/></div><div className="flex justify-between w-full text-[10px] font-bold" style={{color:"var(--tx2)"}}><span>Sotto</span><span>Normo</span><span>Sovra</span><span>Obesità</span></div></div>);}

/* ════ ONBOARDING ════ */
function Onboarding({onComplete}){
  const[step,setStep]=useState(0);const[p,setP]=useState(defP());const[dir,setDir]=useState(1);const T=8;
  const next=()=>{setDir(1);setStep(s=>Math.min(s+1,T-1));};const prev=()=>{setDir(-1);setStep(s=>Math.max(s-1,0));};
  const canN=()=>{if(step===0)return p.name.trim().length>0;if(step===1)return!!p.sex;if(step===2)return!!p.birthDate;if(step===3)return p.height>0;if(step===4)return p.weight>0;if(step===5)return!!p.goal;if(step===6)return!!p.activityLevel;return true;};
  const a=calcAge(p.birthDate),b=calcBmr(p.weight,p.height,a,p.sex),af=AL.find(x=>x.id===p.activityLevel),tdee=Math.round(b*(af?af.f:1.2)),myBmi=calcBmi(p.weight,p.height);
  const R=()=>{switch(step){
    case 0:return(<div className="space-y-5"><div className="text-6xl text-center" style={{animation:"pulse 2s infinite"}}>🌿</div><h2 className="text-2xl font-black text-center">Come ti chiami?</h2><p className="text-center font-semibold" style={{color:"var(--tx2)"}}>Iniziamo il tuo percorso</p><Inp placeholder="Il tuo nome" value={p.name} onChange={e=>setP({...p,name:e.target.value})}/></div>);
    case 1:return(<div className="space-y-5"><h2 className="text-2xl font-black text-center">Sesso biologico</h2><div className="grid grid-cols-2 gap-4">{[{id:"M",l:"Maschio",e:"🙋‍♂️"},{id:"F",l:"Femmina",e:"🙋‍♀️"}].map(s=>(<button key={s.id} onClick={()=>setP({...p,sex:s.id})} className="rounded-2xl p-5 text-center shadow-sm" style={{background:p.sex===s.id?"var(--ac)":"var(--cd)",color:p.sex===s.id?"#fff":"var(--tx)",border:`2px solid ${p.sex===s.id?"var(--ac)":"var(--bd)"}`}}><div className="text-4xl mb-2">{s.e}</div><div className="font-extrabold">{s.l}</div></button>))}</div></div>);
    case 2:return(<div className="space-y-5"><div className="text-5xl text-center">🎂</div><h2 className="text-2xl font-black text-center">Data di nascita</h2><Inp type="date" value={p.birthDate} onChange={e=>setP({...p,birthDate:e.target.value})}/>{p.birthDate&&<div className="text-center text-xl font-black" style={{color:"var(--ac)"}}>{a} anni</div>}</div>);
    case 3:return(<div className="space-y-5"><div className="text-5xl text-center">📏</div><h2 className="text-2xl font-black text-center">Altezza</h2><div className="text-center text-4xl font-black" style={{color:"var(--ac)"}}>{p.height||170} <span className="text-base" style={{color:"var(--tx2)"}}>cm</span></div><input type="range" min="140" max="210" value={p.height||170} onChange={e=>setP({...p,height:parseInt(e.target.value)})}/></div>);
    case 4:return(<div className="space-y-5"><div className="text-5xl text-center">⚖️</div><h2 className="text-2xl font-black text-center">Peso attuale</h2><Inp type="number" step="0.1" placeholder="75.5 kg" value={p.weight||""} onChange={e=>setP({...p,weight:parseFloat(e.target.value)||0})}/>{p.weight>0&&p.height>0&&<div className="card"><BMIGauge val={myBmi}/></div>}</div>);
    case 5:return(<div className="space-y-5"><h2 className="text-2xl font-black text-center">Obiettivo</h2><div className="space-y-3">{GOL.map(g=>(<button key={g.id} onClick={()=>setP({...p,goal:g.id})} className="w-full rounded-2xl p-4 flex items-center gap-4 shadow-sm" style={{background:p.goal===g.id?"var(--ac)":"var(--cd)",color:p.goal===g.id?"#fff":"var(--tx)",border:`2px solid ${p.goal===g.id?"var(--ac)":"var(--bd)"}`}}><span className="text-3xl">{g.e}</span><span className="font-extrabold">{g.l}</span></button>))}</div></div>);
    case 6:return(<div className="space-y-3"><h2 className="text-2xl font-black text-center">Attività</h2>{AL.map(x=>(<button key={x.id} onClick={()=>setP({...p,activityLevel:x.id})} className="w-full rounded-2xl p-3 text-left flex items-center gap-3 shadow-sm" style={{background:p.activityLevel===x.id?"var(--ac)":"var(--cd)",color:p.activityLevel===x.id?"#fff":"var(--tx)",border:`2px solid ${p.activityLevel===x.id?"var(--ac)":"var(--bd)"}`}}><span className="text-xl">{x.e}</span><div><div className="font-extrabold">{x.l}</div><div className="text-xs opacity-60">{x.d}</div></div></button>))}</div>);
    case 7:return(<div className="space-y-4"><div className="text-4xl text-center">🎉</div><h2 className="text-xl font-black text-center">Pronto, {p.name}!</h2><Inp label="Allergie (opzionale)" placeholder="Lattosio, glutine..." value={p.allergies} onChange={e=>setP({...p,allergies:e.target.value})}/><div className="card space-y-1.5 text-sm">{[["Sesso",p.sex==="M"?"M":"F"],["Età",a+"a"],["Altezza",p.height+"cm"],["Peso",p.weight+"kg"]].map(([k,v])=>(<div key={k} className="flex justify-between"><span style={{color:"var(--tx2)"}}>{k}</span><b>{v}</b></div>))}<div className="flex justify-between"><span style={{color:"var(--tx2)"}}>BMI</span><b style={{color:bmiC(myBmi).c}}>{myBmi} {bmiC(myBmi).l}</b></div><div className="border-t pt-1.5 mt-1" style={{borderColor:"var(--bd)"}}><div className="flex justify-between"><span style={{color:"var(--tx2)"}}>BMR</span><b>{Math.round(b)} kcal</b></div><div className="flex justify-between"><span style={{color:"var(--tx2)"}}>TDEE</span><b style={{color:"var(--ac)"}}>{tdee} kcal</b></div></div></div></div>);
    default:return null;}};
  return(<div className="flex flex-col h-full" style={{background:"var(--bg)"}}>
    <div className="flex-shrink-0 px-5 pt-4 pb-2"><div className="flex items-center gap-2">{step>0&&<button onClick={prev} className="p-1 opacity-40"><Ic d={ic.cL} s={20}/></button>}<div className="flex-1 flex gap-1.5">{Array.from({length:T}).map((_,i)=>(<div key={i} className="flex-1 h-2 rounded-full" style={{background:i<=step?"var(--ac)":"var(--bd)"}}/>))}</div><span className="text-xs font-bold ml-2" style={{color:"var(--tx2)"}}>{step+1}/{T}</span></div></div>
    <div className="flex-1 overflow-y-auto px-5 py-3"><div key={step} style={{animation:dir>0?"siR .3s":"siL .3s"}}>{R()}</div></div>
    <div className="flex-shrink-0 px-5 pb-5 pt-2">{step<T-1?<Btn cls="w-full" onClick={next} disabled={!canN()} style={{opacity:canN()?1:.35}}>Continua →</Btn>:<Btn cls="w-full" v="success" onClick={()=>onComplete({...p,onboarded:true})}>Iniziamo! 🌿</Btn>}</div>
  </div>);}

  useEffect(()=>{sv(data);},[data]);const up=useCallback(fn=>setData(prev=>{const n={...prev};fn(n);return n;}),[]);
  const pr=data.profile,myAge=calcAge(pr.birthDate),myBmr=calcBmr(pr.weight,pr.height,myAge,pr.sex),myAf=AL.find(x=>x.id===pr.activityLevel),myTdee=Math.round(myBmr*(myAf?myAf.f:1.2));

    <Mdl open={modal==="addMeal"} onClose={()=>setModal(null)} title="🍽️ Aggiungi pasto"><select className="w-full rounded-xl px-4 py-3 outline-none mb-4" style={{background:"var(--m)",border:"2px solid var(--bd)",fontSize:"16px"}} value={fs.mealType||""} onChange={e=>setFs({...fs,mealType:e.target.value})}>{MT.map(t=><option key={t}>{t}</option>)}</select><Inp label="Alimenti" value={fs.food||""} onChange={e=>setFs({...fs,food:e.target.value})} placeholder="Yogurt, frutta..."/><Btn cls="w-full" onClick={()=>{if(!fs.food?.trim())return;up(d=>{if(!d.mealPlans[fs.date])d.mealPlans[fs.date]=[];d.mealPlans[fs.date].push({id:gid(),mealType:fs.mealType,food:fs.food.trim()});});setModal(null);}}>Aggiungi</Btn></Mdl>
    <Mdl open={modal==="addW"} onClose={()=>setModal(null)} title="⚖️ Peso"><Inp label="Data" type="date" value={fs.date||""} onChange={e=>setFs({...fs,date:e.target.value})}/><Inp label="Peso (kg)" type="number" step="0.1" value={fs.value||""} onChange={e=>setFs({...fs,value:e.target.value})}/>{fs.value&&pr.height&&(()=>{const p=calcBmi(parseFloat(fs.value),pr.height);return p?<div className="rounded-xl p-3 mb-3 flex items-center gap-3" style={{background:"var(--m)"}}><span className="text-xl font-black" style={{color:bmiC(p).c}}>{p}</span><span className="font-bold" style={{color:bmiC(p).c}}>{bmiC(p).l}</span></div>:null;})()}<Btn cls="w-full" onClick={()=>{if(!fs.value)return;up(d=>{d.weightLog.push({date:fs.date,value:parseFloat(fs.value)});d.weightLog.sort((a,b)=>a.date.localeCompare(b.date));});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="editW"} onClose={()=>setModal(null)} title="✏️ Peso"><Inp label="Data" type="date" value={fs.date||""} onChange={e=>setFs({...fs,date:e.target.value})}/><Inp label="Peso (kg)" type="number" step="0.1" value={fs.value||""} onChange={e=>setFs({...fs,value:e.target.value})}/><Btn cls="w-full" onClick={()=>{if(!fs.value)return;up(d=>{d.weightLog[fs.eidx]={date:fs.date,value:parseFloat(fs.value)};d.weightLog.sort((a,b)=>a.date.localeCompare(b.date));});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="addM"} onClose={()=>setModal(null)} title="📏 Misurazioni"><Inp label="Data" type="date" value={fs.date||""} onChange={e=>setFs({...fs,date:e.target.value})}/>{BP.map(p=><Inp key={p} label={p+" (cm)"} type="number" step="0.1" value={fs[p]||""} onChange={e=>setFs({...fs,[p]:e.target.value})}/>)}<Btn cls="w-full" onClick={()=>{const en={id:gid(),date:fs.date};BP.forEach(p=>{if(fs[p])en[p]=fs[p];});up(d=>{d.measurements.push(en);d.measurements.sort((a,b)=>a.date.localeCompare(b.date));});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="editM"} onClose={()=>setModal(null)} title="✏️ Misurazioni"><Inp label="Data" type="date" value={fs.date||""} onChange={e=>setFs({...fs,date:e.target.value})}/>{BP.map(p=><Inp key={p} label={p+" (cm)"} type="number" step="0.1" value={fs[p]||""} onChange={e=>setFs({...fs,[p]:e.target.value})}/>)}<Btn cls="w-full" onClick={()=>{const en={id:data.measurements[fs.midx].id,date:fs.date};BP.forEach(p=>{if(fs[p])en[p]=fs[p];});up(d=>{d.measurements[fs.midx]=en;d.measurements.sort((a,b)=>a.date.localeCompare(b.date));});setModal(null);}}>Salva</Btn></Mdl>
    {/* BIA modals */}
    <Mdl open={modal==="addBia"} onClose={()=>setModal(null)} title="🔬 Nuova BIA">
      <div className="space-y-1">
        <Inp label="Data esame" type="date" value={fs.biaDate||""} onChange={e=>setFs({...fs,biaDate:e.target.value})}/>
        <div className="text-xs font-black tracking-wider py-1" style={{color:"var(--tx2)"}}>COMPOSIZIONE CORPOREA</div>
        {BIA_F.filter(f=>!f.k.includes("Pct")&&!["resistenza","reattanza","naK","bmrBia","bmiBia","bcmi"].includes(f.k)).map(f=><Inp key={f.k} label={f.icon+" "+f.l+" ("+f.u+")"} type="number" step="0.1" value={fs[f.k]||""} onChange={e=>setFs({...fs,[f.k]:e.target.value})}/>)}
        <div className="text-xs font-black tracking-wider py-1" style={{color:"var(--tx2)"}}>PERCENTUALI</div>
        {BIA_F.filter(f=>f.k.includes("Pct")).map(f=><Inp key={f.k} label={f.icon+" "+f.l} type="number" step="0.1" value={fs[f.k]||""} onChange={e=>setFs({...fs,[f.k]:e.target.value})}/>)}
        <div className="text-xs font-black tracking-wider py-1" style={{color:"var(--tx2)"}}>PARAMETRI</div>
        {BIA_F.filter(f=>["resistenza","reattanza","naK","bmrBia","bmiBia","bcmi","angoloFase"].includes(f.k)&&!f.k.includes("angolo")).map(f=><Inp key={f.k} label={f.icon+" "+f.l+(f.u?" ("+f.u+")":"")} type="number" step="0.1" value={fs[f.k]||""} onChange={e=>setFs({...fs,[f.k]:e.target.value})}/>)}
        <Btn cls="w-full mt-2" v="success" onClick={()=>{const en={date:fs.biaDate};BIA_F.forEach(f=>{if(fs[f.k])en[f.k]=fs[f.k];});up(d=>{if(!d.biaLog)d.biaLog=[];d.biaLog.push(en);d.biaLog.sort((a,b)=>a.date.localeCompare(b.date));});setModal(null);}}>💾 Salva BIA</Btn>
      </div>
    </Mdl>
    <Mdl open={modal==="editBia"} onClose={()=>setModal(null)} title="✏️ Modifica BIA">
      <div className="space-y-1">
        <Inp label="Data esame" type="date" value={fs.biaDate||""} onChange={e=>setFs({...fs,biaDate:e.target.value})}/>
        <div className="text-xs font-black tracking-wider py-1" style={{color:"var(--tx2)"}}>COMPOSIZIONE CORPOREA</div>
        {BIA_F.filter(f=>!f.k.includes("Pct")&&!["resistenza","reattanza","naK","bmrBia","bmiBia","bcmi"].includes(f.k)).map(f=><Inp key={f.k} label={f.icon+" "+f.l+" ("+f.u+")"} type="number" step="0.1" value={fs[f.k]||""} onChange={e=>setFs({...fs,[f.k]:e.target.value})}/>)}
        <div className="text-xs font-black tracking-wider py-1" style={{color:"var(--tx2)"}}>PERCENTUALI</div>
        {BIA_F.filter(f=>f.k.includes("Pct")).map(f=><Inp key={f.k} label={f.icon+" "+f.l} type="number" step="0.1" value={fs[f.k]||""} onChange={e=>setFs({...fs,[f.k]:e.target.value})}/>)}
        <div className="text-xs font-black tracking-wider py-1" style={{color:"var(--tx2)"}}>PARAMETRI</div>
        {BIA_F.filter(f=>["resistenza","reattanza","naK","bmrBia","bmiBia","bcmi","angoloFase"].includes(f.k)&&!f.k.includes("angolo")).map(f=><Inp key={f.k} label={f.icon+" "+f.l+(f.u?" ("+f.u+")":"")} type="number" step="0.1" value={fs[f.k]||""} onChange={e=>setFs({...fs,[f.k]:e.target.value})}/>)}
        <Btn cls="w-full mt-2" v="success" onClick={()=>{const en={date:fs.biaDate};BIA_F.forEach(f=>{if(fs[f.k])en[f.k]=fs[f.k];});up(d=>{if(!d.biaLog)d.biaLog=[];d.biaLog[fs.biaIdx]=en;d.biaLog.sort((a,b)=>a.date.localeCompare(b.date));});setModal(null);}}>💾 Salva</Btn>
      </div>
    </Mdl>
    <Mdl open={modal==="addA"} onClose={()=>setModal(null)} title="🏃 Attività"><Inp label="Data" type="date" value={fs.date||""} onChange={e=>setFs({...fs,date:e.target.value})}/><Inp label="Attività" value={fs.activity||""} onChange={e=>setFs({...fs,activity:e.target.value})} placeholder="Camminata"/><Inp label="Durata (min)" type="number" value={fs.duration||""} onChange={e=>setFs({...fs,duration:e.target.value})}/><Btn cls="w-full" onClick={()=>{if(!fs.activity)return;up(d=>{d.activities.push({id:gid(),date:fs.date,activity:fs.activity,duration:fs.duration||"0"});});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="editNutri"} onClose={()=>setModal(null)} title="🩺 Nutrizionista"><Inp label="Nome" value={fs.nN||""} onChange={e=>setFs({...fs,nN:e.target.value})} placeholder="Dott. Mario Rossi"/><Inp label="Telefono" value={fs.nP||""} onChange={e=>setFs({...fs,nP:e.target.value})} placeholder="+39 333 1234567" type="tel"/><Inp label="Email" value={fs.nE||""} onChange={e=>setFs({...fs,nE:e.target.value})} placeholder="email@esempio.it"/><Inp label="Indirizzo" value={fs.nA||""} onChange={e=>setFs({...fs,nA:e.target.value})} placeholder="Via Roma 10, Napoli"/><Inp label="Prossimo appuntamento" type="date" value={fs.nD||""} onChange={e=>setFs({...fs,nD:e.target.value})}/><label className="block mb-4"><span className="text-sm font-bold mb-1 block" style={{color:"var(--tx2)"}}>Note</span><textarea className="w-full rounded-xl px-4 py-3 h-16 resize-none outline-none" style={{background:"var(--m)",border:"2px solid var(--bd)",fontSize:"16px"}} value={fs.nO||""} onChange={e=>setFs({...fs,nO:e.target.value})}/></label><Btn cls="w-full" onClick={()=>{up(d=>{d.profile.nutri={name:fs.nN||"",phone:fs.nP||"",email:fs.nE||"",address:fs.nA||"",nextAppt:fs.nD||"",notes:fs.nO||""};});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="diary"} onClose={()=>setModal(null)} title="📝 Diario"><textarea className="w-full rounded-xl px-4 py-3 h-28 resize-none outline-none" style={{background:"var(--m)",border:"1px solid var(--bd)",fontSize:"16px"}} value={fs.note||""} onChange={e=>setFs({...fs,note:e.target.value})} placeholder="Come ti senti?"/><Btn cls="w-full mt-3" onClick={()=>{up(d=>{d.diary[fs.date]=fs.note;});setModal(null);}}>Salva</Btn></Mdl>
  </>);

  const tabs=[{id:"today",l:"Oggi",i:ic.home},{id:"schema",l:"Dieta",i:ic.list},{id:"shop",l:"Spesa",i:ic.cart},{id:"progress",l:"Progressi",i:ic.chart},{id:"more",l:"Altro",i:ic.user}];
  return(<div className="flex flex-col h-full" style={{background:"var(--bg)"}}>
    <header className="flex-shrink-0 px-5 pt-3 pb-2"><div className="flex items-center justify-between"><div className="flex items-center gap-2.5"><div className="w-10 h-10 rounded-2xl flex items-center justify-center text-base font-black shadow" style={{background:"linear-gradient(135deg,var(--ac),var(--a2))",color:"#fff"}}>{pr.name?.[0]?.toUpperCase()}</div><div><h1 className="text-base font-black leading-tight">Ciao, {pr.name}</h1><p className="text-xs font-semibold" style={{color:"var(--tx2)"}}>{GOL.find(g=>g.id===pr.goal)?.l} · {myTdee} kcal</p></div></div>{curBmi&&<div className="text-right"><div className="text-xl font-black" style={{color:bmiC(curBmi).c}}>{curBmi}</div><div className="text-[10px] font-bold" style={{color:"var(--tx2)"}}>BMI</div></div>}</div></header>
    <main className="flex-1 overflow-y-auto px-4 pb-24">{tab==="today"&&renderToday()}{tab==="schema"&&renderSchema()}{tab==="shop"&&renderShop()}{tab==="progress"&&renderProgress()}{tab==="more"&&renderMore()}</main>
    <nav className="flex-shrink-0 fixed bottom-0 left-0 right-0 flex justify-around py-2 pb-3 z-40 shadow-lg" style={{background:"var(--cd)",borderTop:"1px solid var(--bd)"}}>{tabs.map(t=>(<button key={t.id} onClick={()=>setTab(t.id)} className="flex flex-col items-center gap-0.5 py-1 px-2" style={{color:tab===t.id?"var(--ac)":"var(--tx2)",opacity:tab===t.id?1:.45}}><Ic d={t.i} s={20} c={tab===t.id?"var(--ac)":"var(--tx2)"}/><span className="text-[10px] font-bold">{t.l}</span>{tab===t.id&&<div className="w-1.5 h-1.5 rounded-full" style={{background:"var(--ac)"}}/>}</button>))}</nav>
    <Modals/>
  </div>);}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}</script>
</body>
</html>
