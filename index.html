<!DOCTYPE html>

<div id="root"></div>
<script type="text/babel" data-type="module">
const{useState,useEffect,useCallback}=React;
const gid=()=>Math.random().toString(36).slice(2,10);const td=()=>new Date().toISOString().split("T")[0];

const MT=["Colazione","Spuntino Mattina","Pranzo","Spuntino Pomeriggio","Cena"];const ME=["🌅","🍎","🍝","🍊","🌙"];const BP=["Vita","Fianchi","Petto","Braccia","Cosce","Polpacci"];
const AL=[{id:"sedentary",label:"Sedentario",desc:"Poco/nessun esercizio",f:1.2,em:"🪑"},{id:"light",label:"Leggero",desc:"1-3 giorni/sett",f:1.375,em:"🚶"},{id:"moderate",label:"Moderato",desc:"3-5 giorni/sett",f:1.55,em:"🏃"},{id:"active",label:"Attivo",desc:"6-7 giorni/sett",f:1.725,em:"💪"},{id:"veryActive",label:"Molto Attivo",desc:"Intenso quotidiano",f:1.9,em:"🔥"}];

const SK="nt4";const defP=()=>({name:"",sex:"",birthDate:"",height:null,weight:null,goal:"",activityLevel:"",targetWeight:null,allergies:"",waterGoal:8,onboarded:false});
const defD=()=>({profile:defP(),mealPlans:{},weightLog:[],measurements:[],water:{},mealChecks:{},activities:[],diary:{},goalsList:[],shoppingChecks:{}});
const load=()=>{try{const r=localStorage.getItem(SK);return r?{...defD(),...JSON.parse(r)}:defD();}catch(e){return defD();}};const save=d=>localStorage.setItem(SK,JSON.stringify(d));
const calcBmi=(w,h)=>{if(!w||!h)return null;return(w/((h/100)**2)).toFixed(1);};
const bmiC=b=>{const v=parseFloat(b);if(v<18.5)return{l:"Sottopeso",c:"var(--water)"};if(v<25)return{l:"Normopeso",c:"var(--ok)"};if(v<30)return{l:"Sovrappeso",c:"var(--wa)"};return{l:"Obesità",c:"var(--er)"};};

const parseDiet=text=>{const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);const dayP=[/^(luned[iì]|marted[iì]|mercoled[iì]|gioved[iì]|venerd[iì]|sabato|domenica)\b/i,/^giorno\s*(\d+)/i];const mealP=[{r:/^colazione\b/i,t:"Colazione"},{r:/^spuntino\s*(mattina|mat)/i,t:"Spuntino Mattina"},{r:/^pranzo\b/i,t:"Pranzo"},{r:/^spuntino\s*(pom|pomeriggio)/i,t:"Spuntino Pomeriggio"},{r:/^spuntino\b/i,t:"Spuntino Mattina"},{r:/^merenda\b/i,t:"Spuntino Pomeriggio"},{r:/^cena\b/i,t:"Cena"}];let cur=null;const days=[];let tmp=[];const flush=()=>{if(tmp.length){days.push([...tmp]);tmp=[];}};lines.forEach(l=>{if(dayP.some(p=>p.test(l))){flush();cur=null;return;}const mm=mealP.find(p=>p.r.test(l));if(mm){cur=mm.t;const af=l.replace(mm.r,"").replace(/^[\s:–\-]+/,"").trim();if(af)tmp.push({mealType:cur,food:af,alternatives:""});return;}if(cur){const alt=l.match(/^(oppure|alternativa)[\s:–\-]*(.*)/i);if(alt&&tmp.length)tmp[tmp.length-1].alternatives+=(tmp[tmp.length-1].alternatives?", ":"")+alt[2];else{const c=l.replace(/^[-•*]\s*/,"").replace(/^\d+[.)]\s*/,"").trim();if(c)tmp.push({mealType:cur,food:c,alternatives:""});}}});flush();if(!days.length&&tmp.length)days.push(tmp);return days;};
const readF=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(f);});
const Ic=({d,s=22,c="currentColor"})=>(<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>);
const ic={cal:"M3 4h18v18H3zM16 2v4M8 2v4M3 10h18",water:"M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z",cart:"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6M9 22a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM20 22a1 1 0 1 0 0-2 1 1 0 0 0 0 2z",chart:"M18 20V10M12 20V4M6 20v-6",plus:"M12 5v14M5 12h14",chk:"M20 6L9 17l-5-5",del:"M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2",cL:"M15 18l-6-6 6-6",cR:"M9 18l6-6-6-6",swap:"M7 16V4M7 4l-4 4M7 4l4 4M17 8v12M17 20l-4-4M17 20l4-4",home:"M3 12l9-9 9 9M5 10v10a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V10",up:"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12",edit:"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z",run:"M13 4a1 1 0 1 0 2 0 1 1 0 0 0-2 0zM7 21l3-4 2 2 4-5 4 3",user:"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"};
function Inp({label,...p}){return(<label className="block mb-4">{label&&<span className="text-sm font-bold mb-1.5 block" style={{color:"var(--tx2)"}}>{label}</span>}<input className="w-full rounded-2xl px-4 py-3.5 outline-none" style={{background:"var(--m)",color:"var(--tx)",border:"2px solid var(--bd)",fontSize:"16px"}} {...p}/></label>);}

function Mdl({open,onClose,title,children}){if(!open)return null;return(<div className="fixed inset-0 z-50 flex items-end justify-center" style={{background:"rgba(0,0,0,.5)",backdropFilter:"blur(8px)"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}><div className="rounded-t-3xl w-full max-h-[85vh] overflow-y-auto" style={{background:"var(--cd)",color:"var(--tx)",animation:"fadeUp .3s ease"}}><div className="flex items-center justify-between p-5 border-b sticky top-0 z-10" style={{borderColor:"var(--bd)",background:"var(--cd)"}}><h3 className="font-extrabold text-lg">{title}</h3><button onClick={onClose} className="w-9 h-9 rounded-full flex items-center justify-center" style={{background:"var(--m)"}}>✕</button></div><div className="p-5">{children}</div></div></div>);}
function Chrt({data,w=300,h=130,color="var(--ac)",label,unit=""}){if(!data.length)return<div className="text-center opacity-40 py-8 font-semibold">Nessun dato</div>;const vals=data.map(d=>d.value),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1,pd=28;const pts=data.map((d,i)=>({x:pd+(i/Math.max(data.length-1,1))*(w-2*pd),y:h-pd-((d.value-mn)/rng)*(h-2*pd-10),...d}));const line=pts.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ");const area=line+` L${pts[pts.length-1].x},${h-pd} L${pts[0].x},${h-pd} Z`;const gx="gr"+(label||"x").replace(/\s/g,"");return(<div className="flex flex-col items-center">{label&&<div className="text-sm font-bold mb-1" style={{color:"var(--tx2)"}}>{label}</div>}<svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}><defs><linearGradient id={gx} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.25"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs><path d={area} fill={`url(#${gx})`}/><path d={line} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>{pts.map((p,i)=>(<g key={i}><circle cx={p.x} cy={p.y} r="5" fill={color} stroke="var(--cd)" strokeWidth="2"/><text x={p.x} y={p.y-14} textAnchor="middle" fontSize="11" fill={color} fontWeight="800">{p.value}{unit}</text><text x={p.x} y={h-6} textAnchor="middle" fontSize="9" fill="var(--tx2)" fontWeight="600">{p.date?p.date.slice(5):""}</text></g>))}</svg></div>);}
function BMIGauge({val}){if(!val)return null;const v=parseFloat(val),cat=bmiC(val),pct=Math.min(100,Math.max(0,((v-15)/25)*100));return(<div className="flex flex-col items-center gap-2"><div className="text-4xl font-black" style={{color:cat.c,fontFamily:"'Playfair Display',serif"}}>{val}</div><div className="text-sm font-extrabold" style={{color:cat.c}}>{cat.l}</div><div className="w-full h-3.5 rounded-full overflow-hidden flex" style={{background:"var(--m)"}}><div style={{width:"18.5%",background:"var(--water)"}} className="h-full"/><div style={{width:"26%",background:"var(--ok)"}} className="h-full"/><div style={{width:"20%",background:"var(--wa)"}} className="h-full"/><div style={{flex:1,background:"var(--er)"}} className="h-full"/></div><div className="w-full relative h-4"><div className="absolute w-4 h-4 rounded-full border-2 shadow-lg" style={{left:`${pct}%`,top:"-10px",transform:"translateX(-50%)",background:cat.c,borderColor:"var(--tx)"}}/></div><div className="flex justify-between w-full text-[10px] font-bold" style={{color:"var(--tx2)"}}><span>Sotto</span><span>Normo</span><span>Sovra</span><span>Obesità</span></div></div>);}
function Onboarding({onComplete}){
  const[step,setStep]=useState(0);const[p,setP]=useState(defP());const[dir,setDir]=useState(1);const T=8;

    case 0:return(<div className="space-y-5" style={{animation:"fadeUp .4s ease"}}><div className="text-6xl text-center" style={{animation:"pulse 2s infinite"}}>🌿</div><h2 className="text-2xl font-black text-center" style={{fontFamily:"'Playfair Display',serif"}}>Come ti chiami?</h2><p className="text-center font-semibold" style={{color:"var(--tx2)"}}>Iniziamo il tuo percorso benessere</p><Inp placeholder="Il tuo nome" value={p.name} onChange={e=>setP({...p,name:e.target.value})}/></div>);

    case 2:return(<div className="space-y-5" style={{animation:"fadeUp .4s ease"}}><div className="text-5xl text-center">🎂</div><h2 className="text-2xl font-black text-center" style={{fontFamily:"'Playfair Display',serif"}}>Data di nascita</h2><Inp type="date" value={p.birthDate} onChange={e=>setP({...p,birthDate:e.target.value})}/>{p.birthDate&&<div className="text-center text-xl font-black" style={{color:"var(--ac)"}}>{a} anni</div>}</div>);

    case 6:return(<div className="space-y-4" style={{animation:"fadeUp .4s ease"}}><h2 className="text-2xl font-black text-center" style={{fontFamily:"'Playfair Display',serif"}}>Livello attività</h2><div className="space-y-2">{AL.map(x=>(<button key={x.id} onClick={()=>setP({...p,activityLevel:x.id})} className="w-full rounded-2xl p-3.5 text-left flex items-center gap-3 transition-all" style={{background:p.activityLevel===x.id?"var(--ac)":"var(--m)",color:p.activityLevel===x.id?"#1a1f16":"var(--tx)",border:`2px solid ${p.activityLevel===x.id?"var(--ac)":"var(--bd)"}`}}><span className="text-2xl">{x.em}</span><div><div className="font-extrabold">{x.label}</div><div className="text-xs opacity-70">{x.desc}</div></div></button>))}</div></div>);

  </div>);}
function NutriTrack(){
  const[data,setData]=useState(load);const[tab,setTab]=useState("today");const[sel,setSel]=useState(td());const[modal,setModal]=useState(null);const[fs,setFs]=useState({});const[impRes,setImpRes]=useState(null);

  const pr=data.profile,myAge=calcAge(pr.birthDate),myBmr=calcBmr(pr.weight,pr.height,myAge,pr.sex),myAf=AL.find(x=>x.id===pr.activityLevel),myTdee=Math.round(myBmr*(myAf?myAf.f:1.2));
  const latW=data.weightLog.length?data.weightLog[data.weightLog.length-1].value:pr.weight,curBmi=calcBmi(latW,pr.height);
  const tM=data.mealPlans[sel]||[],tW=data.water[sel]||0,tC=data.mealChecks[sel]||{},dow=DN[new Date(sel+"T12:00:00").getDay()];
  if(!pr.onboarded)return<Onboarding onComplete={profile=>up(d=>{d.profile=profile;d.weightLog.push({date:td(),value:profile.weight});})}/>;
  const handleFile=async e=>{const f=e.target.files?.[0];if(!f)return;try{let t=await readF(f);if(t.includes("%PDF")){const r=t.match(/\(([^)]+)\)/g);t=r?r.map(s=>s.slice(1,-1)).join("\n"):"";}const dm=parseDiet(t);setImpRes(dm.length?{ok:true,msg:`${dm.length} giorni, ${dm.reduce((s,d)=>s+d.length,0)} pasti`,dm}:{ok:false,msg:"Nessun pasto"});}catch(err){setImpRes({ok:false,msg:err.message});}};
  const confirmImp=sd=>{if(!impRes?.dm)return;const start=new Date(sd+"T12:00:00");up(d=>{impRes.dm.forEach((meals,i)=>{const dt=new Date(start);dt.setDate(dt.getDate()+i);const ds=dt.toISOString().split("T")[0];if(!d.mealPlans[ds])d.mealPlans[ds]=[];meals.forEach(m=>d.mealPlans[ds].push({id:gid(),...m}));});});setImpRes(null);setModal(null);};

  const renderToday=()=>(<div className="space-y-4">
    <div className="flex items-center justify-between"><button onClick={()=>{const d=new Date(sel+"T12:00:00");d.setDate(d.getDate()-1);setSel(d.toISOString().split("T")[0]);}} className="p-2.5 rounded-2xl" style={{background:"var(--m)"}}><Ic d={ic.cL} s={20}/></button><div className="text-center"><div className="text-lg font-extrabold">{dow}</div><div className="text-xs font-semibold" style={{color:"var(--tx2)"}}>{sel}</div></div><button onClick={()=>{const d=new Date(sel+"T12:00:00");d.setDate(d.getDate()+1);setSel(d.toISOString().split("T")[0]);}} className="p-2.5 rounded-2xl" style={{background:"var(--m)"}}><Ic d={ic.cR} s={20}/></button></div>
    <div className="grid grid-cols-4 gap-2">{[{v:latW||"—",l:"Peso",c:"var(--terra)"},{v:curBmi||"—",l:"BMI",c:curBmi?bmiC(curBmi).c:"var(--ac)"},{v:myTdee,l:"kcal",c:"var(--wa)"},{v:`${tW}/${pr.waterGoal||8}`,l:"Acqua",c:"var(--water)"}].map((s,i)=>(<div key={i} className="rounded-2xl p-3 text-center" style={{background:"var(--cd)",border:"1px solid var(--bd)"}}><div className="text-lg font-black" style={{color:s.c}}>{s.v}</div><div className="text-[10px] font-bold mt-0.5" style={{color:"var(--tx2)"}}>{s.l}</div></div>))}</div>
    <div className="rounded-2xl p-4" style={{background:"var(--cd)",border:"1px solid var(--bd)"}}><div className="flex items-center justify-between mb-3"><div className="flex items-center gap-2"><span className="text-lg">💧</span><span className="font-extrabold">Acqua</span></div><span className="font-black" style={{color:"var(--water)"}}>{tW}/{pr.waterGoal||8}</span></div><div className="flex gap-2">{Array.from({length:pr.waterGoal||8}).map((_,i)=>(<button key={i} onClick={()=>up(d=>{d.water[sel]=i<tW?i:i+1;})} className="flex-1 h-9 rounded-xl transition-all" style={{background:i<tW?"var(--water)":"var(--m)",opacity:i<tW?1:.25}}/>))}</div></div>
    <div className="rounded-2xl p-4" style={{background:"var(--cd)",border:"1px solid var(--bd)"}}><div className="flex items-center justify-between mb-3"><span className="font-extrabold">🍽️ Pasti</span><div className="flex gap-2"><button onClick={()=>setModal("import")} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:"var(--m)"}}><Ic d={ic.up} s={16}/></button><button onClick={()=>{setFs({date:sel,mealType:"Colazione",food:"",alternatives:""});setModal("addMeal");}} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.plus} s={16} c="#1a1f16"/></button></div></div>
    {tM.length===0?(<div className="text-center py-6 opacity-40"><p className="mb-3 font-semibold">Nessun pasto</p><Btn v="secondary" onClick={()=>setModal("import")}>🌿 Carica dieta</Btn></div>):(<div className="space-y-2">{MT.map((type,ti)=>{const ml=tM.filter(m=>m.mealType===type);if(!ml.length)return null;return(<div key={type} className="rounded-xl p-3" style={{background:"var(--m)"}}><div className="text-xs font-black tracking-wider mb-2 flex items-center gap-1.5" style={{color:"var(--tx2)"}}><span>{ME[ti]}</span>{type.toUpperCase()}</div>{ml.map(meal=>(<div key={meal.id} className="flex items-start gap-2.5 mb-1.5"><button onClick={()=>up(d=>{if(!d.mealChecks[sel])d.mealChecks[sel]={};d.mealChecks[sel][meal.id]=!d.mealChecks[sel]?.[meal.id];})} className="mt-0.5 w-6 h-6 rounded-lg flex items-center justify-center flex-shrink-0" style={{background:tC[meal.id]?"var(--ac)":"transparent",border:`2px solid ${tC[meal.id]?"var(--ac)":"var(--bd)"}`}}>{tC[meal.id]&&<Ic d={ic.chk} s={12} c="#1a1f16"/>}</button><div className="flex-1 min-w-0"><div className={`font-semibold ${tC[meal.id]?"line-through opacity-35":""}`}>{meal.food}</div>{meal.alternatives&&<div className="flex items-center gap-1 mt-0.5"><Ic d={ic.swap} s={12} c="var(--ac)"/><span className="text-xs opacity-50">Alt: {meal.alternatives}</span></div>}</div><button onClick={()=>up(d=>{d.mealPlans[sel]=d.mealPlans[sel].filter(m=>m.id!==meal.id);})} className="opacity-15 hover:opacity-70"><Ic d={ic.del} s={14}/></button></div>))}</div>);})}</div>)}</div>
  </div>);

  const renderPlan=()=>{const ws=new Date(sel+"T12:00:00");ws.setDate(ws.getDate()-ws.getDay()+1);const wk=Array.from({length:7}).map((_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d.toISOString().split("T")[0];});return(<div className="space-y-4"><div className="flex items-center justify-between"><h2 className="font-extrabold text-lg">📅 Piano</h2><Btn onClick={()=>setModal("import")}>Carica</Btn></div><div className="flex gap-1.5 overflow-x-auto pb-1">{wk.map((d,i)=>{const has=(data.mealPlans[d]||[]).length>0;return(<button key={d} onClick={()=>setSel(d)} className="flex-1 min-w-[44px] rounded-xl py-2.5 text-center" style={{background:d===sel?"var(--ac)":"var(--m)",color:d===sel?"#1a1f16":"var(--tx)"}}><div className="text-[10px] font-bold">{SD[(i+1)%7]}</div><div className="font-black">{d.slice(8)}</div>{has&&<div className="w-2 h-2 rounded-full mx-auto mt-0.5" style={{background:d===sel?"#1a1f16":"var(--ac)"}}/>}</button>);})}</div>{renderToday()}</div>);};

  const renderShop=()=>{const ws=new Date(sel+"T12:00:00");ws.setDate(ws.getDate()-ws.getDay()+1);const wk=Array.from({length:7}).map((_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d.toISOString().split("T")[0];});const items=[];wk.forEach(d=>(data.mealPlans[d]||[]).forEach(m=>m.food.split(",").forEach(it=>{const t=it.trim().toLowerCase();if(t&&!items.find(a2=>a2.n===t))items.push({n:t,id:t});})));const ch=data.shoppingChecks||{};const done=items.filter(i2=>ch[i2.id]).length;return(<div className="space-y-4"><h2 className="font-extrabold text-lg">🛒 Spesa</h2><div className="text-sm font-semibold" style={{color:"var(--tx2)"}}>{done}/{items.length}</div>{items.length>0&&<div className="h-2.5 rounded-full overflow-hidden" style={{background:"var(--m)"}}><div className="h-full rounded-full" style={{width:`${items.length?(done/items.length)*100:0}%`,background:"var(--ac)"}}/></div>}{items.length===0?<div className="text-center py-10 opacity-30 font-semibold">Aggiungi pasti al piano</div>:(<div className="rounded-2xl overflow-hidden" style={{background:"var(--cd)",border:"1px solid var(--bd)"}}>{items.map((it,i3)=>(<div key={it.id} className="flex items-center gap-3 px-4 py-3.5" style={{borderBottom:i3<items.length-1?"1px solid var(--bd)":"none"}}><button onClick={()=>up(d=>{if(!d.shoppingChecks)d.shoppingChecks={};d.shoppingChecks[it.id]=!d.shoppingChecks[it.id];})} className="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0" style={{background:ch[it.id]?"var(--ac)":"transparent",border:`2px solid ${ch[it.id]?"var(--ac)":"var(--bd)"}`}}>{ch[it.id]&&<Ic d={ic.chk} s={14} c="#1a1f16"/>}</button><span className={`font-semibold capitalize ${ch[it.id]?"line-through opacity-25":""}`}>{it.n}</span></div>))}</div>)}</div>);};

  const renderProgress=()=>{const bmiH=data.weightLog.map(w2=>({date:w2.date,value:parseFloat(calcBmi(w2.value,pr.height)||0)})).filter(b3=>b3.value>0);return(<div className="space-y-4"><h2 className="font-extrabold text-lg">📊 Progressi</h2>{pr.height&&<div className="rounded-2xl p-5" style={{background:"linear-gradient(135deg,var(--cd),rgba(143,188,106,.08))",border:"1px solid var(--bd)"}}><BMIGauge val={curBmi}/><div className="flex justify-center gap-6 mt-3 text-sm font-semibold" style={{color:"var(--tx2)"}}><span>{pr.height}cm</span><span>{latW}kg</span><span>{myTdee}kcal</span></div></div>}<div className="rounded-2xl p-4" style={{background:"var(--cd)",border:"1px solid var(--bd)"}}><div className="flex items-center justify-between mb-2"><span className="font-extrabold">⚖️ Peso</span><button onClick={()=>{setFs({date:td(),value:""});setModal("addW");}} className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.plus} s={14} c="#1a1f16"/></button></div><Chrt data={data.weightLog.slice(-10)} color="var(--terra)" unit=" kg"/>{data.weightLog.length>=2&&<div className="text-center mt-2 font-black" style={{color:data.weightLog[data.weightLog.length-1].value<=data.weightLog[0].value?"var(--ok)":"var(--er)"}}>{(data.weightLog[data.weightLog.length-1].value-data.weightLog[0].value)>0?"+":""}{(data.weightLog[data.weightLog.length-1].value-data.weightLog[0].value).toFixed(1)} kg</div>}</div>{bmiH.length>=2&&<div className="rounded-2xl p-4" style={{background:"var(--cd)",border:"1px solid var(--bd)"}}><span className="font-extrabold">📈 BMI</span><Chrt data={bmiH.slice(-10)} color="var(--wa)"/></div>}<div className="rounded-2xl p-4" style={{background:"var(--cd)",border:"1px solid var(--bd)"}}><div className="flex items-center justify-between mb-2"><span className="font-extrabold">📏 Misurazioni</span><button onClick={()=>{setFs({date:td(),...Object.fromEntries(BP.map(p2=>[p2,""]))});setModal("addM");}} className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.plus} s={14} c="#1a1f16"/></button></div>{data.measurements.length===0?<div className="text-center py-4 opacity-30 font-semibold">Nessuna</div>:<div className="grid grid-cols-2 gap-2">{BP.map(part=>{const vs=data.measurements.filter(m2=>m2[part]).map(m2=>({date:m2.date,value:parseFloat(m2[part])}));if(!vs.length)return null;return<div key={part} className="rounded-xl p-2" style={{background:"var(--m)"}}><Chrt data={vs.slice(-5)} w={140} h={80} color="var(--sage)" label={part} unit="cm"/></div>;})}</div>}</div></div>);};

  const renderMore=()=>(<div className="space-y-4">
    <div className="rounded-2xl p-5" style={{background:"linear-gradient(135deg,var(--cd),rgba(143,188,106,.1))",border:"1px solid var(--bd)"}}><div className="flex items-center gap-3 mb-4"><div className="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl font-black" style={{background:"linear-gradient(135deg,var(--ac),var(--a2))",color:"#1a1f16"}}>{pr.name?.[0]?.toUpperCase()}</div><div><div className="font-extrabold text-lg">{pr.name}</div><div className="text-sm font-semibold" style={{color:"var(--tx2)"}}>{pr.sex==="M"?"M":"F"} · {myAge} anni · {pr.height}cm</div></div></div><div className="grid grid-cols-3 gap-2 text-center">{[{v:myTdee,l:"kcal/g",c:"var(--ac)"},{v:Math.round(myBmr),l:"BMR",c:"var(--wa)"},{v:curBmi||"—",l:"BMI",c:curBmi?bmiC(curBmi).c:"var(--ac)"}].map((s,i)=>(<div key={i} className="rounded-xl p-2.5" style={{background:"var(--m)"}}><div className="font-black" style={{color:s.c}}>{s.v}</div><div className="text-[10px] font-bold" style={{color:"var(--tx2)"}}>{s.l}</div></div>))}</div><button onClick={()=>up(d=>{d.profile.onboarded=false;})} className="mt-3 text-sm font-bold opacity-30 underline w-full text-center">Modifica profilo</button></div>
    <div className="rounded-2xl p-4" style={{background:"var(--cd)",border:"1px solid var(--bd)"}}><div className="flex items-center justify-between mb-2"><span className="font-extrabold">🏃 Attività</span><button onClick={()=>{setFs({date:td(),activity:"",duration:""});setModal("addA");}} className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.plus} s={14} c="#1a1f16"/></button></div>{data.activities.slice(-5).reverse().map(ax=>(<div key={ax.id} className="flex justify-between py-2" style={{borderBottom:"1px solid var(--bd)"}}><div><b>{ax.activity}</b> <span style={{color:"var(--tx2)"}}>· {ax.duration}m</span></div><span className="text-sm" style={{color:"var(--tx2)"}}>{ax.date.slice(5)}</span></div>))}{!data.activities.length&&<div className="text-center py-3 opacity-30 font-semibold">Nessuna</div>}</div>
    <div className="rounded-2xl p-4" style={{background:"var(--cd)",border:"1px solid var(--bd)"}}><div className="flex items-center justify-between mb-2"><span className="font-extrabold">📝 Diario</span><button onClick={()=>{setFs({date:sel,note:data.diary[sel]||""});setModal("diary");}} className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.edit} s={14} c="#1a1f16"/></button></div>{data.diary[sel]?<p className="font-semibold">{data.diary[sel]}</p>:<div className="text-center py-3 opacity-30 font-semibold">Nessuna nota</div>}</div>
    <div className="rounded-2xl p-4" style={{background:"var(--cd)",border:"1px solid var(--bd)"}}><div className="text-xs font-black tracking-wider mb-3" style={{color:"var(--tx2)"}}>⚙️ DATI</div><div className="flex gap-2"><Btn v="secondary" onClick={()=>{const bl=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const anc=document.createElement("a");anc.href=URL.createObjectURL(bl);anc.download="nutritrack.json";anc.click();}}>Esporta</Btn><Btn v="danger" onClick={()=>{if(confirm("Reset?"))setData(defD());}}>Reset</Btn></div></div>
  </div>);

  const renderModals=()=>(<>
    <Mdl open={modal==="import"} onClose={()=>{setModal(null);setImpRes(null);}} title="🌿 Carica Dieta"><div className="space-y-4"><div className="rounded-2xl p-5 text-center border-2 border-dashed" style={{borderColor:"var(--bd)"}}><div className="text-4xl mb-2">📄</div><p className="font-semibold mb-3" style={{color:"var(--tx2)"}}>.txt / .csv / .pdf</p><input type="file" accept=".txt,.csv,.pdf" onChange={handleFile} className="w-full"/></div>{impRes&&<div className="rounded-2xl p-4" style={{background:impRes.ok?"rgba(143,188,106,.15)":"rgba(199,95,95,.15)",border:`1px solid ${impRes.ok?"var(--ok)":"var(--er)"}`}}><div className="font-extrabold" style={{color:impRes.ok?"var(--ok)":"var(--er)"}}>{impRes.ok?"✓ ":"✗ "}{impRes.msg}</div>{impRes.ok&&<div className="mt-3"><Inp label="Data inizio" type="date" value={fs.impDate||td()} onChange={e=>setFs({...fs,impDate:e.target.value})}/><Btn v="success" cls="w-full" onClick={()=>confirmImp(fs.impDate||td())}>Importa</Btn></div>}</div>}<textarea className="w-full rounded-2xl px-4 py-3 h-24 resize-none outline-none" style={{background:"var(--m)",color:"var(--tx)",border:"1px solid var(--bd)",fontSize:"16px"}} placeholder="...o incolla qui" value={fs.mt||""} onChange={e=>setFs({...fs,mt:e.target.value})}/><Btn v="secondary" cls="w-full" onClick={()=>{if(!fs.mt?.trim())return;const dm=parseDiet(fs.mt);setImpRes(dm.length?{ok:true,msg:`${dm.length}g, ${dm.reduce((s,d2)=>s+d2.length,0)} pasti`,dm}:{ok:false,msg:"Nessun pasto"});}}>Analizza</Btn></div></Mdl>
    <Mdl open={modal==="addMeal"} onClose={()=>setModal(null)} title="🍽️ Pasto"><select className="w-full rounded-2xl px-4 py-3.5 outline-none mb-4" style={{background:"var(--m)",color:"var(--tx)",border:"2px solid var(--bd)",fontSize:"16px"}} value={fs.mealType||""} onChange={e=>setFs({...fs,mealType:e.target.value})}>{MT.map(t2=><option key={t2}>{t2}</option>)}</select><Inp label="Alimenti" value={fs.food||""} onChange={e=>setFs({...fs,food:e.target.value})} placeholder="Yogurt, frutta"/><Inp label="Alternative" value={fs.alternatives||""} onChange={e=>setFs({...fs,alternatives:e.target.value})}/><Btn cls="w-full" onClick={()=>{if(!fs.food?.trim())return;up(d=>{if(!d.mealPlans[fs.date])d.mealPlans[fs.date]=[];d.mealPlans[fs.date].push({id:gid(),mealType:fs.mealType,food:fs.food.trim(),alternatives:fs.alternatives?.trim()||""});});setModal(null);}}>Aggiungi</Btn></Mdl>
    <Mdl open={modal==="addW"} onClose={()=>setModal(null)} title="⚖️ Peso"><Inp label="Data" type="date" value={fs.date||""} onChange={e=>setFs({...fs,date:e.target.value})}/><Inp label="Peso (kg)" type="number" step="0.1" value={fs.value||""} onChange={e=>setFs({...fs,value:e.target.value})}/>{fs.value&&pr.height&&(()=>{const preview=calcBmi(parseFloat(fs.value),pr.height);return preview?<div className="rounded-2xl p-3 mb-3 flex items-center gap-3" style={{background:"var(--m)"}}><span className="text-xl font-black" style={{color:bmiC(preview).c}}>{preview}</span><span className="font-bold" style={{color:bmiC(preview).c}}>{bmiC(preview).l}</span></div>:null;})()}<Btn cls="w-full" onClick={()=>{if(!fs.value)return;up(d=>{d.weightLog.push({date:fs.date,value:parseFloat(fs.value)});d.weightLog.sort((a2,b2)=>a2.date.localeCompare(b2.date));});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="addM"} onClose={()=>setModal(null)} title="📏 Misurazioni"><Inp label="Data" type="date" value={fs.date||""} onChange={e=>setFs({...fs,date:e.target.value})}/>{BP.map(p2=><Inp key={p2} label={p2+" (cm)"} type="number" step="0.1" value={fs[p2]||""} onChange={e=>setFs({...fs,[p2]:e.target.value})}/>)}<Btn cls="w-full" onClick={()=>{const en={id:gid(),date:fs.date};BP.forEach(p2=>{if(fs[p2])en[p2]=fs[p2];});up(d=>{d.measurements.push(en);d.measurements.sort((a2,b2)=>a2.date.localeCompare(b2.date));});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="addA"} onClose={()=>setModal(null)} title="🏃 Attività"><Inp label="Data" type="date" value={fs.date||""} onChange={e=>setFs({...fs,date:e.target.value})}/><Inp label="Attività" value={fs.activity||""} onChange={e=>setFs({...fs,activity:e.target.value})} placeholder="Camminata"/><Inp label="Durata (min)" type="number" value={fs.duration||""} onChange={e=>setFs({...fs,duration:e.target.value})}/><Btn cls="w-full" onClick={()=>{if(!fs.activity)return;up(d=>{d.activities.push({id:gid(),date:fs.date,activity:fs.activity,duration:fs.duration||"0"});});setModal(null);}}>Salva</Btn></Mdl>
    <Mdl open={modal==="diary"} onClose={()=>setModal(null)} title={"📝 Diario · "+(fs.date||"")}><textarea className="w-full rounded-2xl px-4 py-3 h-28 resize-none outline-none" style={{background:"var(--m)",color:"var(--tx)",border:"1px solid var(--bd)",fontSize:"16px"}} value={fs.note||""} onChange={e=>setFs({...fs,note:e.target.value})} placeholder="Come ti senti?"/><Btn cls="w-full mt-3" onClick={()=>{up(d=>{d.diary[fs.date]=fs.note;});setModal(null);}}>Salva</Btn></Mdl>
  </>);

  const tabs=[{id:"today",l:"Oggi",i:ic.home},{id:"plan",l:"Piano",i:ic.cal},{id:"shop",l:"Spesa",i:ic.cart},{id:"progress",l:"Progressi",i:ic.chart},{id:"more",l:"Altro",i:ic.user}];
  return(<div className="flex flex-col h-full" style={{background:"var(--bg)",color:"var(--tx)"}}>
    <header className="flex-shrink-0 px-5 pt-4 pb-2"><div className="flex items-center justify-between"><div className="flex items-center gap-3"><div className="w-11 h-11 rounded-2xl flex items-center justify-center text-lg font-black" style={{background:"linear-gradient(135deg,var(--ac),var(--a2))",color:"#1a1f16"}}>{pr.name?.[0]?.toUpperCase()}</div><div><h1 className="text-lg font-black">Ciao, {pr.name}</h1><p className="text-xs font-semibold -mt-0.5" style={{color:"var(--tx2)"}}>{GOL.find(g=>g.id===pr.goal)?.label} · {myTdee} kcal</p></div></div>{curBmi&&<div className="text-right"><div className="text-xl font-black" style={{color:bmiC(curBmi).c,fontFamily:"'Playfair Display',serif"}}>{curBmi}</div><div className="text-[10px] font-bold" style={{color:"var(--tx2)"}}>BMI</div></div>}</div></header>
    <main className="flex-1 overflow-y-auto px-4 pb-24">{tab==="today"&&renderToday()}{tab==="plan"&&renderPlan()}{tab==="shop"&&renderShop()}{tab==="progress"&&renderProgress()}{tab==="more"&&renderMore()}</main>
    <nav className="flex-shrink-0 fixed bottom-0 left-0 right-0 flex justify-around py-2 pb-3 z-40" style={{background:"var(--cd)",borderTop:"2px solid var(--bd)"}}>{tabs.map(t2=>(<button key={t2.id} onClick={()=>setTab(t2.id)} className="flex flex-col items-center gap-0.5 py-1.5 px-3" style={{color:tab===t2.id?"var(--ac)":"var(--tx)",opacity:tab===t2.id?1:.3}}><Ic d={t2.i} s={22} c={tab===t2.id?"var(--ac)":"var(--tx)"}/><span className="text-[11px] font-bold">{t2.l}</span>{tab===t2.id&&<div className="w-1.5 h-1.5 rounded-full" style={{background:"var(--ac)"}}/>}</button>))}</nav>
    {renderModals()}
  </div>);}
