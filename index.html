<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0c12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="NutriTrack - Il tuo diario alimentare personale" />
  <title>NutriTrack</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body { background: #0a0c12; font-family: 'Outfit', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
/* ── helpers ─────────────────────────────────────────────── */
const { useState, useEffect, useCallback } = React;
const gid = () => Math.random().toString(36).slice(2, 10);
const td = () => new Date().toISOString().split("T")[0];
const DN = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
const SD = ["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
const MT = ["Colazione","Spuntino Mattina","Pranzo","Spuntino Pomeriggio","Cena"];
const BP = ["Vita","Fianchi","Petto","Braccia","Cosce","Polpacci"];
const AL = [
  { id:"sedentary", label:"Sedentario", desc:"Poco o nessun esercizio", f:1.2 },
  { id:"light", label:"Leggero", desc:"1-3 giorni/sett", f:1.375 },
  { id:"moderate", label:"Moderato", desc:"3-5 giorni/sett", f:1.55 },
  { id:"active", label:"Attivo", desc:"6-7 giorni/sett", f:1.725 },
  { id:"veryActive", label:"Molto Attivo", desc:"Intenso quotidiano", f:1.9 },
];
const GO = [
  { id:"lose", label:"Perdere peso", icon:"↓", color:"#38bdf8" },
  { id:"maintain", label:"Mantenere", icon:"→", color:"#22c55e" },
  { id:"gain", label:"Aumentare massa", icon:"↑", color:"#f59e0b" },
];

const SK = "nutritrack_v3";
const defP = () => ({ name:"", sex:"", birthDate:"", height:null, weight:null, goal:"", activityLevel:"", targetWeight:null, allergies:"", waterGoal:8, onboarded:false });
const defD = () => ({ profile:defP(), mealPlans:{}, weightLog:[], measurements:[], water:{}, mealChecks:{}, photos:[], activities:[], diary:{}, goalsList:[], shoppingChecks:{} });
const ld = () => { try { const r = localStorage.getItem(SK); return r ? { ...defD(), ...JSON.parse(r) } : defD(); } catch(e) { return defD(); } };
const sv = d => localStorage.setItem(SK, JSON.stringify(d));

const calcBmi = (w, h) => { if (!w || !h) return null; return (w / ((h / 100) ** 2)).toFixed(1); };
const bmiC = b => { const v = parseFloat(b); if (v < 18.5) return { l:"Sottopeso", c:"#38bdf8" }; if (v < 25) return { l:"Normopeso", c:"#22c55e" }; if (v < 30) return { l:"Sovrappeso", c:"#f59e0b" }; return { l:"Obesità", c:"#ef4444" }; };
const calcBmr = (w, h, a, s) => { if (!w || !h || !a) return 0; return s === "F" ? 447.593 + 9.247*w + 3.098*h - 4.330*a : 88.362 + 13.397*w + 4.799*h - 5.677*a; };
const calcAge = bd => { if (!bd) return 0; const b = new Date(bd); const t = new Date(); let a = t.getFullYear() - b.getFullYear(); if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--; return a; };

const parseDiet = text => {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const dayP = [/^(luned[iì]|marted[iì]|mercoled[iì]|gioved[iì]|venerd[iì]|sabato|domenica)\b/i, /^giorno\s*(\d+)/i];
  const mealP = [
    { r:/^colazione\b/i, t:"Colazione" }, { r:/^spuntino\s*(mattina|mat)/i, t:"Spuntino Mattina" },
    { r:/^pranzo\b/i, t:"Pranzo" }, { r:/^spuntino\s*(pom|pomeriggio)/i, t:"Spuntino Pomeriggio" },
    { r:/^spuntino\b/i, t:"Spuntino Mattina" }, { r:/^merenda\b/i, t:"Spuntino Pomeriggio" },
    { r:/^cena\b/i, t:"Cena" },
  ];
  let cur = null; const days = []; let tmp = [];
  const flush = () => { if (tmp.length) { days.push([...tmp]); tmp = []; } };
  lines.forEach(l => {
    if (dayP.some(p => p.test(l))) { flush(); cur = null; return; }
    const mm = mealP.find(p => p.r.test(l));
    if (mm) { cur = mm.t; const af = l.replace(mm.r, "").replace(/^[\s:–\-]+/, "").trim(); if (af) tmp.push({ mealType: cur, food: af, alternatives: "" }); return; }
    if (cur) {
      const alt = l.match(/^(oppure|alternativa|o\s+in\s+alternativa)[\s:–\-]*(.*)/i);
      if (alt && tmp.length) { tmp[tmp.length - 1].alternatives += (tmp[tmp.length - 1].alternatives ? ", " : "") + alt[2]; }
      else { const c = l.replace(/^[-•*]\s*/, "").replace(/^\d+[.)]\s*/, "").trim(); if (c) tmp.push({ mealType: cur, food: c, alternatives: "" }); }
    }
  });
  flush(); if (!days.length && tmp.length) days.push(tmp); return days;
};
const readF = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsText(f); });

/* ── icon ────────────────────────────────────────────────── */
const Ic = ({ d, s = 20, c = "currentColor" }) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d} /></svg>
);
const ic = {
  cal:"M3 4h18v18H3zM16 2v4M8 2v4M3 10h18",
  water:"M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z",
  cart:"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6M9 22a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM20 22a1 1 0 1 0 0-2 1 1 0 0 0 0 2z",
  chart:"M18 20V10M12 20V4M6 20v-6",
  run:"M13 4a1 1 0 1 0 2 0 1 1 0 0 0-2 0zM7 21l3-4 2 2 4-5 4 3",
  edit:"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z",
  plus:"M12 5v14M5 12h14",
  chk:"M20 6L9 17l-5-5",
  del:"M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2",
  cL:"M15 18l-6-6 6-6", cR:"M9 18l6-6-6-6",
  swap:"M7 16V4M7 4l-4 4M7 4l4 4M17 8v12M17 20l-4-4M17 20l4-4",
  home:"M3 12l9-9 9 9M5 10v10a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V10",
  up:"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12",
  ht:"M12 2v20M8 6l4-4 4 4M8 18l4 4 4-4",
  user:"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
};

/* ── shared ui ───────────────────────────────────────────── */
const TH = { "--bg":"#0a0c12","--cd":"#13151f","--m":"#1b1e2b","--bd":"#252839","--tx":"#e2e3ea","--ac":"#6d5cfc","--a2":"#a78bfa","--w":"#38bdf8","--ok":"#22c55e","--wa":"#f59e0b","--er":"#ef4444" };

function Inp({ label, ...p }) {
  return (<label className="block mb-3">{label && <span className="text-xs font-semibold opacity-50 mb-1 block">{label}</span>}<input className="w-full rounded-2xl px-4 py-3 text-sm outline-none" style={{ background:"var(--m)", color:"var(--tx)", border:"1px solid var(--bd)" }} {...p} /></label>);
}
function Btn({ children, v = "primary", cls = "", ...p }) {
  const st = { primary:{ background:"var(--ac)", color:"#fff" }, secondary:{ background:"var(--m)", color:"var(--tx)" }, danger:{ background:"var(--er)", color:"#fff" }, success:{ background:"var(--ok)", color:"#fff" } };
  return <button className={`px-5 py-3 rounded-2xl text-sm font-bold transition-all active:scale-95 ${cls}`} style={st[v]} {...p}>{children}</button>;
}
function Mdl({ open, onClose, title, children }) {
  if (!open) return null;
  return (<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ background:"rgba(0,0,0,0.6)", backdropFilter:"blur(6px)" }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="rounded-t-3xl sm:rounded-3xl w-full sm:max-w-md max-h-[88vh] overflow-y-auto shadow-2xl" style={{ background:"var(--cd)", color:"var(--tx)" }}>
      <div className="flex items-center justify-between p-5 border-b sticky top-0 z-10" style={{ borderColor:"var(--bd)", background:"var(--cd)" }}><h3 className="font-bold text-lg">{title}</h3><button onClick={onClose} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background:"var(--m)" }}>✕</button></div>
      <div className="p-5">{children}</div>
    </div>
  </div>);
}
function Chrt({ data, w = 280, h = 120, color = "var(--ac)", label, unit = "" }) {
  if (!data.length) return <div className="text-center text-sm opacity-40 py-6">Nessun dato</div>;
  const vals = data.map(d => d.value); const mn = Math.min(...vals), mx = Math.max(...vals), rng = mx - mn || 1, pd = 24;
  const pts = data.map((d, i) => ({ x: pd + (i / Math.max(data.length - 1, 1)) * (w - 2 * pd), y: h - pd - ((d.value - mn) / rng) * (h - 2 * pd - 8), ...d }));
  const line = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x},${p.y}`).join(" ");
  const area = line + ` L${pts[pts.length - 1].x},${h - pd} L${pts[0].x},${h - pd} Z`;
  const gx = "g" + (label || "x").replace(/\s/g, "");
  return (<div className="flex flex-col items-center">{label && <div className="text-xs font-semibold mb-1 opacity-50">{label}</div>}
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <defs><linearGradient id={gx} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.2" /><stop offset="100%" stopColor={color} stopOpacity="0" /></linearGradient></defs>
      <path d={area} fill={`url(#${gx})`} /><path d={line} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map((p, i) => (<g key={i}><circle cx={p.x} cy={p.y} r="4" fill={color} /><text x={p.x} y={p.y - 12} textAnchor="middle" fontSize="9" fill={color} fontWeight="700">{p.value}{unit}</text><text x={p.x} y={h - 4} textAnchor="middle" fontSize="7" fill="#555">{p.date ? p.date.slice(5) : ""}</text></g>))}
    </svg></div>);
}
function BMIGauge({ val }) {
  if (!val) return null; const v = parseFloat(val); const cat = bmiC(val); const pct = Math.min(100, Math.max(0, ((v - 15) / 25) * 100));
  return (<div className="flex flex-col items-center gap-2">
    <div className="text-3xl font-black" style={{ color: cat.c }}>{val}</div>
    <div className="text-xs font-bold" style={{ color: cat.c }}>{cat.l}</div>
    <div className="w-full h-3 rounded-full overflow-hidden flex" style={{ background:"var(--m)" }}><div style={{ width:"18.5%", background:"#38bdf8" }} className="h-full" /><div style={{ width:"26%", background:"#22c55e" }} className="h-full" /><div style={{ width:"20%", background:"#f59e0b" }} className="h-full" /><div style={{ flex:1, background:"#ef4444" }} className="h-full" /></div>
    <div className="w-full relative h-3"><div className="absolute w-3.5 h-3.5 rounded-full border-2" style={{ left:`${pct}%`, top:"-9px", transform:"translateX(-50%)", background:cat.c, borderColor:"#fff" }} /></div>
    <div className="flex justify-between w-full text-[8px] opacity-40"><span>Sotto</span><span>Normo</span><span>Sovra</span><span>Obesità</span></div>
  </div>);
}

/* ════════════════════════════════════════════════════════════
   ONBOARDING
   ════════════════════════════════════════════════════════════ */
function Onboarding({ onComplete }) {
  const [step, setStep] = useState(0);
  const [p, setP] = useState(defP());
  const [dir, setDir] = useState(1);
  const T = 8;
  const next = () => { setDir(1); setStep(s => Math.min(s + 1, T - 1)); };
  const prev = () => { setDir(-1); setStep(s => Math.max(s - 1, 0)); };
  const canN = () => { if (step === 0) return p.name.trim().length > 0; if (step === 1) return !!p.sex; if (step === 2) return !!p.birthDate; if (step === 3) return p.height > 0; if (step === 4) return p.weight > 0; if (step === 5) return !!p.goal; if (step === 6) return !!p.activityLevel; return true; };
  const a = calcAge(p.birthDate); const b = calcBmr(p.weight, p.height, a, p.sex); const af = AL.find(x => x.id === p.activityLevel); const tdee = Math.round(b * (af ? af.f : 1.2)); const myBmi = calcBmi(p.weight, p.height);

  const renderStep = () => {
    switch (step) {
      case 0: return (<div className="space-y-6"><div className="w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-3xl font-black" style={{ background:"linear-gradient(135deg,var(--ac),var(--a2))", color:"#fff" }}>{p.name ? p.name[0].toUpperCase() : "?"}</div><div><h2 className="text-2xl font-black text-center mb-1">Come ti chiami?</h2><p className="text-sm text-center opacity-40">Per personalizzare l'esperienza</p></div><Inp placeholder="Il tuo nome" value={p.name} onChange={e => setP({ ...p, name: e.target.value })} /></div>);
      case 1: return (<div className="space-y-6"><div className="text-center"><h2 className="text-2xl font-black mb-1">Sesso biologico</h2><p className="text-sm opacity-40">Per il metabolismo basale</p></div><div className="grid grid-cols-2 gap-3">{[{ id:"M", l:"Maschio", e:"♂" }, { id:"F", l:"Femmina", e:"♀" }].map(s => (<button key={s.id} onClick={() => setP({ ...p, sex: s.id })} className="rounded-2xl p-6 text-center transition-all" style={{ background: p.sex === s.id ? "var(--ac)" : "var(--m)", color: p.sex === s.id ? "#fff" : "var(--tx)", border:`2px solid ${p.sex === s.id ? "var(--ac)" : "var(--bd)"}`, transform: p.sex === s.id ? "scale(1.03)" : "scale(1)" }}><div className="text-3xl mb-2">{s.e}</div><div className="font-bold text-sm">{s.l}</div></button>))}</div></div>);
      case 2: return (<div className="space-y-6"><div className="text-center"><h2 className="text-2xl font-black mb-1">Data di nascita</h2><p className="text-sm opacity-40">Per calcoli precisi</p></div><Inp type="date" value={p.birthDate} onChange={e => setP({ ...p, birthDate: e.target.value })} />{p.birthDate && <div className="text-center text-lg font-bold" style={{ color:"var(--ac)" }}>{a} anni</div>}</div>);
      case 3: return (<div className="space-y-6"><div className="text-center"><Ic d={ic.ht} s={48} c="var(--ac)" /><h2 className="text-2xl font-black mb-1 mt-3">Altezza</h2></div><div className="flex items-center justify-center gap-3"><input type="range" min="140" max="210" value={p.height || 170} onChange={e => setP({ ...p, height: parseInt(e.target.value) })} className="flex-1 slider" /><div className="text-3xl font-black min-w-[80px] text-right" style={{ color:"var(--ac)" }}>{p.height || 170}<span className="text-sm opacity-50 ml-1">cm</span></div></div></div>);
      case 4: return (<div className="space-y-6"><div className="text-center"><h2 className="text-2xl font-black mb-1">Peso attuale</h2><p className="text-sm opacity-40">In chilogrammi</p></div><Inp type="number" step="0.1" placeholder="Es: 75.5" value={p.weight || ""} onChange={e => setP({ ...p, weight: parseFloat(e.target.value) || 0 })} />{p.weight > 0 && p.height > 0 && <div className="rounded-2xl p-4" style={{ background:"var(--m)" }}><div className="text-xs opacity-40 mb-2">Il tuo BMI</div><BMIGauge val={myBmi} /></div>}</div>);
      case 5: return (<div className="space-y-6"><div className="text-center"><h2 className="text-2xl font-black mb-1">Il tuo obiettivo?</h2></div><div className="space-y-3">{GO.map(g => (<button key={g.id} onClick={() => setP({ ...p, goal: g.id })} className="w-full rounded-2xl p-4 flex items-center gap-4 transition-all" style={{ background: p.goal === g.id ? "var(--ac)" : "var(--m)", color: p.goal === g.id ? "#fff" : "var(--tx)", border:`2px solid ${p.goal === g.id ? "var(--ac)" : "var(--bd)"}` }}><div className="w-12 h-12 rounded-xl flex items-center justify-center text-2xl font-black" style={{ background: p.goal === g.id ? "rgba(255,255,255,0.2)" : g.color + "22", color: p.goal === g.id ? "#fff" : g.color }}>{g.icon}</div><div className="text-left font-bold">{g.label}</div></button>))}</div>{p.goal && <Inp label="Peso obiettivo (opzionale)" type="number" step="0.1" value={p.targetWeight || ""} onChange={e => setP({ ...p, targetWeight: parseFloat(e.target.value) || null })} />}</div>);
      case 6: return (<div className="space-y-6"><div className="text-center"><Ic d={ic.run} s={40} c="var(--ac)" /><h2 className="text-2xl font-black mb-1 mt-2">Livello attività</h2></div><div className="space-y-2">{AL.map(x => (<button key={x.id} onClick={() => setP({ ...p, activityLevel: x.id })} className="w-full rounded-2xl p-3.5 text-left transition-all" style={{ background: p.activityLevel === x.id ? "var(--ac)" : "var(--m)", color: p.activityLevel === x.id ? "#fff" : "var(--tx)", border:`2px solid ${p.activityLevel === x.id ? "var(--ac)" : "var(--bd)"}` }}><div className="font-bold text-sm">{x.label}</div><div className="text-xs opacity-60">{x.desc}</div></button>))}</div></div>);
      case 7: return (<div className="space-y-6"><div className="text-center"><div className="text-4xl mb-2">🎉</div><h2 className="text-2xl font-black mb-1">Pronto, {p.name}!</h2></div><Inp label="Allergie (opzionale)" placeholder="Es: lattosio, glutine" value={p.allergies} onChange={e => setP({ ...p, allergies: e.target.value })} /><div className="rounded-2xl p-4 space-y-2.5" style={{ background:"var(--m)" }}>{[["Sesso", p.sex === "M" ? "Maschio" : "Femmina"],["Età", a + " anni"],["Altezza", p.height + " cm"],["Peso", p.weight + " kg"]].map(([k, vl]) => (<div key={k} className="flex justify-between text-sm"><span className="opacity-50">{k}</span><span className="font-bold">{vl}</span></div>))}<div className="flex justify-between text-sm"><span className="opacity-50">BMI</span><span className="font-bold" style={{ color: bmiC(myBmi).c }}>{myBmi} · {bmiC(myBmi).l}</span></div><div className="border-t pt-2 mt-2" style={{ borderColor:"var(--bd)" }}><div className="flex justify-between text-sm"><span className="opacity-50">BMR</span><span className="font-bold">{Math.round(b)} kcal</span></div><div className="flex justify-between text-sm mt-1"><span className="opacity-50">TDEE</span><span className="font-bold" style={{ color:"var(--ac)" }}>{tdee} kcal</span></div></div><div className="flex justify-between text-sm"><span className="opacity-50">Obiettivo</span><span className="font-bold">{GO.find(g => g.id === p.goal)?.label}</span></div></div></div>);
      default: return null;
    }
  };

  return (<div className="min-h-screen flex flex-col" style={{ ...TH, background:"var(--bg)", color:"var(--tx)" }}>
    <div className="px-5 pt-6 pb-2"><div className="flex items-center gap-2">{step > 0 && <button onClick={prev} className="p-1 opacity-50"><Ic d={ic.cL} s={20} /></button>}<div className="flex-1 flex gap-1">{Array.from({ length: T }).map((_, i) => (<div key={i} className="flex-1 h-1.5 rounded-full" style={{ background: i <= step ? "var(--ac)" : "var(--bd)" }} />))}</div><span className="text-xs opacity-30 ml-2">{step + 1}/{T}</span></div></div>
    <div className="flex-1 px-5 py-4 overflow-y-auto"><div key={step} style={{ animation: dir > 0 ? "siR .3s ease" : "siL .3s ease" }}>{renderStep()}</div></div>
    <div className="px-5 pb-6 pt-3">{step < T - 1 ? <Btn cls="w-full" onClick={next} disabled={!canN()} style={{ opacity: canN() ? 1 : 0.4 }}>Continua</Btn> : <Btn cls="w-full" v="success" onClick={() => onComplete({ ...p, onboarded: true })}>Iniziamo! 🚀</Btn>}</div>
  </div>);
}

/* ════════════════════════════════════════════════════════════
   MAIN APP
   ════════════════════════════════════════════════════════════ */
function NutriTrack() {
  const [data, setData] = useState(ld);
  const [tab, setTab] = useState("today");
  const [sel, setSel] = useState(td());
  const [modal, setModal] = useState(null);
  const [fs, setFs] = useState({});
  const [impRes, setImpRes] = useState(null);

  useEffect(() => { sv(data); }, [data]);
  const up = useCallback(fn => setData(prev => { const n = { ...prev }; fn(n); return n; }), []);

  const pr = data.profile;
  const myAge = calcAge(pr.birthDate);
  const myBmr = calcBmr(pr.weight, pr.height, myAge, pr.sex);
  const myAf = AL.find(x => x.id === pr.activityLevel);
  const myTdee = Math.round(myBmr * (myAf ? myAf.f : 1.2));
  const latW = data.weightLog.length ? data.weightLog[data.weightLog.length - 1].value : pr.weight;
  const curBmi = calcBmi(latW, pr.height);
  const tM = data.mealPlans[sel] || [];
  const tW = data.water[sel] || 0;
  const tC = data.mealChecks[sel] || {};
  const dow = DN[new Date(sel + "T12:00:00").getDay()];

  if (!pr.onboarded) return <Onboarding onComplete={profile => up(d => { d.profile = profile; d.weightLog.push({ date: td(), value: profile.weight }); })} />;

  const handleFile = async e => { const f = e.target.files?.[0]; if (!f) return; try { let t = await readF(f); if (t.includes("%PDF")) { const r = t.match(/\(([^)]+)\)/g); t = r ? r.map(s => s.slice(1, -1)).join("\n") : ""; } const dm = parseDiet(t); setImpRes(dm.length ? { ok:true, msg:`${dm.length} giorni, ${dm.reduce((s, d) => s + d.length, 0)} pasti`, dm } : { ok:false, msg:"Nessun pasto trovato" }); } catch(err) { setImpRes({ ok:false, msg:err.message }); } };
  const confirmImp = sd => { if (!impRes?.dm) return; const start = new Date(sd + "T12:00:00"); up(d => { impRes.dm.forEach((meals, i) => { const dt = new Date(start); dt.setDate(dt.getDate() + i); const ds = dt.toISOString().split("T")[0]; if (!d.mealPlans[ds]) d.mealPlans[ds] = []; meals.forEach(m => d.mealPlans[ds].push({ id: gid(), ...m })); }); }); setImpRes(null); setModal(null); };

  const renderToday = () => (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <button onClick={() => { const d = new Date(sel + "T12:00:00"); d.setDate(d.getDate() - 1); setSel(d.toISOString().split("T")[0]); }} className="p-2 rounded-full" style={{ background:"var(--m)" }}><Ic d={ic.cL} s={18} /></button>
        <div className="text-center"><div className="text-lg font-bold">{dow}</div><div className="text-[10px] opacity-40">{sel}</div></div>
        <button onClick={() => { const d = new Date(sel + "T12:00:00"); d.setDate(d.getDate() + 1); setSel(d.toISOString().split("T")[0]); }} className="p-2 rounded-full" style={{ background:"var(--m)" }}><Ic d={ic.cR} s={18} /></button>
      </div>
      <div className="grid grid-cols-4 gap-2">
        {[{ v:latW||"—", l:"Peso", c:"var(--ac)" }, { v:curBmi||"—", l:"BMI", c:curBmi?bmiC(curBmi).c:"var(--ac)" }, { v:myTdee, l:"kcal/g", c:"var(--wa)" }, { v:`${tW}/${pr.waterGoal||8}`, l:"Acqua", c:"var(--w)" }].map((s, i) => (
          <div key={i} className="rounded-2xl p-2.5 text-center" style={{ background:"var(--cd)", border:"1px solid var(--bd)" }}><div className="text-base font-black" style={{ color:s.c }}>{s.v}</div><div className="text-[9px] opacity-40 mt-0.5">{s.l}</div></div>
        ))}
      </div>
      <div className="rounded-2xl p-4" style={{ background:"var(--cd)", border:"1px solid var(--bd)" }}>
        <div className="flex items-center justify-between mb-2"><div className="flex items-center gap-2"><Ic d={ic.water} s={16} c="var(--w)" /><span className="font-semibold text-sm">Acqua</span></div><span className="text-xs font-bold" style={{ color:"var(--w)" }}>{tW}/{pr.waterGoal||8}</span></div>
        <div className="flex gap-1.5">{Array.from({ length: pr.waterGoal||8 }).map((_, i) => (<button key={i} onClick={() => up(d => { d.water[sel] = i < tW ? i : i + 1; })} className="flex-1 h-7 rounded-lg" style={{ background: i < tW ? "var(--w)" : "var(--m)", opacity: i < tW ? 1 : 0.3 }} />))}</div>
      </div>
      <div className="rounded-2xl p-4" style={{ background:"var(--cd)", border:"1px solid var(--bd)" }}>
        <div className="flex items-center justify-between mb-3"><span className="font-semibold text-sm">Pasti</span>
          <div className="flex gap-2"><button onClick={() => setModal("import")} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background:"var(--m)" }}><Ic d={ic.up} s={14} /></button><button onClick={() => { setFs({ date:sel, mealType:"Colazione", food:"", alternatives:"" }); setModal("addMeal"); }} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background:"var(--ac)" }}><Ic d={ic.plus} s={14} c="#fff" /></button></div>
        </div>
        {tM.length === 0 ? (<div className="text-center py-6 opacity-40 text-sm"><p className="mb-3">Nessun pasto pianificato</p><Btn v="secondary" onClick={() => setModal("import")}>Carica dieta</Btn></div>) : (
          <div className="space-y-2">{MT.map(type => { const ml = tM.filter(m => m.mealType === type); if (!ml.length) return null; return (<div key={type} className="rounded-xl p-3" style={{ background:"var(--m)" }}><div className="text-[9px] font-black tracking-wider opacity-35 mb-1.5">{type.toUpperCase()}</div>{ml.map(meal => (<div key={meal.id} className="flex items-start gap-2 mb-1"><button onClick={() => up(d => { if (!d.mealChecks[sel]) d.mealChecks[sel] = {}; d.mealChecks[sel][meal.id] = !d.mealChecks[sel]?.[meal.id]; })} className="mt-0.5 w-5 h-5 rounded-md flex items-center justify-center flex-shrink-0" style={{ background: tC[meal.id]?"var(--ac)":"transparent", border:`2px solid ${tC[meal.id]?"var(--ac)":"var(--bd)"}` }}>{tC[meal.id] && <Ic d={ic.chk} s={10} c="#fff" />}</button><div className="flex-1 min-w-0"><div className={`text-sm ${tC[meal.id]?"line-through opacity-35":""}`}>{meal.food}</div>{meal.alternatives && <div className="flex items-center gap-1 mt-0.5"><Ic d={ic.swap} s={10} c="var(--ac)" /><span className="text-[11px] opacity-40 truncate">Alt: {meal.alternatives}</span></div>}</div><button onClick={() => up(d => { d.mealPlans[sel] = d.mealPlans[sel].filter(m => m.id !== meal.id); })} className="opacity-15 hover:opacity-70"><Ic d={ic.del} s={13} /></button></div>))}</div>); })}</div>
        )}
      </div>
    </div>
  );

  const renderPlan = () => { const ws = new Date(sel + "T12:00:00"); ws.setDate(ws.getDate() - ws.getDay() + 1); const wk = Array.from({ length: 7 }).map((_, i) => { const d = new Date(ws); d.setDate(d.getDate() + i); return d.toISOString().split("T")[0]; }); return (<div className="space-y-4"><div className="flex items-center justify-between"><h2 className="font-bold">Piano</h2><Btn onClick={() => setModal("import")}>Carica</Btn></div><div className="flex gap-1.5 overflow-x-auto pb-1">{wk.map((d, i) => { const has = (data.mealPlans[d]||[]).length > 0; return (<button key={d} onClick={() => setSel(d)} className="flex-1 min-w-[42px] rounded-xl py-2 text-center" style={{ background: d === sel?"var(--ac)":"var(--m)", color: d === sel?"#fff":"var(--tx)" }}><div className="text-[9px] font-bold">{SD[(i+1)%7]}</div><div className="text-sm font-bold">{d.slice(8)}</div>{has && <div className="w-1.5 h-1.5 rounded-full mx-auto mt-0.5" style={{ background: d === sel?"#fff":"var(--ac)" }} />}</button>); })}</div>{renderToday()}</div>); };

  const renderShop = () => { const ws = new Date(sel + "T12:00:00"); ws.setDate(ws.getDate() - ws.getDay() + 1); const wk = Array.from({ length: 7 }).map((_, i) => { const d = new Date(ws); d.setDate(d.getDate() + i); return d.toISOString().split("T")[0]; }); const items = []; wk.forEach(d => (data.mealPlans[d]||[]).forEach(m => m.food.split(",").forEach(it => { const t = it.trim().toLowerCase(); if (t && !items.find(a2 => a2.n === t)) items.push({ n:t, id:t }); }))); const ch = data.shoppingChecks||{}; const done = items.filter(i2 => ch[i2.id]).length;
    return (<div className="space-y-4"><h2 className="font-bold">Spesa</h2><div className="text-xs opacity-40">{done}/{items.length} acquistati</div>{items.length > 0 && <div className="h-2 rounded-full overflow-hidden" style={{ background:"var(--m)" }}><div className="h-full rounded-full" style={{ width:`${items.length?(done/items.length)*100:0}%`, background:"var(--ac)" }} /></div>}{items.length === 0 ? <div className="text-center py-10 opacity-30 text-sm">Aggiungi pasti</div> : (<div className="rounded-2xl overflow-hidden" style={{ background:"var(--cd)", border:"1px solid var(--bd)" }}>{items.map((it, i3) => (<div key={it.id} className="flex items-center gap-3 px-4 py-3" style={{ borderBottom: i3 < items.length-1?"1px solid var(--bd)":"none" }}><button onClick={() => up(d => { if (!d.shoppingChecks) d.shoppingChecks={}; d.shoppingChecks[it.id]=!d.shoppingChecks[it.id]; })} className="w-6 h-6 rounded-lg flex items-center justify-center flex-shrink-0" style={{ background: ch[it.id]?"var(--ac)":"transparent", border:`2px solid ${ch[it.id]?"var(--ac)":"var(--bd)"}` }}>{ch[it.id] && <Ic d={ic.chk} s={13} c="#fff" />}</button><span className={`text-sm capitalize ${ch[it.id]?"line-through opacity-25":""}`}>{it.n}</span></div>))}</div>)}</div>); };

  const renderProgress = () => { const bmiH = data.weightLog.map(w2 => ({ date:w2.date, value:parseFloat(calcBmi(w2.value, pr.height)||0) })).filter(b3 => b3.value > 0); return (<div className="space-y-4"><h2 className="font-bold">Progressi</h2>{pr.height && <div className="rounded-2xl p-4" style={{ background:"linear-gradient(135deg,var(--cd),rgba(109,92,252,0.08))", border:"1px solid var(--bd)" }}><div className="text-[10px] font-black tracking-wider opacity-35 mb-3">BMI</div><BMIGauge val={curBmi} /><div className="flex justify-center gap-6 mt-3 text-xs opacity-40"><span>{pr.height}cm</span><span>{latW}kg</span><span>{myTdee}kcal/g</span></div></div>}<div className="rounded-2xl p-4" style={{ background:"var(--cd)", border:"1px solid var(--bd)" }}><div className="flex items-center justify-between mb-2"><span className="font-semibold text-sm">Peso</span><button onClick={() => { setFs({ date:td(), value:"" }); setModal("addW"); }} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background:"var(--ac)" }}><Ic d={ic.plus} s={13} c="#fff" /></button></div><Chrt data={data.weightLog.slice(-10)} color="var(--ac)" unit=" kg" />{data.weightLog.length >= 2 && <div className="text-center mt-2 text-xs font-bold" style={{ color: data.weightLog[data.weightLog.length-1].value <= data.weightLog[0].value?"var(--ok)":"var(--er)" }}>{(data.weightLog[data.weightLog.length-1].value - data.weightLog[0].value) > 0?"+":""}{(data.weightLog[data.weightLog.length-1].value - data.weightLog[0].value).toFixed(1)} kg</div>}</div>{bmiH.length >= 2 && <div className="rounded-2xl p-4" style={{ background:"var(--cd)", border:"1px solid var(--bd)" }}><div className="font-semibold text-sm mb-2">Andamento BMI</div><Chrt data={bmiH.slice(-10)} color="var(--wa)" label="BMI" /></div>}<div className="rounded-2xl p-4" style={{ background:"var(--cd)", border:"1px solid var(--bd)" }}><div className="flex items-center justify-between mb-2"><span className="font-semibold text-sm">Misurazioni</span><button onClick={() => { setFs({ date:td(), ...Object.fromEntries(BP.map(p2 => [p2, ""])) }); setModal("addM"); }} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background:"var(--ac)" }}><Ic d={ic.plus} s={13} c="#fff" /></button></div>{data.measurements.length === 0 ? <div className="text-center py-4 text-sm opacity-30">Nessuna</div> : <div className="grid grid-cols-2 gap-2">{BP.map(part => { const vs = data.measurements.filter(m2 => m2[part]).map(m2 => ({ date:m2.date, value:parseFloat(m2[part]) })); if (!vs.length) return null; return <div key={part} className="rounded-xl p-2" style={{ background:"var(--m)" }}><Chrt data={vs.slice(-5)} w={130} h={70} color="var(--ac)" label={part} unit="cm" /></div>; })}</div>}</div></div>); };

  const renderMore = () => (<div className="space-y-4">
    <div className="rounded-2xl p-4" style={{ background:"linear-gradient(135deg,var(--cd),rgba(109,92,252,0.1))", border:"1px solid var(--bd)" }}><div className="flex items-center gap-3 mb-3"><div className="w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-black" style={{ background:"linear-gradient(135deg,var(--ac),var(--a2))", color:"#fff" }}>{pr.name?.[0]?.toUpperCase()}</div><div><div className="font-bold">{pr.name}</div><div className="text-xs opacity-40">{pr.sex==="M"?"M":"F"} · {myAge}y · {pr.height}cm</div></div></div><div className="grid grid-cols-3 gap-2 text-center"><div className="rounded-xl p-2" style={{ background:"var(--m)" }}><div className="text-sm font-bold" style={{ color:"var(--ac)" }}>{myTdee}</div><div className="text-[9px] opacity-40">kcal/g</div></div><div className="rounded-xl p-2" style={{ background:"var(--m)" }}><div className="text-sm font-bold" style={{ color:"var(--wa)" }}>{Math.round(myBmr)}</div><div className="text-[9px] opacity-40">BMR</div></div><div className="rounded-xl p-2" style={{ background:"var(--m)" }}><div className="text-sm font-bold" style={{ color:curBmi?bmiC(curBmi).c:"var(--ac)" }}>{curBmi||"—"}</div><div className="text-[9px] opacity-40">BMI</div></div></div><button onClick={() => up(d => { d.profile.onboarded = false; })} className="mt-3 text-xs opacity-30 underline w-full text-center">Modifica profilo</button></div>
    <div className="rounded-2xl p-4" style={{ background:"var(--cd)", border:"1px solid var(--bd)" }}><div className="flex items-center justify-between mb-2"><div className="flex items-center gap-2"><Ic d={ic.run} s={16} /><span className="font-semibold text-sm">Attività</span></div><button onClick={() => { setFs({ date:td(), activity:"", duration:"" }); setModal("addA"); }} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background:"var(--ac)" }}><Ic d={ic.plus} s={13} c="#fff" /></button></div>{data.activities.slice(-5).reverse().map(ax => (<div key={ax.id} className="flex justify-between py-1.5 text-sm" style={{ borderBottom:"1px solid var(--bd)" }}><div><b>{ax.activity}</b> <span className="opacity-40">· {ax.duration}m</span></div><span className="text-xs opacity-30">{ax.date}</span></div>))}{!data.activities.length && <div className="text-center py-3 text-sm opacity-30">Nessuna</div>}</div>
    <div className="rounded-2xl p-4" style={{ background:"var(--cd)", border:"1px solid var(--bd)" }}><div className="flex items-center justify-between mb-2"><div className="flex items-center gap-2"><Ic d={ic.edit} s={16} /><span className="font-semibold text-sm">Diario</span></div><button onClick={() => { setFs({ date:sel, note:data.diary[sel]||"" }); setModal("diary"); }} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background:"var(--ac)" }}><Ic d={ic.edit} s={13} c="#fff" /></button></div>{data.diary[sel] ? <p className="text-sm">{data.diary[sel]}</p> : <div className="text-center py-3 text-sm opacity-30">Nessuna nota</div>}</div>
    <div className="rounded-2xl p-4" style={{ background:"var(--cd)", border:"1px solid var(--bd)" }}><div className="text-[9px] font-black tracking-wider opacity-25 mb-3">DATI</div><div className="flex gap-2 flex-wrap"><Btn v="secondary" onClick={() => { const bl = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" }); const anc = document.createElement("a"); anc.href = URL.createObjectURL(bl); anc.download = "nutritrack.json"; anc.click(); }}>Esporta</Btn><Btn v="danger" onClick={() => { if (confirm("Reset?")) setData(defD()); }}>Reset</Btn></div></div>
  </div>);

  const renderModals = () => (<>
    <Mdl open={modal==="import"} onClose={() => { setModal(null); setImpRes(null); }} title="Carica Dieta"><div className="space-y-4"><div className="rounded-xl p-4 text-center border-2 border-dashed" style={{ borderColor:"var(--bd)" }}><Ic d={ic.up} s={32} c="var(--ac)" /><p className="text-sm mt-2 mb-3 opacity-50">.txt / .csv / .pdf</p><input type="file" accept=".txt,.csv,.pdf" onChange={handleFile} className="text-sm w-full" /></div>{impRes && <div className="rounded-xl p-3" style={{ background:impRes.ok?"rgba(34,197,94,0.1)":"rgba(239,68,68,0.1)", border:`1px solid ${impRes.ok?"var(--ok)":"var(--er)"}` }}><div className="text-sm font-bold" style={{ color:impRes.ok?"var(--ok)":"var(--er)" }}>{impRes.ok?"✓ ":"✗ "}{impRes.msg}</div>{impRes.ok && <div className="mt-3"><Inp label="Data inizio" type="date" value={fs.impDate||td()} onChange={e => setFs({...fs, impDate:e.target.value})} /><Btn v="success" cls="w-full" onClick={() => confirmImp(fs.impDate||td())}>Importa</Btn></div>}</div>}<textarea className="w-full rounded-xl px-3 py-2.5 text-sm h-24 resize-none outline-none" style={{ background:"var(--m)", color:"var(--tx)", border:"1px solid var(--bd)" }} placeholder="...o incolla qui" value={fs.mt||""} onChange={e => setFs({...fs, mt:e.target.value})} /><Btn v="secondary" cls="w-full" onClick={() => { if (!fs.mt?.trim()) return; const dm = parseDiet(fs.mt); setImpRes(dm.length?{ok:true,msg:`${dm.length}g, ${dm.reduce((s,d2)=>s+d2.length,0)} pasti`,dm}:{ok:false,msg:"Nessun pasto"}); }}>Analizza</Btn></div></Mdl>
    <Mdl open={modal==="addMeal"} onClose={() => setModal(null)} title="Pasto"><select className="w-full rounded-xl px-3 py-3 text-sm outline-none mb-3" style={{ background:"var(--m)", color:"var(--tx)", border:"1px solid var(--bd)" }} value={fs.mealType||""} onChange={e => setFs({...fs, mealType:e.target.value})}>{MT.map(t2 => <option key={t2}>{t2}</option>)}</select><Inp label="Alimenti" value={fs.food||""} onChange={e => setFs({...fs, food:e.target.value})} placeholder="Yogurt, frutta" /><Inp label="Alternative" value={fs.alternatives||""} onChange={e => setFs({...fs, alternatives:e.target.value})} /><Btn cls="w-full" onClick={() => { if (!fs.food?.trim()) return; up(d => { if (!d.mealPlans[fs.date]) d.mealPlans[fs.date]=[]; d.mealPlans[fs.date].push({id:gid(),mealType:fs.mealType,food:fs.food.trim(),alternatives:fs.alternatives?.trim()||""}); }); setModal(null); }}>Aggiungi</Btn></Mdl>
    <Mdl open={modal==="addW"} onClose={() => setModal(null)} title="Peso"><Inp label="Data" type="date" value={fs.date||""} onChange={e => setFs({...fs, date:e.target.value})} /><Inp label="Peso (kg)" type="number" step="0.1" value={fs.value||""} onChange={e => setFs({...fs, value:e.target.value})} />{fs.value && pr.height && (() => { const preview = calcBmi(parseFloat(fs.value), pr.height); return preview ? <div className="rounded-xl p-3 mb-3 flex items-center gap-3" style={{ background:"var(--m)" }}><span className="text-lg font-black" style={{ color:bmiC(preview).c }}>{preview}</span><span className="text-xs" style={{ color:bmiC(preview).c }}>{bmiC(preview).l}</span></div> : null; })()}<Btn cls="w-full" onClick={() => { if (!fs.value) return; up(d => { d.weightLog.push({date:fs.date,value:parseFloat(fs.value)}); d.weightLog.sort((a2,b2)=>a2.date.localeCompare(b2.date)); }); setModal(null); }}>Salva</Btn></Mdl>
    <Mdl open={modal==="addM"} onClose={() => setModal(null)} title="Misurazioni"><Inp label="Data" type="date" value={fs.date||""} onChange={e => setFs({...fs, date:e.target.value})} />{BP.map(p2 => <Inp key={p2} label={p2+" (cm)"} type="number" step="0.1" value={fs[p2]||""} onChange={e => setFs({...fs, [p2]:e.target.value})} />)}<Btn cls="w-full" onClick={() => { const en={id:gid(),date:fs.date}; BP.forEach(p2 => { if(fs[p2]) en[p2]=fs[p2]; }); up(d => { d.measurements.push(en); d.measurements.sort((a2,b2)=>a2.date.localeCompare(b2.date)); }); setModal(null); }}>Salva</Btn></Mdl>
    <Mdl open={modal==="addA"} onClose={() => setModal(null)} title="Attività"><Inp label="Data" type="date" value={fs.date||""} onChange={e => setFs({...fs, date:e.target.value})} /><Inp label="Attività" value={fs.activity||""} onChange={e => setFs({...fs, activity:e.target.value})} placeholder="Camminata" /><Inp label="Durata (min)" type="number" value={fs.duration||""} onChange={e => setFs({...fs, duration:e.target.value})} /><Btn cls="w-full" onClick={() => { if(!fs.activity) return; up(d => { d.activities.push({id:gid(),date:fs.date,activity:fs.activity,duration:fs.duration||"0"}); }); setModal(null); }}>Salva</Btn></Mdl>
    <Mdl open={modal==="diary"} onClose={() => setModal(null)} title={"Diario · "+(fs.date||"")}><textarea className="w-full rounded-xl px-3 py-3 text-sm h-28 resize-none outline-none" style={{ background:"var(--m)", color:"var(--tx)", border:"1px solid var(--bd)" }} value={fs.note||""} onChange={e => setFs({...fs, note:e.target.value})} placeholder="Come ti senti?" /><Btn cls="w-full mt-3" onClick={() => { up(d => { d.diary[fs.date]=fs.note; }); setModal(null); }}>Salva</Btn></Mdl>
  </>);

  const tabs = [{id:"today",l:"Oggi",i:ic.home},{id:"plan",l:"Piano",i:ic.cal},{id:"shop",l:"Spesa",i:ic.cart},{id:"progress",l:"Progressi",i:ic.chart},{id:"more",l:"Altro",i:ic.user}];

  return (<div className="min-h-screen flex flex-col" style={{ ...TH, background:"var(--bg)", color:"var(--tx)" }}>
    <header className="px-5 pt-5 pb-2"><div className="flex items-center justify-between"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-2xl flex items-center justify-center text-lg font-black" style={{ background:"linear-gradient(135deg,var(--ac),var(--a2))", color:"#fff" }}>{pr.name?.[0]?.toUpperCase()}</div><div><h1 className="text-lg font-black">Ciao, {pr.name}</h1><p className="text-[10px] opacity-30 -mt-0.5">{GO.find(g => g.id===pr.goal)?.label} · {myTdee} kcal/g</p></div></div>{curBmi && <div className="text-right"><div className="text-lg font-black" style={{ color:bmiC(curBmi).c }}>{curBmi}</div><div className="text-[9px] font-bold opacity-50">BMI</div></div>}</div></header>
    <main className="flex-1 px-4 pb-24 overflow-y-auto">
      {tab==="today" && renderToday()}
      {tab==="plan" && renderPlan()}
      {tab==="shop" && renderShop()}
      {tab==="progress" && renderProgress()}
      {tab==="more" && renderMore()}
    </main>
    <nav className="fixed bottom-0 left-0 right-0 flex justify-around py-2 pb-3 z-40" style={{ background:"var(--cd)", borderTop:"1px solid var(--bd)" }}>
      {tabs.map(t2 => (<button key={t2.id} onClick={() => setTab(t2.id)} className="flex flex-col items-center gap-0.5 py-1 px-2" style={{ color:tab===t2.id?"var(--ac)":"var(--tx)", opacity:tab===t2.id?1:0.3 }}><Ic d={t2.i} s={20} c={tab===t2.id?"var(--ac)":"var(--tx)"} /><span className="text-[10px] font-semibold">{t2.l}</span>{tab===t2.id && <div className="w-1 h-1 rounded-full" style={{ background:"var(--ac)" }} />}</button>))}
    </nav>
    {renderModals()}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<NutriTrack />);
  </script>
  <script>
    // Register service worker

      });

  </script>
