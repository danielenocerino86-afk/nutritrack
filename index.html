<script type="text/babel" data-type="module">
const{useState,useEffect,useCallback,useRef}=React;
const gid=()=>Math.random().toString(36).slice(2,10);
const td=()=>new Date().toISOString().split("T")[0];
const DN=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];

const AL=[{id:"sedentary",l:"Sedentario",d:"Poco/nessun esercizio",f:1.2,e:"🪑"},{id:"light",l:"Leggero",d:"1-3 giorni/sett",f:1.375,e:"🚶"},{id:"moderate",l:"Moderato",d:"3-5 giorni/sett",f:1.55,e:"🏃"},{id:"active",l:"Attivo",d:"6-7 giorni/sett",f:1.725,e:"💪"},{id:"veryActive",l:"Molto Attivo",d:"Intenso quotidiano",f:1.9,e:"🔥"}];
const GOL=[{id:"lose",l:"Perdere peso",e:"🍃"},{id:"maintain",l:"Mantenere",e:"⚖️"},{id:"gain",l:"Aumentare massa",e:"💪"}];
const BIA_F=[
  {k:"massaGrassa",l:"Massa Grassa",u:"kg",c:"var(--er)",icon:"🔴"},
  {k:"massaGrassaPct",l:"Massa Grassa %",u:"%",c:"var(--er)"},
  {k:"massaMagra",l:"Massa Magra",u:"kg",c:"var(--ac)",icon:"🟢"},

  {k:"acquaIntra",l:"Acqua Intracellulare",u:"lt",c:"#5a8eae",icon:"💧"},

  {k:"naK",l:"Na/K Scambiabile",u:"",c:"var(--wa)",icon:"⚡"},
  {k:"bmrBia",l:"Metabolismo Basale",u:"kcal",c:"var(--wa)",icon:"🔥"},
  {k:"bmiBia",l:"BMI",u:"",c:"var(--terra)",icon:"📐"},
  {k:"bcmi",l:"BCMI",u:"",c:"var(--sage)",icon:"📐"},
  {k:"angoloFase",l:"Angolo di Fase",u:"°",c:"var(--ac)",icon:"📐"},

  {k:"reattanza",l:"Reattanza",u:"ohm",c:"var(--tx2)",icon:"⚡"},
];
const BIA_SUMMARY=["massaGrassa","massaGrassaPct","massaMagra","massaMuscolare","acquaTotale","angoloFase","bmrBia"];

const SK="nt6";
const defP=()=>({name:"",sex:"",birthDate:"",height:null,weight:null,goal:"",activityLevel:"",targetWeight:null,allergies:"",waterGoal:8,onboarded:false,nutri:{name:"",phone:"",email:"",address:"",nextAppt:"",notes:""}});
const defD=()=>({profile:defP(),dietType:null,dietSchema:null,weeklyPlan:{},mealPlans:{},weightLog:[],measurements:[],biaLog:[],water:{},mealChecks:{},activities:[],diary:{},shoppingChecks:{}});
function loadData(){try{let raw=localStorage.getItem(SK);if(raw)return{...defD(),...JSON.parse(raw)};for(const k of["nt5","nt4","nt3","nt2","nt"]){raw=localStorage.getItem(k);if(raw){const old={...defD(),...JSON.parse(raw)};localStorage.setItem(SK,JSON.stringify(old));return old;}}return defD();}catch(e){return defD();}}
const sv=d=>localStorage.setItem(SK,JSON.stringify(d));
const calcBmi=(w,h)=>{if(!w||!h)return null;return(w/((h/100)**2)).toFixed(1);};
const bmiC=b=>{const v=parseFloat(b);if(v<18.5)return{l:"Sottopeso",c:"var(--water)"};if(v<25)return{l:"Normopeso",c:"var(--ok)"};if(v<30)return{l:"Sovrappeso",c:"var(--wa)"};return{l:"Obesità",c:"var(--er)"};};
const calcBmr=(w,h,a,s)=>{if(!w||!h||!a)return 0;return s==="F"?447.593+9.247*w+3.098*h-4.330*a:88.362+13.397*w+4.799*h-5.677*a;};
const calcAge=bd=>{if(!bd)return 0;const b=new Date(bd),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return a;};

async function pdfText(file){const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let t="";for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();let lastY=null;c.items.forEach(it=>{if(lastY!==null&&Math.abs(it.transform[5]-lastY)>5)t+="\n";t+=it.str;lastY=it.transform[5];});t+="\n\n";}return t;}
const readTxt=f=>new Promise((r,j)=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.onerror=j;fr.readAsText(f);});

function parseSchema(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(l=>l.length>1);
  const mealR=[{r:/prima\s*colazione|^colazione\b/i,t:"Colazione"},{r:/spuntino\s*(di\s+)?(meta|metà)?\s*mattin/i,t:"Spuntino Mattina"},{r:/meta['']?\s*mattin/i,t:"Spuntino Mattina"},{r:/^pranzo\b/i,t:"Pranzo"},{r:/spuntino\s*(di\s+)?(meta|metà)?\s*pomerig/i,t:"Spuntino Pomeriggio"},{r:/meta['']?\s*pomerig/i,t:"Spuntino Pomeriggio"},{r:/^cena\b/i,t:"Cena"}];
  const noteR=[/^condimento/i,/^avvertenz/i,/^raccomandazion/i];
  const subR=[{r:/^primo\b/i,n:"Primo"},{r:/^secondo\b/i,n:"Secondo"},{r:/^contorno\b/i,n:"Contorno"},{r:/^frutta\b/i,n:"Frutta"}];
  const sections=[];let cur=null;let curSub=null;let items=[];let notes=[];let nutri={};
  const flush=()=>{if(cur&&items.length){sections.push({meal:cur,sub:curSub,items:[...items]});}items=[];};
  let inNotes=false;
  lines.forEach(l=>{
    const phoneM=l.match(/(?:cell|tel)[.:\s]*([+\d\s]{8,})/i);if(phoneM)nutri.phone=phoneM[1].replace(/\s+/g,"").trim();
    const emailM=l.match(/(?:email|e-mail|mail)[.:\s]*([^\s,]+@[^\s,]+)/i);if(emailM)nutri.email=emailM[1].trim();
    const docM=l.match(/^(Dott\.?\s*(?:ssa)?)\s+(.{3,})/i);if(docM&&!nutri.name)nutri.name=docM[0].trim();
    if(noteR.some(r=>r.test(l))){flush();cur=null;inNotes=true;notes.push({title:l.split(/\s/)[0],text:""});return;}
    if(inNotes){let clean=l.replace(/^[■▪●•n]\s+/,"").replace(/^[-–]\s*/,"").trim();if(clean.length>2)notes.push({title:"",text:clean});return;}
    const mm=mealR.find(p=>p.r.test(l));if(mm){flush();cur=mm.t;curSub=null;inNotes=false;return;}
    const sm=subR.find(x=>x.r.test(l));if(sm&&cur){flush();curSub=sm.n;const rest=l.replace(sm.r,"").replace(/^[:\s]+/,"").trim();if(rest.length>3)items.push({text:rest,sub:curSub,isAlt:false});return;}
    if(cur){let clean=l.replace(/^[-–•*·▪►■]\s*/,"").replace(/^\d+[.)]\s*/,"").trim();if(clean.length>2)items.push({text:clean,sub:curSub,isAlt:/^oppure\b/i.test(clean)});}
  });flush();
  const meals={};sections.forEach(s=>{if(!meals[s.meal])meals[s.meal]={items:[],subs:{}};s.items.forEach(it=>{if(it.sub){if(!meals[s.meal].subs[it.sub])meals[s.meal].subs[it.sub]=[];meals[s.meal].subs[it.sub].push(it);}else meals[s.meal].items.push(it);});});
  return{meals,notes,nutri};
}
function parseWeekly(text){const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);const dayP=[/^(luned[iì]|marted[iì]|mercoled[iì]|gioved[iì]|venerd[iì]|sabato|domenica)\b/i,/^giorno\s*(\d+)/i];const mealP=[{r:/^colazione/i,t:"Colazione"},{r:/^spuntino\s*(matt|di\s*matt)/i,t:"Spuntino Mattina"},{r:/^pranzo/i,t:"Pranzo"},{r:/^spuntino\s*(pom|di\s*pom)/i,t:"Spuntino Pomeriggio"},{r:/^spuntino/i,t:"Spuntino Mattina"},{r:/^merenda/i,t:"Spuntino Pomeriggio"},{r:/^cena/i,t:"Cena"}];let cur=null;const days=[];let tmp=[];const flush=()=>{if(tmp.length){days.push([...tmp]);tmp=[];}};lines.forEach(l=>{if(dayP.some(p=>p.test(l))){flush();cur=null;return;}const mm=mealP.find(p=>p.r.test(l));if(mm){cur=mm.t;const af=l.replace(mm.r,"").replace(/^[\s:;–\-→]+/,"").trim();if(af.length>2)tmp.push({mealType:cur,food:af});return;}if(cur){const c=l.replace(/^[-–•*·]\s*/,"").replace(/^\d+[.)]\s*/,"").trim();if(c.length>2)tmp.push({mealType:cur,food:c});}});flush();if(!days.length&&tmp.length)days.push(tmp);return days;}

const SKIP_WORDS=["evitando","tollerata","tollerato","limitando","limitare","almeno","massimo","dall'elenco","seguente elenco","piatto dall","tra quella","tra quell","oppure con","senza semi","fatto raffreddare","ingredienti","combinabili","possibile invertire","si intendono","si intende","si consiglia","eliminare il grasso","pietanze vanno","rendere le pietanze","moderazione","categoricamente","interpretare","considerare","volte a settimana","volta a settimana","volte alla settimana","preparate al forno","bollite","al vapore","grigliate","crudi e al netto","netto degli scarti","grasso visibile","succo di limone","uso di","far uso","parsimonia","pizzichi","acqua da bere","evitare alcolici","evitare categoricamente","corso della giornata","secondo piatto","puntini come somma","trattini come alternativa","piatti unici","alimenti come","pesi si intendono","verdura si intende","frutta limitare","aggiungere sale","non più di","dolcificante","caffè o thè","caffè o the","con moderazione","insaccati","alimenti sospettabili","cell:","email:","dott","medico","specialista"];
function extractShopItems(data){const items=new Map();const addItem=(text)=>{let t=text.toLowerCase().replace(/\([^)]*\)/g,"").replace(/\d+\s*(g|ml|kg|l|cm)\b/gi,"").replace(/n[.°]?\s*\d+/gi,"").replace(/max\s*\d+[-–]?\d*/gi,"").trim();t.split(/[+]/).forEach(part=>{let p=part.replace(/^[-–•*·]\s*/,"").trim();if(p.length<3)return;if(SKIP_WORDS.some(sw=>p.includes(sw)))return;if(p.startsWith("oppure")||p.startsWith("o "))return;p=p.replace(/\d+\s*(cucchiai?n?[io]?|fett[ae]|vasett[io]|pacchett[io]|porzion[ei])\s*(di\s+)?/gi,"").trim();p=p.replace(/^\s*(di|del|della|dello|dei|degli|delle)\s+/i,"").trim();if(p.length<3)return;if(!items.has(p))items.set(p,true);});};if(data.dietSchema?.meals){Object.values(data.dietSchema.meals).forEach(meal=>{meal.items.forEach(it=>addItem(it.text));Object.values(meal.subs).forEach(sub=>sub.forEach(it=>addItem(it.text)));});}Object.values(data.mealPlans).forEach(meals=>meals.forEach(m=>addItem(m.food)));return[...items.keys()].map(n=>({n,id:n}));}
function exportXls(data){const wb=XLSX.utils.book_new();const p=data.profile;if(data.weightLog.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.weightLog.map(w=>({Data:w.date,"Peso (kg)":w.value,BMI:p.height?calcBmi(w.value,p.height):""}))),"Peso");if(data.measurements.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.measurements.map(m=>{const r={Data:m.date};BP.forEach(b=>{if(m[b])r[b+" (cm)"]=parseFloat(m[b]);});return r;})),"Misurazioni");if((data.biaLog||[]).length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet((data.biaLog||[]).map(b=>{const r={Data:b.date};BIA_F.forEach(f=>{if(b[f.k])r[f.l+(f.u?" ("+f.u+")":"")]=parseFloat(b[f.k]);});return r;})),"BIA");const allM=[];Object.entries(data.mealPlans).forEach(([d,ms])=>ms.forEach(m=>allM.push({Data:d,Pasto:m.mealType,Alimenti:m.food})));if(allM.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(allM),"Pasti");const wE=Object.entries(data.water).map(([d,v])=>({Data:d,Bicchieri:v}));if(wE.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(wE),"Acqua");if(data.activities.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.activities.map(a=>({Data:a.date,"Attività":a.activity,"Durata (min)":parseInt(a.duration)||0}))),"Attività");if(data.dietSchema){const rows=[];Object.entries(data.dietSchema.meals).forEach(([meal,d])=>{rows.push({Pasto:meal});d.items.forEach(it=>rows.push({Pasto:"",Alimento:it.text}));Object.entries(d.subs).forEach(([sub,its])=>{rows.push({Pasto:"",Categoria:sub});its.forEach(it=>rows.push({Pasto:"",Alimento:it.text}));});});if(rows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Schema Dieta");}const prof=[{C:"Nome",V:p.name},{C:"Sesso",V:p.sex},{C:"Nascita",V:p.birthDate},{C:"Altezza",V:p.height+"cm"},{C:"Peso",V:p.weight+"kg"}];XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(prof),"Profilo");XLSX.writeFile(wb,"NutriTrack_Export.xlsx");}

function Btn({children,v="primary",cls="",...p}){const s={primary:{background:"var(--ac)",color:"#fff"},secondary:{background:"var(--m)",color:"var(--tx)"},danger:{background:"var(--er)",color:"#fff"},success:{background:"var(--sage)",color:"#fff"}};return<button className={`px-5 py-3 rounded-2xl font-extrabold transition-all active:scale-95 ${cls}`} style={{...s[v],fontSize:"15px"}} {...p}>{children}</button>;}
function Mdl({open,onClose,title,children}){if(!open)return null;return(<div className="fixed inset-0 z-50 flex items-end justify-center" style={{background:"rgba(0,0,0,.35)",backdropFilter:"blur(6px)"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}><div className="rounded-t-3xl w-full max-h-[85vh] overflow-y-auto shadow-xl" style={{background:"var(--cd)",animation:"fadeUp .3s ease"}}><div className="flex items-center justify-between p-5 border-b sticky top-0 z-10" style={{borderColor:"var(--bd)",background:"var(--cd)"}}><h3 className="font-extrabold text-lg">{title}</h3><button onClick={onClose} className="w-9 h-9 rounded-full flex items-center justify-center" style={{background:"var(--m)"}}>✕</button></div><div className="p-5">{children}</div></div></div>);}
function Chrt({data,w=300,h=130,color="var(--ac)",label,unit=""}){if(!data.length)return<div className="text-center opacity-40 py-6 font-semibold">Nessun dato</div>;const vals=data.map(d=>d.value),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1,pd=28;const pts=data.map((d,i)=>({x:pd+(i/Math.max(data.length-1,1))*(w-2*pd),y:h-pd-((d.value-mn)/rng)*(h-2*pd-10),...d}));const line=pts.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ");const area=line+` L${pts[pts.length-1].x},${h-pd} L${pts[0].x},${h-pd} Z`;const gi="g"+(label||"x").replace(/\W/g,"");return(<div className="flex flex-col items-center">{label&&<div className="text-sm font-bold mb-1" style={{color:"var(--tx2)"}}>{label}</div>}<svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}><defs><linearGradient id={gi} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity=".2"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs><path d={area} fill={`url(#${gi})`}/><path d={line} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>{pts.map((p,i)=>(<g key={i}><circle cx={p.x} cy={p.y} r="5" fill={color} stroke="var(--cd)" strokeWidth="2"/><text x={p.x} y={p.y-14} textAnchor="middle" fontSize="11" fill={color} fontWeight="800">{p.value}{unit}</text><text x={p.x} y={h-6} textAnchor="middle" fontSize="9" fill="var(--tx2)" fontWeight="600">{p.date?p.date.slice(5):""}</text></g>))}</svg></div>);}
function BMIGauge({val}){if(!val)return null;const v=parseFloat(val),cat=bmiC(val),pct=Math.min(100,Math.max(0,((v-15)/25)*100));return(<div className="flex flex-col items-center gap-2"><div className="text-3xl font-black" style={{color:cat.c}}>{val}</div><div className="text-sm font-extrabold" style={{color:cat.c}}>{cat.l}</div><div className="w-full h-3 rounded-full overflow-hidden flex" style={{background:"var(--m)"}}><div style={{width:"18.5%",background:"var(--water)"}} className="h-full"/><div style={{width:"26%",background:"var(--ok)"}} className="h-full"/><div style={{width:"20%",background:"var(--wa)"}} className="h-full"/><div style={{flex:1,background:"var(--er)"}} className="h-full"/></div><div className="w-full relative h-4"><div className="absolute w-4 h-4 rounded-full border-2 shadow" style={{left:`${pct}%`,top:"-10px",transform:"translateX(-50%)",background:cat.c,borderColor:"#fff"}}/></div><div className="flex justify-between w-full text-[10px] font-bold" style={{color:"var(--tx2)"}}><span>Sotto</span><span>Normo</span><span>Sovra</span><span>Obesità</span></div></div>);}

/* ══ FORM MODAL: useRef for form data = zero re-renders while typing = keyboard stays open ══ */
function FormModal({open,onClose,title,fields,onSave,initData}){
  const formRef=useRef({});
  const mountedRef=useRef(false);
  const[,forceUpdate]=useState(0);
  useEffect(()=>{
    if(open&&initData){formRef.current={...initData};mountedRef.current=true;forceUpdate(n=>n+1);}
    if(!open)mountedRef.current=false;
  },[open]);
  if(!open||!mountedRef.current)return null;
  const handleChange=(key,val)=>{formRef.current[key]=val;};
  return(<Mdl open={open} onClose={onClose} title={title}><div className="space-y-0">{fields.map(fld=>{
    if(fld.type==="section")return<div key={fld.label} className="text-xs font-black tracking-wider py-2" style={{color:"var(--tx2)"}}>{fld.label}</div>;
    if(fld.type==="select")return(<label key={fld.key} className="block mb-3"><span className="text-sm font-bold mb-1 block" style={{color:"var(--tx2)"}}>{fld.label}</span><select className="w-full rounded-2xl px-4 py-3 outline-none" style={{background:"var(--m)",border:"2px solid var(--bd)",fontSize:"16px"}} defaultValue={formRef.current[fld.key]||""} onChange={e=>handleChange(fld.key,e.target.value)}>{fld.options.map(o=><option key={o} value={o}>{o}</option>)}</select></label>);
    if(fld.type==="textarea")return(<label key={fld.key} className="block mb-3"><span className="text-sm font-bold mb-1 block" style={{color:"var(--tx2)"}}>{fld.label}</span><textarea className="w-full rounded-xl px-4 py-3 h-20 resize-none outline-none" style={{background:"var(--m)",border:"2px solid var(--bd)",fontSize:"16px"}} defaultValue={formRef.current[fld.key]||""} onChange={e=>handleChange(fld.key,e.target.value)}/></label>);
    const iType=fld.inputType||"text";
    return(<label key={fld.key} className="block mb-3"><span className="text-sm font-bold mb-1 block" style={{color:"var(--tx2)"}}>{fld.label}</span><input className="w-full rounded-2xl px-4 py-3 outline-none" style={{background:"var(--m)",color:"var(--tx)",border:"2px solid var(--bd)",fontSize:"16px"}} type={iType} step={iType==="number"?"0.1":undefined} defaultValue={formRef.current[fld.key]??""} onChange={e=>handleChange(fld.key,e.target.value)}/></label>);
  })}<Btn cls="w-full mt-2" v="success" onClick={()=>{onSave({...formRef.current});onClose();}}>💾 Salva</Btn></div></Mdl>);
}

/* ════ ONBOARDING ════ */
function Onboarding({onComplete}){
  const[step,setStep]=useState(0);const[p,setP]=useState(defP());const[dir,setDir]=useState(1);const T=8;
  const next=()=>{setDir(1);setStep(s=>Math.min(s+1,T-1));};const prev=()=>{setDir(-1);setStep(s=>Math.max(s-1,0));};
  const canN=()=>{if(step===0)return p.name.trim().length>0;if(step===1)return!!p.sex;if(step===2)return!!p.birthDate;if(step===3)return p.height>0;if(step===4)return p.weight>0;if(step===5)return!!p.goal;if(step===6)return!!p.activityLevel;return true;};
  const a=calcAge(p.birthDate),b=calcBmr(p.weight,p.height,a,p.sex),af=AL.find(x=>x.id===p.activityLevel),tdee=Math.round(b*(af?af.f:1.2)),myBmi=calcBmi(p.weight,p.height);
  const inp=(label,key,type="text",extra={})=>(<label className="block mb-4"><span className="text-sm font-bold mb-1 block" style={{color:"var(--tx2)"}}>{label}</span><input className="w-full rounded-2xl px-4 py-3 outline-none" style={{background:"var(--m)",color:"var(--tx)",border:"2px solid var(--bd)",fontSize:"16px"}} type={type} step={type==="number"?"0.1":undefined} value={p[key]??""} onChange={e=>setP({...p,[key]:type==="number"?parseFloat(e.target.value)||0:e.target.value})} {...extra}/></label>);
  const R=()=>{switch(step){
    case 0:return(<div className="space-y-5"><div className="text-6xl text-center" style={{animation:"pulse 2s infinite"}}>🌿</div><h2 className="text-2xl font-black text-center">Come ti chiami?</h2><p className="text-center font-semibold" style={{color:"var(--tx2)"}}>Iniziamo il tuo percorso</p>{inp("","name")}</div>);
    case 1:return(<div className="space-y-5"><h2 className="text-2xl font-black text-center">Sesso biologico</h2><div className="grid grid-cols-2 gap-4">{[{id:"M",l:"Maschio",e:"🙋‍♂️"},{id:"F",l:"Femmina",e:"🙋‍♀️"}].map(s=>(<button key={s.id} onClick={()=>setP({...p,sex:s.id})} className="rounded-2xl p-5 text-center shadow-sm" style={{background:p.sex===s.id?"var(--ac)":"var(--cd)",color:p.sex===s.id?"#fff":"var(--tx)",border:`2px solid ${p.sex===s.id?"var(--ac)":"var(--bd)"}`}}><div className="text-4xl mb-2">{s.e}</div><div className="font-extrabold">{s.l}</div></button>))}</div></div>);
    case 2:return(<div className="space-y-5"><div className="text-5xl text-center">🎂</div><h2 className="text-2xl font-black text-center">Data di nascita</h2>{inp("","birthDate","date")}{p.birthDate&&<div className="text-center text-xl font-black" style={{color:"var(--ac)"}}>{a} anni</div>}</div>);
    case 3:return(<div className="space-y-5"><div className="text-5xl text-center">📏</div><h2 className="text-2xl font-black text-center">Altezza</h2><div className="text-center text-4xl font-black" style={{color:"var(--ac)"}}>{p.height||170} <span className="text-base" style={{color:"var(--tx2)"}}>cm</span></div><input type="range" min="140" max="210" value={p.height||170} onChange={e=>setP({...p,height:parseInt(e.target.value)})}/></div>);
    case 4:return(<div className="space-y-5"><div className="text-5xl text-center">⚖️</div><h2 className="text-2xl font-black text-center">Peso attuale</h2>{inp("","weight","number",{placeholder:"75.5 kg"})}{p.weight>0&&p.height>0&&<div className="card"><BMIGauge val={myBmi}/></div>}</div>);
    case 5:return(<div className="space-y-5"><h2 className="text-2xl font-black text-center">Obiettivo</h2><div className="space-y-3">{GOL.map(g=>(<button key={g.id} onClick={()=>setP({...p,goal:g.id})} className="w-full rounded-2xl p-4 flex items-center gap-4 shadow-sm" style={{background:p.goal===g.id?"var(--ac)":"var(--cd)",color:p.goal===g.id?"#fff":"var(--tx)",border:`2px solid ${p.goal===g.id?"var(--ac)":"var(--bd)"}`}}><span className="text-3xl">{g.e}</span><span className="font-extrabold">{g.l}</span></button>))}</div></div>);
    case 6:return(<div className="space-y-3"><h2 className="text-2xl font-black text-center">Attività</h2>{AL.map(x=>(<button key={x.id} onClick={()=>setP({...p,activityLevel:x.id})} className="w-full rounded-2xl p-3 text-left flex items-center gap-3 shadow-sm" style={{background:p.activityLevel===x.id?"var(--ac)":"var(--cd)",color:p.activityLevel===x.id?"#fff":"var(--tx)",border:`2px solid ${p.activityLevel===x.id?"var(--ac)":"var(--bd)"}`}}><span className="text-xl">{x.e}</span><div><div className="font-extrabold">{x.l}</div><div className="text-xs opacity-60">{x.d}</div></div></button>))}</div>);
    case 7:return(<div className="space-y-4"><div className="text-4xl text-center">🎉</div><h2 className="text-xl font-black text-center">Pronto, {p.name}!</h2>{inp("Allergie (opzionale)","allergies")}<div className="card space-y-1 text-sm">{[["BMI",myBmi+" "+bmiC(myBmi).l],["BMR",Math.round(b)+" kcal"],["TDEE",tdee+" kcal"]].map(([k,v])=>(<div key={k} className="flex justify-between"><span style={{color:"var(--tx2)"}}>{k}</span><b style={{color:"var(--ac)"}}>{v}</b></div>))}</div></div>);
    default:return null;}};
  return(<div className="flex flex-col h-full" style={{background:"var(--bg)"}}><div className="flex-shrink-0 px-5 pt-4 pb-2"><div className="flex items-center gap-2">{step>0&&<button onClick={prev} className="p-1 opacity-40"><Ic d={ic.cL} s={20}/></button>}<div className="flex-1 flex gap-1.5">{Array.from({length:T}).map((_,i)=>(<div key={i} className="flex-1 h-2 rounded-full" style={{background:i<=step?"var(--ac)":"var(--bd)"}}/>))}</div><span className="text-xs font-bold ml-2" style={{color:"var(--tx2)"}}>{step+1}/{T}</span></div></div><div className="flex-1 overflow-y-auto px-5 py-3"><div key={step} style={{animation:dir>0?"siR .3s":"siL .3s"}}>{R()}</div></div><div className="flex-shrink-0 px-5 pb-5 pt-2">{step<T-1?<Btn cls="w-full" onClick={next} disabled={!canN()} style={{opacity:canN()?1:.35}}>Continua →</Btn>:<Btn cls="w-full" v="success" onClick={()=>onComplete({...p,onboarded:true})}>Iniziamo! 🌿</Btn>}</div></div>);}

/* ════ MAIN APP ════ */
function App(){
  const[data,setData]=useState(loadData);const[tab,setTab]=useState("today");const[sel,setSel]=useState(td());const[modal,setModal]=useState(null);const[modalInit,setModalInit]=useState({});const[impRes,setImpRes]=useState(null);const[loading,setLoading]=useState(false);const[toast,setToast]=useState(null);
  useEffect(()=>{sv(data);},[data]);
  const up=useCallback(fn=>setData(prev=>{const n={...prev};fn(n);return n;}),[]);
  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(null),2000);};
  const openM=(name,init={})=>{setModalInit(init);setModal(name);};
  const pr=data.profile,myAge=calcAge(pr.birthDate),myBmr=calcBmr(pr.weight,pr.height,myAge,pr.sex),myAf=AL.find(x=>x.id===pr.activityLevel),myTdee=Math.round(myBmr*(myAf?myAf.f:1.2));
  const latW=data.weightLog.length?data.weightLog[data.weightLog.length-1].value:pr.weight,curBmi=calcBmi(latW,pr.height);
  const tM=data.mealPlans[sel]||[],tW=data.water[sel]||0,tC=data.mealChecks[sel]||{},dow=DN[new Date(sel+"T12:00:00").getDay()];
  if(!pr.onboarded)return<Onboarding onComplete={profile=>up(d=>{d.profile=profile;d.weightLog.push({date:td(),value:profile.weight});})}/>;
  const handleFile=async e=>{const f=e.target.files?.[0];if(!f)return;setLoading(true);setImpRes(null);try{let t="";if(f.type==="application/pdf"||f.name.endsWith(".pdf"))t=await pdfText(f);else t=await readTxt(f);if(!t.trim()){setImpRes({ok:false,msg:"Nessun testo"});setLoading(false);return;}setImpRes({ok:true,msg:"OK",raw:t});}catch(err){setImpRes({ok:false,msg:"Errore: "+err.message});}setLoading(false);};

  /* ── Add from schema with toast ── */
  const addFromSchema=(meal,text)=>{up(d=>{if(!d.mealPlans[sel])d.mealPlans[sel]=[];d.mealPlans[sel].push({id:gid(),mealType:meal,food:text});});showToast("✓ Aggiunto a "+meal);};

  /* ── TODAY ── */
  const renderToday=()=>(<div className="space-y-4">
    <div className="flex items-center justify-between"><button onClick={()=>{const d=new Date(sel+"T12:00:00");d.setDate(d.getDate()-1);setSel(d.toISOString().split("T")[0]);}} className="p-2 rounded-xl" style={{background:"var(--cd)"}}><Ic d={ic.cL} s={18}/></button><div className="text-center"><div className="text-lg font-extrabold">{dow}</div><div className="text-xs font-semibold" style={{color:"var(--tx2)"}}>{sel}</div></div><button onClick={()=>{const d=new Date(sel+"T12:00:00");d.setDate(d.getDate()+1);setSel(d.toISOString().split("T")[0]);}} className="p-2 rounded-xl" style={{background:"var(--cd)"}}><Ic d={ic.cR} s={18}/></button></div>
    <div className="grid grid-cols-4 gap-2">{[{v:latW||"—",l:"Peso",c:"var(--terra)"},{v:curBmi||"—",l:"BMI",c:curBmi?bmiC(curBmi).c:"var(--ac)"},{v:myTdee,l:"kcal",c:"var(--wa)"},{v:`${tW}/${pr.waterGoal||8}`,l:"Acqua",c:"var(--water)"}].map((s,i)=>(<div key={i} className="card text-center p-2"><div className="text-lg font-black" style={{color:s.c}}>{s.v}</div><div className="text-[10px] font-bold" style={{color:"var(--tx2)"}}>{s.l}</div></div>))}</div>
    <div className="card"><div className="flex items-center justify-between mb-2"><span className="font-extrabold">💧 Acqua</span><span className="font-black" style={{color:"var(--water)"}}>{tW}/{pr.waterGoal||8}</span></div><div className="flex gap-2">{Array.from({length:pr.waterGoal||8}).map((_,i)=>(<button key={i} onClick={()=>up(d=>{d.water[sel]=i<tW?i:i+1;})} className="flex-1 h-8 rounded-xl" style={{background:i<tW?"var(--water)":"var(--m)",opacity:i<tW?1:.3}}/>))}</div></div>
    <div className="card"><div className="flex items-center justify-between mb-3"><span className="font-extrabold">🍽️ Pasti di oggi</span><div className="flex gap-2">{data.dietSchema&&<button onClick={()=>setTab("schema")} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:"var(--m)"}}><Ic d={ic.list} s={16}/></button>}<button onClick={()=>openM("addMeal",{date:sel,mealType:"Colazione",food:""})} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.plus} s={16} c="#fff"/></button></div></div>
    {tM.length===0?(<div className="text-center py-4 opacity-40"><p className="font-semibold mb-2">{data.dietSchema?"Vai allo Schema per scegliere":"Carica la dieta"}</p><Btn v="secondary" onClick={()=>data.dietSchema?setTab("schema"):openM("import")}>{data.dietSchema?"📋 Schema":"📄 Carica"}</Btn></div>):(<div className="space-y-2">{MT.map((type,ti)=>{const ml=tM.filter(m=>m.mealType===type);if(!ml.length)return null;return(<div key={type} className="rounded-xl p-3" style={{background:"var(--m)"}}><div className="text-[10px] font-black tracking-wider mb-1.5 flex items-center gap-1" style={{color:"var(--tx2)"}}><span>{ME[ti]}</span>{type.toUpperCase()}</div>{ml.map(meal=>(<div key={meal.id} className="flex items-start gap-2 mb-1"><button onClick={()=>up(d=>{if(!d.mealChecks[sel])d.mealChecks[sel]={};d.mealChecks[sel][meal.id]=!d.mealChecks[sel]?.[meal.id];})} className="mt-0.5 w-5 h-5 rounded-md flex items-center justify-center flex-shrink-0" style={{background:tC[meal.id]?"var(--ac)":"transparent",border:`2px solid ${tC[meal.id]?"var(--ac)":"var(--bd)"}`}}>{tC[meal.id]&&<Ic d={ic.chk} s={10} c="#fff"/>}</button><span className={`font-semibold text-sm flex-1 ${tC[meal.id]?"line-through opacity-30":""}`}>{meal.food}</span><button onClick={()=>up(d=>{d.mealPlans[sel]=d.mealPlans[sel].filter(m=>m.id!==meal.id);})} className="opacity-15 flex-shrink-0"><Ic d={ic.del} s={13}/></button></div>))}</div>);})}</div>)}</div>
  </div>);

  /* ── SCHEMA ── */
  const renderSchema=()=>(<div className="space-y-4">
    <div className="flex items-center justify-between"><h2 className="font-extrabold text-lg">📋 {data.dietType==="weekly"?"Piano Settimanale":"Schema Dieta"}</h2><button onClick={()=>openM("import")} className="px-3 py-1.5 rounded-xl text-xs font-bold" style={{background:"var(--m)"}}>Sostituisci</button></div>
    {!data.dietSchema?(<div className="text-center py-10"><div className="text-5xl mb-4">📄</div><p className="font-semibold opacity-40 mb-4">Nessuna dieta caricata</p><Btn onClick={()=>openM("import")}>Carica dieta</Btn></div>
    ):data.dietType==="free"&&data.dietSchema?(<div className="space-y-3">
      <div className="rounded-xl p-3" style={{background:"rgba(107,158,74,.08)",border:"1px solid rgba(107,158,74,.2)"}}><p className="text-sm font-semibold" style={{color:"var(--ac)"}}>👆 Tocca un alimento per aggiungerlo a oggi ({dow})</p></div>
      {MT.filter(meal=>data.dietSchema.meals[meal]).map((meal,mi)=>{const d=data.dietSchema.meals[meal];if(!d)return null;
        const FoodBtn=({it})=>{const[added,setAdded]=useState(false);return(<button onClick={()=>{addFromSchema(meal,it.text);setAdded(true);setTimeout(()=>setAdded(false),1500);}} className="w-full text-left text-sm py-2 px-3 rounded-xl transition-all flex items-start gap-2 active:scale-[0.97]" style={{background:added?"rgba(107,158,74,.25)":it.isAlt?"rgba(196,154,60,.08)":"rgba(107,158,74,.06)",border:`1px solid ${added?"var(--ac)":it.isAlt?"rgba(196,154,60,.2)":"rgba(107,158,74,.15)"}`,transition:"all .3s"}}>{added?<span className="text-xs mt-0.5 flex-shrink-0 font-black" style={{color:"var(--ac)"}}>✓</span>:it.isAlt?<span className="text-xs mt-0.5 flex-shrink-0" style={{color:"var(--wa)"}}>↕</span>:<span className="text-xs mt-0.5 flex-shrink-0" style={{color:"var(--ac)"}}>+</span>}<span className={`font-semibold ${added?"font-black":""}`} style={added?{color:"var(--ac)"}:{}}>{added?"Aggiunto! ✓":it.text}</span></button>);};
        return(<div key={meal} className="card"><div className="font-extrabold mb-3 flex items-center gap-2 text-base"><span className="text-lg">{ME[mi]}</span>{meal}</div>{d.items.length>0&&<div className="space-y-1.5 mb-2">{d.items.map((it,ii)=><FoodBtn key={ii} it={it}/>)}</div>}{Object.entries(d.subs).map(([sub,its])=>(<div key={sub} className="mt-3"><div className="text-xs font-black tracking-wider mb-1.5 pb-1 border-b" style={{color:"var(--tx2)",borderColor:"var(--bd)"}}>{sub.toUpperCase()}</div><div className="space-y-1.5">{its.map((it,ii)=><FoodBtn key={ii} it={it}/>)}</div></div>))}</div>);
      })}
      {data.dietSchema.notes?.length>0&&<div className="card"><div className="font-extrabold mb-3">📌 Note del nutrizionista</div><div className="space-y-2">{data.dietSchema.notes.map((n,i)=>(n.title?<div key={i} className="font-black text-sm mt-2 pb-1 border-b" style={{color:"var(--ac)",borderColor:"var(--bd)"}}>{n.title.toUpperCase()}</div>:<div key={i} className="text-sm py-1 pl-3 font-semibold" style={{borderLeft:"2px solid var(--bd)",color:"var(--tx2)"}}>{n.text}</div>))}</div></div>}
    </div>):null}
  </div>);

  /* ── SHOP ── */

        {data.measurements.length===0?<div className="text-center py-3 opacity-30 font-semibold">—</div>:<><div className="grid grid-cols-2 gap-2">{BP.map(part=>{const vs=data.measurements.filter(m=>m[part]).map(m=>({date:m.date,value:parseFloat(m[part])}));if(!vs.length)return null;return<div key={part} className="rounded-xl p-2" style={{background:"var(--m)"}}><Chrt data={vs.slice(-5)} w={140} h={80} color="var(--sage)" label={part} unit="cm"/></div>;})}</div>
          <div className="mt-3 space-y-1">{data.measurements.slice().reverse().slice(0,5).map((m,i)=>{const idx=data.measurements.length-1-i;return(<div key={m.id||idx} className="flex items-center justify-between py-1.5 px-2 rounded-lg text-sm" style={{background:i%2===0?"var(--m)":"transparent"}}><span style={{color:"var(--tx2)"}}>{m.date}</span><span className="text-xs font-bold truncate flex-1 mx-2" style={{color:"var(--tx2)"}}>{BP.filter(p=>m[p]).map(p=>p[0]+":"+m[p]).join(" ")}</span><div className="flex gap-1 flex-shrink-0"><button onClick={()=>openM("editM",{midx:idx,date:m.date,...Object.fromEntries(BP.map(p=>[p,m[p]||""]))})} className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:"var(--bd)"}}><Ic d={ic.edit} s={11}/></button><button onClick={()=>{if(confirm("Eliminare?"))up(d=>{d.measurements.splice(idx,1);});}} className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:"var(--bd)"}}><Ic d={ic.del} s={11}/></button></div></div>);})}</div></>}

        {(data.biaLog||[]).length===0?<div className="text-center py-4 opacity-30"><p className="font-semibold mb-1">Nessun esame BIA</p><p className="text-xs" style={{color:"var(--tx2)"}}>Aggiungi i dati della tua BIA AKERN</p></div>:(()=>{

          return(<div className="space-y-3">
            <div className="text-xs font-bold" style={{color:"var(--tx2)"}}>Ultimo esame: {last.date}</div>
            <div className="grid grid-cols-2 gap-2">{BIA_SUMMARY.map(k=>{const f=BIA_F.find(x=>x.k===k);if(!f||!last[k])return null;const delta=prev2&&prev2[k]?(parseFloat(last[k])-parseFloat(prev2[k])).toFixed(1):null;const isGrassa=k.includes("Grassa")||k.includes("grassaPct");return(<div key={k} className="rounded-xl p-2.5" style={{background:"var(--m)"}}><div className="flex items-center gap-1 mb-0.5"><span className="text-[10px] font-bold" style={{color:"var(--tx2)"}}>{f.icon||""} {f.l}</span></div><div className="flex items-baseline gap-1"><span className="text-lg font-black" style={{color:f.c}}>{last[k]}</span><span className="text-[10px] font-bold" style={{color:"var(--tx2)"}}>{f.u}</span>{delta&&delta!=="0.0"&&<span className="text-[10px] font-black ml-auto" style={{color:parseFloat(delta)>0?(isGrassa?"var(--er)":"var(--ok)"):(isGrassa?"var(--ok)":"var(--er)")}}>{parseFloat(delta)>0?"+":""}{delta}</span>}</div></div>);})}</div>

            <div className="space-y-1">{bl.slice().reverse().slice(0,5).map((b,i)=>{const idx=bl.length-1-i;return(<div key={idx} className="flex items-center justify-between py-1.5 px-2 rounded-lg text-sm" style={{background:i%2===0?"var(--m)":"transparent"}}><span style={{color:"var(--tx2)"}}>{b.date}</span><span className="text-xs font-bold truncate flex-1 mx-2" style={{color:"var(--tx2)"}}>MG:{b.massaGrassa||"—"} MM:{b.massaMagra||"—"} AF:{b.angoloFase||"—"}°</span><div className="flex gap-1 flex-shrink-0"><button onClick={()=>openM("editBia",{biaIdx:idx,biaDate:b.date,...Object.fromEntries(BIA_F.map(f=>[f.k,b[f.k]||""]))})} className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:"var(--bd)"}}><Ic d={ic.edit} s={11}/></button><button onClick={()=>{if(confirm("Eliminare?"))up(d=>{(d.biaLog||[]).splice(idx,1);});}} className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:"var(--bd)"}}><Ic d={ic.del} s={11}/></button></div></div>);})}</div>
          </div>);

  const renderMore=()=>(<div className="space-y-4">

    <div className="card"><div className="flex items-center justify-between mb-2"><span className="font-extrabold">🩺 Nutrizionista</span><button onClick={()=>{const n=pr.nutri||{};openM("editNutri",{nN:n.name||"",nP:n.phone||"",nE:n.email||"",nA:n.address||"",nD:n.nextAppt||"",nO:n.notes||""});}} className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.edit} s={14} c="#fff"/></button></div>
      {pr.nutri?.name?(<div className="space-y-2"><div className="font-extrabold">{pr.nutri.name}</div>{pr.nutri.phone&&<div className="flex gap-2"><a href={"https://wa.me/39"+pr.nutri.phone.replace(/\D/g,"")} target="_blank" className="flex-1 py-2.5 rounded-xl font-bold text-center text-sm" style={{background:"#25D366",color:"#fff"}}>💬 WhatsApp</a><a href={"tel:"+pr.nutri.phone} className="flex-1 py-2.5 rounded-xl font-bold text-center text-sm" style={{background:"var(--ac)",color:"#fff"}}>📞 Chiama</a></div>}{pr.nutri.email&&<a href={"mailto:"+pr.nutri.email} className="block text-sm font-semibold" style={{color:"var(--ac)"}}>✉️ {pr.nutri.email}</a>}{pr.nutri.nextAppt&&<div className="rounded-xl p-3 flex items-center gap-2" style={{background:"var(--m)"}}><span>📅</span><div className="font-extrabold text-sm">{new Date(pr.nutri.nextAppt+"T12:00:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})}</div></div>}{pr.nutri.address&&<a href={"https://maps.google.com/?q="+encodeURIComponent(pr.nutri.address)} target="_blank" className="rounded-xl p-3 flex items-center gap-2 block" style={{background:"var(--m)"}}><span>📍</span><span className="text-sm font-semibold">{pr.nutri.address}</span></a>}</div>):(<div className="text-center py-2 opacity-40 font-semibold text-sm">Aggiungi dati</div>)}
    </div>
    <div className="card"><div className="flex items-center justify-between mb-2"><span className="font-extrabold">🏃 Attività</span><button onClick={()=>openM("addA",{date:td(),activity:"",duration:""})} className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.plus} s={14} c="#fff"/></button></div>{data.activities.slice(-5).reverse().map(a=>(<div key={a.id} className="flex justify-between py-1.5 text-sm" style={{borderBottom:"1px solid var(--bd)"}}><b>{a.activity}</b><span style={{color:"var(--tx2)"}}>{a.duration}m · {a.date.slice(5)}</span></div>))}{!data.activities.length&&<div className="text-center py-2 opacity-25 font-semibold">—</div>}</div>
    <div className="card"><div className="flex items-center justify-between mb-2"><span className="font-extrabold">📝 Diario</span><button onClick={()=>openM("diary",{date:sel,note:data.diary[sel]||""})} className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:"var(--ac)"}}><Ic d={ic.edit} s={14} c="#fff"/></button></div>{data.diary[sel]?<p className="text-sm font-semibold">{data.diary[sel]}</p>:<div className="text-center py-2 opacity-25 font-semibold">—</div>}</div>
    <div className="card"><div className="text-xs font-black tracking-wider mb-3" style={{color:"var(--tx2)"}}>⚙️ DATI</div><div className="flex gap-2 flex-wrap"><Btn onClick={()=>exportXls(data)}>📊 Excel</Btn><Btn v="secondary" onClick={()=>{const bl=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="nutritrack.json";a.click();}}>JSON</Btn><Btn v="danger" onClick={()=>{if(confirm("Eliminare TUTTI i dati?"))setData(defD());}}>Reset</Btn></div></div>

  const biaFields=[{type:"section",label:"COMPOSIZIONE CORPOREA"},...BIA_F.filter(f=>!f.k.includes("Pct")&&!["resistenza","reattanza","naK","bmrBia","bmiBia","bcmi"].includes(f.k)).map(f=>({key:f.k,label:(f.icon||"")+" "+f.l+" ("+f.u+")",inputType:"number"})),{type:"section",label:"PERCENTUALI"},...BIA_F.filter(f=>f.k.includes("Pct")).map(f=>({key:f.k,label:f.l,inputType:"number"})),{type:"section",label:"PARAMETRI"},...BIA_F.filter(f=>["resistenza","reattanza","naK","bmrBia","bmiBia","bcmi"].includes(f.k)).map(f=>({key:f.k,label:(f.icon||"")+" "+f.l+(f.u?" ("+f.u+")":""),inputType:"number"}))];

  /* ── Import modal (complex, keeps own state) ── */

    <header className="flex-shrink-0 px-5 pt-3 pb-2"><div className="flex items-center justify-between"><div className="flex items-center gap-2.5"><div className="w-10 h-10 rounded-2xl flex items-center justify-center text-base font-black shadow" style={{background:"linear-gradient(135deg,var(--ac),var(--a2))",color:"#fff"}}>{pr.name?.[0]?.toUpperCase()}</div><div><h1 className="text-base font-black leading-tight">Ciao, {pr.name}</h1><p className="text-xs font-semibold" style={{color:"var(--tx2)"}}>{GOL.find(g=>g.id===pr.goal)?.l} · {myTdee} kcal</p></div></div>{curBmi&&<div className="text-right"><div className="text-xl font-black" style={{color:bmiC(curBmi).c}}>{curBmi}</div><div className="text-[10px] font-bold" style={{color:"var(--tx2)"}}>BMI</div></div>}</div></header>
    <main className="flex-1 overflow-y-auto px-4 pb-24">{tab==="today"&&renderToday()}{tab==="schema"&&renderSchema()}{tab==="shop"&&renderShop()}{tab==="progress"&&renderProgress()}{tab==="more"&&renderMore()}</main>
    <nav className="flex-shrink-0 fixed bottom-0 left-0 right-0 flex justify-around py-2 pb-3 z-40 shadow-lg" style={{background:"var(--cd)",borderTop:"1px solid var(--bd)"}}>{[{id:"today",l:"Oggi",i:ic.home},{id:"schema",l:"Dieta",i:ic.list},{id:"shop",l:"Spesa",i:ic.cart},{id:"progress",l:"Progressi",i:ic.chart},{id:"more",l:"Altro",i:ic.user}].map(t=>(<button key={t.id} onClick={()=>setTab(t.id)} className="flex flex-col items-center gap-0.5 py-1 px-2" style={{color:tab===t.id?"var(--ac)":"var(--tx2)",opacity:tab===t.id?1:.45}}><Ic d={t.i} s={20} c={tab===t.id?"var(--ac)":"var(--tx2)"}/><span className="text-[10px] font-bold">{t.l}</span>{tab===t.id&&<div className="w-1.5 h-1.5 rounded-full" style={{background:"var(--ac)"}}/>}</button>))}</nav>
    {/* Toast */}
    {toast&&<div className="toast">{toast}</div>}
    {/* Modals using FormModal (isolated state = keyboard stays open) */}
    <ImportModal/>
    <FormModal open={modal==="addMeal"} onClose={()=>setModal(null)} title="🍽️ Pasto" initData={modalInit} fields={[{key:"mealType",label:"Pasto",type:"select",options:MT},{key:"food",label:"Alimenti"}]} onSave={f=>{if(!f.food?.trim())return;up(d=>{if(!d.mealPlans[sel])d.mealPlans[sel]=[];d.mealPlans[sel].push({id:gid(),mealType:f.mealType,food:f.food.trim()});});}}/>
    <FormModal open={modal==="addW"} onClose={()=>setModal(null)} title="⚖️ Peso" initData={modalInit} fields={[{key:"date",label:"Data",inputType:"date"},{key:"value",label:"Peso (kg)",inputType:"number"}]} onSave={f=>{if(!f.value)return;up(d=>{d.weightLog.push({date:f.date,value:parseFloat(f.value)});d.weightLog.sort((a,b)=>a.date.localeCompare(b.date));});}}/>
    <FormModal open={modal==="editW"} onClose={()=>setModal(null)} title="✏️ Peso" initData={modalInit} fields={[{key:"date",label:"Data",inputType:"date"},{key:"value",label:"Peso (kg)",inputType:"number"}]} onSave={f=>{if(!f.value)return;up(d=>{d.weightLog[modalInit.eidx]={date:f.date,value:parseFloat(f.value)};d.weightLog.sort((a,b)=>a.date.localeCompare(b.date));});}}/>
    <FormModal open={modal==="addM"} onClose={()=>setModal(null)} title="📏 Misurazioni" initData={modalInit} fields={[{key:"date",label:"Data",inputType:"date"},...BP.map(p=>({key:p,label:p+" (cm)",inputType:"number"}))]} onSave={f=>{const en={id:gid(),date:f.date};BP.forEach(p=>{if(f[p])en[p]=f[p];});up(d=>{d.measurements.push(en);d.measurements.sort((a,b)=>a.date.localeCompare(b.date));});}}/>
    <FormModal open={modal==="editM"} onClose={()=>setModal(null)} title="✏️ Misurazioni" initData={modalInit} fields={[{key:"date",label:"Data",inputType:"date"},...BP.map(p=>({key:p,label:p+" (cm)",inputType:"number"}))]} onSave={f=>{const en={id:data.measurements[modalInit.midx]?.id||gid(),date:f.date};BP.forEach(p=>{if(f[p])en[p]=f[p];});up(d=>{d.measurements[modalInit.midx]=en;d.measurements.sort((a,b)=>a.date.localeCompare(b.date));});}}/>
    <FormModal open={modal==="addBia"} onClose={()=>setModal(null)} title="🔬 Nuova BIA" initData={modalInit} fields={[{key:"biaDate",label:"Data esame",inputType:"date"},...biaFields]} onSave={f=>{const en={date:f.biaDate};BIA_F.forEach(x=>{if(f[x.k])en[x.k]=f[x.k];});up(d=>{if(!d.biaLog)d.biaLog=[];d.biaLog.push(en);d.biaLog.sort((a,b)=>a.date.localeCompare(b.date));});}}/>
    <FormModal open={modal==="editBia"} onClose={()=>setModal(null)} title="✏️ BIA" initData={modalInit} fields={[{key:"biaDate",label:"Data esame",inputType:"date"},...biaFields]} onSave={f=>{const en={date:f.biaDate};BIA_F.forEach(x=>{if(f[x.k])en[x.k]=f[x.k];});up(d=>{if(!d.biaLog)d.biaLog=[];d.biaLog[modalInit.biaIdx]=en;d.biaLog.sort((a,b)=>a.date.localeCompare(b.date));});}}/>
    <FormModal open={modal==="addA"} onClose={()=>setModal(null)} title="🏃 Attività" initData={modalInit} fields={[{key:"date",label:"Data",inputType:"date"},{key:"activity",label:"Attività"},{key:"duration",label:"Durata (min)",inputType:"number"}]} onSave={f=>{if(!f.activity)return;up(d=>{d.activities.push({id:gid(),date:f.date,activity:f.activity,duration:f.duration||"0"});});}}/>
    <FormModal open={modal==="editNutri"} onClose={()=>setModal(null)} title="🩺 Nutrizionista" initData={modalInit} fields={[{key:"nN",label:"Nome"},{key:"nP",label:"Telefono",inputType:"tel"},{key:"nE",label:"Email"},{key:"nA",label:"Indirizzo"},{key:"nD",label:"Prossimo appuntamento",inputType:"date"},{key:"nO",label:"Note",type:"textarea"}]} onSave={f=>{up(d=>{d.profile.nutri={name:f.nN||"",phone:f.nP||"",email:f.nE||"",address:f.nA||"",nextAppt:f.nD||"",notes:f.nO||""};});}}/>
    <FormModal open={modal==="diary"} onClose={()=>setModal(null)} title="📝 Diario" initData={modalInit} fields={[{key:"note",label:"Come ti senti?",type:"textarea"}]} onSave={f=>{up(d=>{d.diary[modalInit.date]=f.note;});}}/>
  </div>);}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}</script>
</body>
</html>
